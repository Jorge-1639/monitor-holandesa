<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ea580c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Control Holandesa</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="/icono_panel_180.png?v=31"><link rel="icon" href="/icono_panel_192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..900&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Una columna tamaño teléfono: encabezado verde con fecha, contenido en tarjetas, barra de pestañas abajo */
:root{
  --bg:#fbf6f1; --surface:#ffffff; --surface-2:#fbf7f3; --ink:#1f1a17; --muted:#6b5e55; --line:#efe3d8;
  --green:#ea580c; --green-2:#c2410c; --green-3:#ea580c; --green-soft:#ffedd5; --bar:#f97316; --bar-dim:#fed7aa;
  --gold:#b45309; --gold-soft:#fef3c7; --hero-small:#1c0a02;
  --good:#1d7a46; --good-bg:#e2f3e8; --warn:#9a6400; --warn-bg:#fcf0d6; --bad:#b4342b; --bad-bg:#fbe6e3;
  --shadow:0 1px 2px rgba(124,45,18,.06),0 6px 18px -10px rgba(124,45,18,.18);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hero-ink:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#120d0a; --surface:#1c1511; --surface-2:#231a15; --ink:#f3ebe5; --muted:#ab9b8f; --line:#33261e;
  --green:#ea580c; --green-2:#fb923c; --green-3:#f97316; --green-soft:#3a2010; --bar:#f97316; --bar-dim:#5a2f14;
  --gold:#fbbf24; --gold-soft:#2c2416;
  --good:#7fd6a0; --good-bg:#16301f; --warn:#f0bf5a; --warn-bg:#33280f; --bad:#f08b80; --bad-bg:#3a1a17;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120d0a; --surface:#1c1511; --surface-2:#231a15; --ink:#f3ebe5; --muted:#ab9b8f; --line:#33261e;
  --green:#ea580c; --green-2:#fb923c; --green-3:#f97316; --green-soft:#3a2010; --bar:#f97316; --bar-dim:#5a2f14;
  --gold:#fbbf24; --gold-soft:#2c2416;
  --good:#7fd6a0; --good-bg:#16301f; --warn:#f0bf5a; --warn-bg:#33280f; --bad:#f08b80; --bad-bg:#3a1a17;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);margin:0;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit}
button:focus-visible,select:focus-visible,summary:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* encabezado */
header.top{position:sticky;top:0;z-index:20;background:var(--green);color:var(--hero-ink);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px;box-shadow:0 6px 20px -12px rgba(0,0,0,.5)}
.hin{max-width:720px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{font:900 19px/1 var(--display);font-stretch:72%;letter-spacing:.06em;margin:0;text-transform:uppercase}
.brand h1 span{color:var(--hero-small);font-weight:700}
@media (max-width:430px){.brand h1 span{display:none}}
.live{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.85;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.live.off i{background:#1c0a02;box-shadow:0 0 0 3px rgba(28,10,2,.2)}
.datebar{display:flex;align-items:center;gap:8px;margin-top:10px}
.datebar button{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:10px;width:40px;height:40px;font-size:20px;cursor:pointer}
.datebar button:disabled{opacity:.3;cursor:default}
.datebar select{flex:1;min-width:0;height:40px;border:0;border-radius:10px;background:rgba(255,255,255,.18);color:inherit;font:600 15px var(--body);padding-inline:12px;appearance:none;-webkit-appearance:none;text-transform:capitalize}
.datebar select option{color:#14221a}

.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.note{margin:14px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--ink);font-size:13px}
section{display:flex;flex-direction:column;gap:12px;margin-top:14px}

/* barra de pestañas inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px -18px rgba(0,0,0,.35)}
nav.tabs .tin{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.tabs button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font:700 11px var(--display);font-stretch:85%;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;position:relative}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--green-2);background:var(--green-soft)}
nav.tabs .dot{position:absolute;top:2px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font:700 10px/17px var(--body);letter-spacing:0}

/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;box-shadow:var(--shadow)}
/* Personal (Recursos Humanos): tarjetas con contorno azul clarito */
:root{--rh-borde:#a8d1f0;--rh-t:#111113;--rh-t-bg:#e6e6e9;--rh-t-bd:#a1a1aa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rh-borde:#3d6688;--rh-t:#f4f4f5;--rh-t-bg:#3a3a40;--rh-t-bd:#5a5a62}}
:root[data-theme="dark"]{--rh-borde:#3d6688;--rh-t:#f4f4f5;--rh-t-bg:#3a3a40;--rh-t-bd:#5a5a62}
body.rh .card,body.rh .kpi{border:1.5px solid var(--rh-borde)}
/* Personal en blancos y grises (29.2) */
body.rh{--bg:#f3f3f4;--surface:#ffffff;--surface-2:#f4f4f5;--ink:#1c1c1f;--muted:#6b6b73;--line:#e3e3e6;--green:#3f3f46;--green-2:#3f3f46;--green-3:#71717a;--green-soft:#ececee;--bar:#52525b;--bar-dim:#d4d4d8;--hero-small:#71717a;--hero-ink:#1c1c1f;--gold:#52525b;--rh-borde:#d4d4d8;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px -12px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.rh{--bg:#111113;--surface:#1b1b1e;--surface-2:#232327;--ink:#f4f4f5;--muted:#a1a1aa;--line:#2e2e33;--green:#d4d4d8;--green-2:#d4d4d8;--green-3:#a1a1aa;--green-soft:#2a2a2e;--bar:#a1a1aa;--bar-dim:#3f3f46;--hero-small:#a1a1aa;--hero-ink:#f4f4f5;--gold:#a1a1aa;--rh-borde:#3a3a40}}
:root[data-theme="dark"] body.rh{--bg:#111113;--surface:#1b1b1e;--surface-2:#232327;--ink:#f4f4f5;--muted:#a1a1aa;--line:#2e2e33;--green:#d4d4d8;--green-2:#d4d4d8;--green-3:#a1a1aa;--green-soft:#2a2a2e;--bar:#a1a1aa;--bar-dim:#3f3f46;--hero-small:#a1a1aa;--hero-ink:#f4f4f5;--gold:#a1a1aa;--rh-borde:#3a3a40}
body.rh .live i{background:var(--muted);box-shadow:0 0 0 3px var(--line)}
body.rh header.top{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line),0 6px 16px -14px rgba(0,0,0,.3)}
.rhhr input[type=time]::-webkit-calendar-picker-indicator{display:none}
.rhmodal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;padding:14px}
.rhmodal-in{background:var(--surface);color:var(--ink);border-radius:16px;padding:16px;width:100%;max-width:460px;max-height:88vh;overflow:auto;box-shadow:0 20px 50px -10px rgba(0,0,0,.45)}
.rhtab .rhd{width:100%;max-width:46px;height:56px;padding:2px 0;line-height:1.05}
.rhtab .rhdh{display:block;font:700 10.5px var(--body);letter-spacing:-.02em;margin-top:3px}
.rhtab .rhdh span{display:block}
.rhtab tr.rhdias th{border-bottom:1px solid var(--line)}
@media (min-width:560px){.rhtab .rhd{max-width:84px;height:66px;font-size:16px!important}.rhtab .rhdh{font-size:14px}.rhtab colgroup col{width:110px!important}}.rhhr input[type=time]{font-variant-numeric:tabular-nums;text-align:center}
.card h2{font:800 14px var(--display);text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px;color:var(--green-2);display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h2 small{font:500 12px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.hero{background:linear-gradient(150deg,#ea580c 0%,#f97316 100%);color:#fff;border-radius:20px;padding:20px;box-shadow:0 14px 30px -18px rgba(234,88,12,.8);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:1px solid rgba(255,255,255,.3)}
.hero .lbl{font:700 12px var(--display);text-transform:uppercase;letter-spacing:.14em;color:var(--gold)}
:root .hero .lbl{color:var(--hero-small)}
.hero .big{font:800 46px/1.02 var(--display);font-stretch:78%;margin:6px 0 10px;letter-spacing:-.01em}
.hero .cmp{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.hero .cmp span{background:rgba(255,255,255,.38);color:var(--hero-small);font-weight:600;border-radius:20px;padding:3px 10px}
.hero .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.3)}
.hero .mini b{display:block;font:800 21px/1.1 var(--display);font-stretch:85%}
.hero .mini span{font-size:11.5px;color:var(--hero-small);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi b{display:block;font:800 22px/1.1 var(--display);font-stretch:85%}
.kpi span{color:var(--muted);font-size:12px}

/* alertas */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;font-size:13px;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);text-align:left}
.chip b{font:800 18px var(--display);font-stretch:85%}
.chip.bad{border-color:transparent;background:var(--bad-bg)} .chip.bad b{color:var(--bad)}
.chip.warn{border-color:transparent;background:var(--warn-bg)} .chip.warn b{color:var(--warn)}
.chip.good{border-color:transparent;background:var(--good-bg)} .chip.good b{color:var(--good)}

/* barras */
.rows{display:flex;flex-direction:column;gap:11px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:baseline}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{font-weight:700}
.row .track{grid-column:1/-1;height:8px;background:var(--green-soft);border-radius:5px;overflow:hidden}
.row .track i{display:block;height:100%;background:linear-gradient(90deg,var(--green-2),var(--bar));border-radius:5px}
.row .sub{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-2px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--body)}
.chart .lab{fill:var(--ink);font-weight:700}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item .meta{grid-column:1/-1;color:var(--muted);font-size:12px}
.pill{display:inline-block;font:700 10.5px var(--body);padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em;vertical-align:1px}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.gold{background:var(--gold-soft);color:var(--gold)} .pill.mut{background:var(--surface-2);color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;padding:2px 0;margin:0}
.ledger{width:100%;border-collapse:collapse;font-size:14px}
.ledger td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.ledger td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:10px}
.ledger tr.tot td{border-top:2px solid var(--ink);font-weight:800}
.ledger tr:first-child td{border-top:0}

/* selectores */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
.seg::-webkit-scrollbar{display:none}
.seg.seg-wrap{flex-wrap:wrap;overflow:visible}.seg.seg-wrap button{flex:1 1 auto}   /* 30.7.56: todos los botones de Reportes a la vista */
.seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:6px 13px;font:600 13px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green-2);border-color:var(--green-2);color:var(--surface)}
:root .seg button[aria-pressed="true"]{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0b120e}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0b120e}
.seg.big button{padding:9px 16px;font-size:14px}
.dates{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:14px}
.dates input{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 14px var(--body);padding:0 8px}

.tscroll{overflow-x:auto}
table.tk{border-collapse:collapse;width:100%;font-size:13px}
table.tk th{text-align:left;color:var(--muted);font-weight:600;padding:5px 4px;border-bottom:1px solid var(--line);font-size:12px}
table.tk td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.tk td.r,table.tk th.r{text-align:right;white-space:nowrap}
table.tk tr.fam td{padding-top:14px;font-weight:700;color:var(--green-2);border-bottom:0}
table.tk tr.fam td span{color:var(--muted);font-weight:500}
table.tk tr.tt td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}

/* tickets */
.tkt{padding:13px 15px}
.tkt summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--ink);font-size:14px;margin:0}
.tkt summary::-webkit-details-marker{display:none}
.tk-top{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.tk-meta{color:var(--muted);font-size:12.5px}
.tk-meta b{color:var(--ink);font-weight:600}
.tk-items{margin-top:10px;font-size:13.5px}
.tk-items tr.pg td{color:var(--muted);font-weight:500}
.tkt.abierta{border-left:4px solid #2f6fd6}
.tkt.abierta.corte1{border-left-color:#e0a800;background:#fff7d6}
.tkt.abierta.corte2{border-left-color:#c62828;background:#fde4e2}
.pill.amarillo{background:#ffe9a6;color:#7a5600}
.pill.rojo{background:#c62828;color:#fff}
.tkt.vieja{border-left-color:var(--bad)}
.dot-a,.dot-c{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.dot-a{background:#2f6fd6}.dot-c{background:#16a34a}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;font:600 14px var(--body);cursor:pointer;text-decoration:none}
.btn.pri{background:var(--green-2);border-color:var(--green-2);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#0b120e}}
:root[data-theme="dark"] .btn.pri{color:#0b120e}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost-bad{color:var(--bad);border-color:var(--bad-bg);background:var(--bad-bg)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.corte-h{font:800 16px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--green-2);margin:10px 0 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.corte-h small{font:500 12px var(--body);color:var(--muted);letter-spacing:0;text-transform:none}
.corte-tot{border-color:var(--green-3);background:var(--green-soft)}
.audit{font:12.5px/1.45 ui-monospace,"Cascadia Mono","Consolas","Menlo",monospace;margin:0;white-space:pre;color:var(--ink)}
.sep{font:12.5px ui-monospace,"Consolas",monospace;color:var(--muted);margin:8px 0;white-space:pre;overflow:hidden}

/* renglones que se abren con un toque */
.dtab{display:flex;flex-direction:column}
.drow{border-top:1px solid var(--line)}.dtab>:first-child{border-top:0}
.drow>summary{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:10px 0;margin:0;color:var(--ink);font-weight:500;font-size:14px;cursor:pointer}
.drow>summary::-webkit-details-marker{display:none}
.drow>summary>span:first-child::before{content:'';display:inline-block;width:7px;height:7px;border-right:2px solid var(--green-3);border-bottom:2px solid var(--green-3);transform:rotate(-45deg);margin:0 9px 1px 1px;transition:transform .15s}
.drow[open]>summary>span:first-child::before{transform:rotate(45deg)}
.drow>summary .num{font-weight:700;white-space:nowrap}.drow small,.dgrp small{color:var(--muted);font-weight:400}
.dlist{padding:2px 0 10px 14px;border-left:2px solid var(--green-soft);margin:0 0 8px 4px}
.ditem,.dgrp,.dfix{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0}
.ditem>span:last-child,.dgrp>span:last-child{white-space:nowrap}
.ditem small{display:block;color:var(--muted);font-size:12px}
.dgrp{font-weight:700;color:var(--green-2);padding-top:9px}
.dfix{font-size:14px;border-top:1px solid var(--line);padding:10px 0 10px 18px}.dfix .num{font-weight:700;white-space:nowrap}
.dfix.tot{border-top:2px solid var(--ink);font-weight:800}.dfix.tot .num{font-weight:800}
.dh3{font:800 12px var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:16px 0 4px}
.dh3:first-of-type{margin-top:4px}

/* mapa de calor */
.heat{display:grid;gap:3px;font-size:10.5px;color:var(--muted)}
.heat .c{height:26px;border-radius:5px;background:var(--surface-2)}
.heat .h{text-align:center;align-self:end}
.heat .d{align-self:center;font-weight:600;color:var(--ink);font-size:11.5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .w{text-align:center;font:700 11px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-bottom:2px}
.cal .x{border-radius:9px;padding:5px 4px;min-height:48px;background:var(--surface-2);display:flex;flex-direction:column;justify-content:space-between;font-size:11px;line-height:1.15}
.cal .x b{font-size:11.5px;color:var(--ink)} .cal .x span{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.cal .x.hi{outline:2px solid var(--green-3)} .cal .x.lo{outline:2px solid var(--bad)}
.cal .x.vacio{background:none}
select.msel{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:0 10px;max-width:100%}
.vs{display:grid;grid-template-columns:1fr auto auto auto;gap:0 10px;font-size:13.5px}
.vs>div{padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}

.mot button small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.mot button[aria-pressed="true"]{border-color:var(--green-2);background:var(--green-soft)}
.field{margin-top:14px}

footer{color:var(--muted);font-size:12px;margin-top:24px;line-height:1.5}

.ticketP{width:min(100%,calc(42ch + 28px));font:12.5px/1.25 ui-monospace,Menlo,Consolas,monospace;background:#fff;color:#111;padding:14px;border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.18);overflow:hidden}

.ticketP .tcorte{margin-top:10px;text-align:center;color:#999;font-size:11px}
.pl-wrap{position:relative;width:100%;aspect-ratio:100/80;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:8px;touch-action:none;user-select:none}
.pl-wrap.ed{background-image:linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px);background-size:10% 12.5%;outline:2px dashed var(--green-3);outline-offset:-2px}
.pl-g{position:absolute;display:flex;gap:2px;cursor:grab}.pl-g.v{flex-direction:column}
.pl-m{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;border:2px solid #f0b37a;background:#fff;color:#1a1a1a;border-radius:8px;font:800 14px/1 var(--body)}

.pl-e.v span{writing-mode:vertical-rl}
.pl-wrap.ed .sel .pl-m,.pl-wrap.ed .pl-e.sel{border-color:#1f7a45;background:#e3f4ea;box-shadow:0 0 0 3px rgba(31,122,69,.25)}

</head><body>
<header class="top"><div class="hin">

</div>
<nav class="tabs" role="tablist"><div class="tin">
  <button role="tab" data-tab="hoy"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Hoy</button>
  <button role="tab" data-tab="tickets"><svg viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Tickets<span class="dot" id="tkDot" hidden></span></button>

  <button role="tab" data-tab="control"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Control<span class="dot" id="ctlDot" hidden></span></button>

</div></nav>

<script>
// Bloqueo con huella: en el teléfono que activó la huella, se pide al abrir la app y al regresar después de 1 minuto fuera
(()=>{
  if(window.__COPIA__||/^\/(captura|comandero|descansos)/.test(location.pathname)||!window.isSecureContext)return;
  let conHuella=false;try{conHuella=localStorage.getItem('hol_huella')==='1'}catch(e){}
  if(!conHuella)return;
  const bloquear=()=>{document.documentElement.style.visibility='hidden';try{sessionStorage.removeItem('hol_ok')}catch(e){}
    fetch('/api/salir',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',credentials:'same-origin'}).catch(()=>{}).finally(()=>location.reload())};
  let ok=false;try{ok=sessionStorage.getItem('hol_ok')==='1'}catch(e){}
  if(!ok){bloquear();return}   // la app se abrió de nuevo: pedir huella
  let fuera=0;
  document.addEventListener('visibilitychange',()=>{if(document.hidden)fuera=Date.now();else if(fuera&&Date.now()-fuera>60000)bloquear()});
})();
// Si la sesión terminó, cualquier consulta regresa 401 con login:true: se recarga y aparece la pantalla de entrada (huella o contraseña)
if(!window.__COPIA__&&!/^\/(captura|comandero|descansos)/.test(location.pathname)){const _f=window.fetch.bind(window);window.fetch=async(...a)=>{const r=await _f(...a);
  if(r.status===401){try{const j=await r.clone().json();if(j&&j.login){location.reload();return new Promise(()=>{})}}catch(e){}}return r}}
let DATA=null, byDate={}, days=[];
const $=s=>document.querySelector(s);
const COPIA=!!window.__COPIA__;
if(COPIA){document.getElementById('tabCmd').remove();document.querySelector('nav.tabs .tin').style.gridTemplateColumns='repeat(5,1fr)'}
const fmt=n=>'$'+(Math.round(n||0)).toLocaleString('es-MX');
const fmt2=n=>'$'+(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DC=['dom','lun','mar','mié','jue','vie','sáb'];
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const lbl=s=>{const d=pd(s);return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`};
const corto=s=>{const x=pd(s);return DC[x.getDay()]+' '+x.getDate()+' '+MESES[x.getMonth()]};
const shift=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const pl=(n,s,p)=>n+' '+(n===1?s:(p||s+'s'));
const pct=(a,b)=>b?(100*a/b).toFixed(1)+'%':'0%';
const sumI=a=>a.reduce((x,y)=>x+(y.importe||0),0);
const nomT=t=>t==='1'?'Mañana':t==='2'?'Tarde':'Turno '+t;
const ORD=['Efectivo','Efectivo (dólares)','Tarjeta crédito','Tarjeta débito','Tarjeta crédito/débito','Transferencia'];
const ordF=o=>Object.entries(o).sort((a,b)=>{const i=ORD.indexOf(a[0]),j=ORD.indexOf(b[0]);return (i<0?99:i)-(j<0?99:j)});
const dur=m=>m==null?'':m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min';
const MOTIVOS_INFO={'Familia':'Comida de la familia','Empleado':'Se descuenta de nómina','Comida de empleado':'Regalada · no se descuenta','Cortesía':'Cupón o regalo a cliente','Didi · efectivo':'Pedido Didi pagado en efectivo','Didi · tarjeta':'Pedido Didi pagado con tarjeta','Uber · efectivo':'Pedido Uber en efectivo','Uber · tarjeta':'Pedido Uber con tarjeta','Error de captura':'Se capturó por error','Otro':'Otro motivo','Sin clasificar':'Sin motivo todavía'};
const pillMot=m=>`<span class="pill ${m==='Familia'||m==='Empleado'||m==='Comida de empleado'||m==='Cortesía'?'gold':m.startsWith('Didi')||m.startsWith('Uber')?'good':m==='Error de captura'?'warn':'mut'}">${esc(m)}</span>`;
const st={};try{Object.assign(st,JSON.parse(localStorage.getItem('hol_v20')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('hol_v20',JSON.stringify(st))}catch(e){}};
const RHMODE=!COPIA&&location.pathname.startsWith('/personal');   // app aparte de Recursos Humanos (mismo programa, otro ícono)
let cur=null, tab=['hoy','tickets','cortes','control','reportes'].includes(st.tab)?st.tab:'hoy';
let prodModo='top', prodT='dia', tkModo='tarjetas', tkT='dia', corteModo='dia', pDesde=null, pHasta=null, repModo=st.rep||'historial', rDesde=null, rHasta=null;
const sel=$('#day');

// piezas comunes
function bars(items,max){
  max=max||Math.max(1,...items.map(i=>i.v));
  return `<div class="rows">${items.map(i=>`<div class="row"><span class="n">${i.nh??esc(i.n)}</span><span class="v num">${i.vs??fmt(i.v)}</span><span class="track"><i style="width:${Math.max(1.5,100*i.v/max)}%"></i></span>${i.sub?`<span class="sub">${i.sub}</span>`:''}</div>`).join('')}</div>`;
}
function niceMax(m){const p=Math.pow(10,Math.floor(Math.log10(m)));for(const k of[1,2,2.5,5,10])if(k*p>=m)return k*p;return 10*p}
function colChart(vals,labels,{h=150,hl=-1,every=1,fmtTop=null}={}){
  const n=vals.length||1,W=340,pad=26,R=10,bw=(W-pad-R)/n,max=Math.max(1,...vals);
  const nice=niceMax(max),ticks=[0,nice/2,nice];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h+22}" role="img">`;
  ticks.forEach(t=>{const y=h-(t/nice)*(h-16);s+=`<line x1="${pad}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="0" y="${y+4}">${t>=1000?(t/1000)+'k':t}</text>`});
  vals.forEach((v,i)=>{const bh=(v/nice)*(h-16),x=pad+i*bw+bw*.14,w=bw*.72;
    s+=`<rect x="${x}" y="${h-bh}" width="${w}" height="${Math.max(bh,0)}" rx="3" fill="${i===hl?'var(--green-3)':'var(--bar-dim)'}"><title>${labels[i]}: ${fmt(v)}</title></rect>`;
    if(i%every===0||i===hl) s+=`<text x="${x+w/2}" y="${h+15}" text-anchor="middle" ${i===hl?'class="lab"':''}>${labels[i]}</text>`;
    if(fmtTop&&i===hl) s+=`<text class="lab" x="${Math.min(Math.max(x+w/2,30),W-30)}" y="${Math.max(h-bh-6,10)}" text-anchor="middle">${fmtTop(v)}</text>`;
  });
  return s+'</svg>';
}
const fila=(label,monto,det,n)=>`<details class="drow"><summary><span>${label}${n!=null?` <small>(${n})</small>`:''}</span><span class="num">${monto}</span></summary><div class="dlist">${det||'<p class="empty">Sin movimientos.</p>'}</div></details>`;
const fijo=(label,monto,cls)=>`<div class="dfix ${cls||''}"><span>${label}</span><span class="num">${monto}</span></div>`;
const linea=(a,b,c)=>`<div class="ditem"><span>${a}${c?`<small>${c}</small>`:''}</span><span class="num">${b}</span></div>`;
const grupoMov=(L,conDia)=>{const g={};L.forEach(e=>(g[e.cat]=g[e.cat]||[]).push(e));
  return Object.entries(g).sort((a,b)=>sumI(b[1])-sumI(a[1])).map(([k,v])=>`<div class="dgrp"><span>${esc(k)} <small>(${v.length})</small></span><span class="num">${fmt2(sumI(v))}</span></div>`+v.map(e=>linea(esc(e.ref),fmt2(e.importe),(conDia&&e.d?corto(e.d)+' · ':'')+esc(e.hora||'')+(conDia?' · '+nomT(e.turno):''))).join('')).join('')};
const tkPorForma=(ts,f)=>{const L=[];ts.forEach(t=>t.pagos.forEach(([ff,a])=>{if(ff===f)L.push([t,a])}));return L};
const lugar=t=>t.mesa?'Mesa '+esc(t.mesa):(t.llevar?'Para llevar':'Sin mesa');
const segBtns=(attr,opts,val)=>`<div class="seg">${opts.map(([k,l])=>`<button data-${attr}="${k}" aria-pressed="${val===k}">${l}</button>`).join('')}</div>`;
const esHoy=()=>cur===days[days.length-1];
const ultimoDia=()=>{const h=iso(new Date()),u=days[days.length-1];return u>h?u:h};
function rangoRapido(k){const u=pd(ultimoDia());const w=(u.getDay()+6)%7;let a,b;
  if(k==='hoy'){a=u;b=u}
  else if(k==='ayer'){a=new Date(u);a.setDate(u.getDate()-1);b=a}
  else if(k==='semana'){a=new Date(u);a.setDate(u.getDate()-w);b=u}
  else if(k==='semana_ant'){a=new Date(u);a.setDate(u.getDate()-w-7);b=new Date(a);b.setDate(a.getDate()+6)}
  else if(k==='mes'){a=new Date(u.getFullYear(),u.getMonth(),1);b=u}
  else if(k==='mes_ant'){a=new Date(u.getFullYear(),u.getMonth()-1,1);b=new Date(u.getFullYear(),u.getMonth(),0)}
  else {a=new Date(u);a.setDate(u.getDate()-29);b=u}
  return [iso(a),iso(b)]}
const QUICK=[['semana','Esta semana'],['semana_ant','Semana pasada'],['mes','Este mes'],['mes_ant','Mes pasado'],['30','30 días']];
function selectorFechas(pre,desde,hasta){
  return `<div class="seg">${QUICK.map(([k,l])=>{const [a,b]=rangoRapido(k);return `<button data-${pre}q="${k}" aria-pressed="${a===desde&&b===hasta}">${l}</button>`}).join('')}</div>
  <div class="dates"><label>Del <input type="date" id="${pre}D" value="${desde}" max="${ultimoDia()}"></label><label>al <input type="date" id="${pre}H" value="${hasta}" max="${ultimoDia()}"></label></div>`}

// alertas del día
function alertas(D){
  const out=[];
  const AB=esHoy()?(DATA.abiertas||[]):[];
  if(AB.length){const now=Date.now();const viejas=AB.filter(a=>{if(!a.fecha||!a.abrio)return false;return a.fecha<cur||(now-new Date(a.fecha+'T'+a.abrio+':00'))/6e4>=120});
    const deCorte=AB.filter(a=>(a.cortes||0)>=1);
    out.push({cls:viejas.length?'bad':'warn',n:AB.length,t:`mesas abiertas · ${fmt(AB.reduce((x,a)=>x+a.total,0))}${deCorte.length?` · ${deCorte.length} de cortes anteriores`:viejas.length?` · ${viejas.length} de más de 2 h`:''}`,go:'tickets'})}
  const falt=D.cortes.filter(c=>c.dif!=null&&c.dif<-20);
  if(falt.length) out.push({cls:'bad',n:fmt(-falt.reduce((x,c)=>x+c.dif,0)),t:`faltante en ${falt.length===1?'el corte':'los cortes'}`,go:'cortes'});
  else if(D.cortes.length&&D.cortes.every(c=>c.dif!=null&&Math.abs(c.dif)<=20)) out.push({cls:'good',n:'✓',t:'cortes cuadrados',go:'cortes'});
  const n=D.borrados.length+D.cancelados.length+D.precios.length;
  if(n) out.push({cls:'warn',n,t:'en control: borrados, cancelados o precios',go:'control'});
  if(D.descuentos.length) out.push({cls:'',n:fmt(D.descuentos.reduce((a,b)=>a+b.monto,0)),t:`en ${D.descuentos.length} descuentos`,go:'control'});
  const q=(DATA.quitadas||[]).filter(r=>r.fecha===cur);
  if(q.length) out.push({cls:'',n:q.length,t:`cuentas quitadas · ${fmt(q.reduce((a,r)=>a+(r.total||0),0))}`,go:'control'});
  return out.length?`<div class="chips">${out.map(a=>`<button class="chip ${a.cls}" data-go="${a.go}"><b class="num">${a.n}</b><span>${a.t}</span></button>`).join('')}</div>`:'';
}

// ---------- HOY
function delta(a,b,txt){if(!b||!b.total)return '';const p=Math.round(100*(a-b.total)/b.total);return `<span>${p>=0?'▲':'▼'} ${Math.abs(p)}% vs ${txt}</span>`}
function vHoy(D){
  const prom=D.tickets?D.total/D.tickets:0;
  const prev=byDate[shift(cur,-1)], wk=byDate[shift(cur,-7)];
  const hk=Object.keys(D.hora).map(Number).filter(h=>D.hora[h]>0);
  const h0=Math.min(8,...hk), h1=Math.max(22,...hk);
  const hrs=[];for(let h=h0;h<=h1;h++)hrs.push(h);
  const hv=hrs.map(h=>D.hora[h]||0), peak=hv.indexOf(Math.max(...hv));
  const totF=Object.values(D.formas).reduce((a,b)=>a+b,0)||1;
  return `<section>
  <div class="hero"><div class="lbl">Venta ${esHoy()&&D.abierto?'de hoy · en curso':'del día'}</div><div class="big num">${fmt2(D.total)}</div>
    <div class="cmp">${delta(D.total,prev,'día anterior')}${delta(D.total,wk,DC[pd(cur).getDay()]+' pasado')}</div>
    <div class="mini"><div><b class="num">${D.tickets}</b><span>tickets</span></div><div><b class="num">${fmt(prom)}</b><span>ticket promedio</span></div><div><b class="num">${D.personas}</b><span>comensales</span></div></div></div>
  ${alertas(D)}
  <div class="card"><h2>Ventas por hora <small>${hv[peak]?'Hora pico '+hrs[peak]+':00':''}</small></h2>${colChart(hv,hrs.map(String),{hl:peak,every:2,fmtTop:fmt})}</div>
  <div class="card"><h2>Formas de pago</h2>${bars(ordF(D.formas).map(([n,v])=>({n,v,vs:fmt2(v),sub:Math.round(100*v/totF)+'% del total'})))}
    ${D.llevar.tickets?`<p class="empty" style="margin-top:12px">Recoger aquí: ${D.llevar.tickets} tickets · ${fmt2(D.llevar.total)}</p>`:''}</div>
  <div class="card"><h2>Por mesero</h2>${bars(D.meseros.map(m=>({n:m.n,v:m.total,sub:m.tk+' tickets · promedio '+fmt(m.total/m.tk)})))}</div>
  ${cardProductos(D)}
  </section>`;
}
function cardProductos(D){
  const turnos=[...new Set(D.lista.map(t=>t.turno))].sort();
  if(prodT!=='dia'&&!turnos.includes(prodT)) prodT='dia';
  const m=new Map();
  D.lista.filter(t=>prodT==='dia'||t.turno===prodT).forEach(t=>t.items.forEach(i=>{const o=m.get(i.n)||{n:i.n,q:0,imp:0,f:i.f||'Otros'};o.q+=i.q;o.imp+=i.imp;m.set(i.n,o)}));
  const ps=[...m.values()].sort((a,b)=>b.imp-a.imp), tot=ps.reduce((a,p)=>a+p.imp,0)||1, pz=ps.reduce((a,p)=>a+p.q,0);
  let body;
  if(prodModo==='cat'){
    const g=new Map();ps.forEach(p=>{if(!g.has(p.f))g.set(p.f,[]);g.get(p.f).push(p)});
    const gs=[...g.entries()].sort((a,b)=>b[1].reduce((x,p)=>x+p.imp,0)-a[1].reduce((x,p)=>x+p.imp,0));
    body=`<div class="tscroll"><table class="tk num"><thead><tr><th>Producto</th><th class="r">Cant.</th><th class="r">Venta</th><th class="r">%</th></tr></thead>
      ${gs.map(([f,L])=>{const s=L.reduce((x,p)=>x+p.imp,0);return `<tbody><tr class="fam"><td colspan="4">${esc(f)} <span>· ${L.reduce((x,p)=>x+p.q,0)} pzas · ${fmt(s)} · ${pct(s,tot)}</span></td></tr>
      ${L.sort((a,b)=>b.q-a.q).map(p=>`<tr><td>${esc(p.n)}</td><td class="r">${p.q}</td><td class="r">${fmt(p.imp)}</td><td class="r">${pct(p.imp,tot)}</td></tr>`).join('')}</tbody>`}).join('')}
      <tbody><tr class="tt"><td>Total</td><td class="r">${pz}</td><td class="r">${fmt(tot)}</td><td class="r">100%</td></tr></tbody></table></div>`;
  } else {
    const L=prodModo==='top'?ps.slice(0,10):ps;
    body=bars(L.map(p=>({n:p.n,v:p.imp,sub:`${p.q} vendidos · ${pct(p.imp,tot)} de la venta · ${esc(p.f)}`})));
  }
  return `<div class="card"><h2>Productos <small>${ps.length} productos · ${pz} piezas</small></h2>
    ${segBtns('pm',[['top','Top 10'],['todos','Todos'],['cat','Por categoría']],prodModo)}
    <div style="height:8px"></div>${turnos.length>1?segBtns('pt',[['dia','Día completo'],...turnos.map(t=>[t,'Corte '+t+' · '+nomT(t).toLowerCase()])],prodT)+'<div style="height:12px"></div>':''}
    ${ps.length?body:'<p class="empty">Sin productos.</p>'}</div>`;
}

// ---------- TICKETS
function vTickets(D){
  const turnos=[...new Set(D.lista.map(t=>t.turno))].sort();
  if(tkT!=='dia'&&!turnos.includes(tkT)) tkT='dia';
  const AB=esHoy()?(DATA.abiertas||[]):[];
  const lleva=a=>{if(!a.fecha||!a.abrio)return null;return Math.max(0,Math.round((Date.now()-new Date(a.fecha+'T'+a.abrio+':00'))/6e4))};
  const abHTML=AB.length?`<h2 class="corte-h">Mesas abiertas ahora <small>${AB.length} · ${fmt2(AB.reduce((x,a)=>x+a.total,0))}</small></h2>${AB.map((a,ix)=>{const m=lleva(a),vieja=a.fecha&&a.fecha<cur;
    const ct=a.cortes||0;
    return `<details class="card tkt abierta ${vieja||m>=120?'vieja':''} ${ct>=2?'corte2':ct===1?'corte1':''}"><summary><span class="tk-top"><b>${esc(a.mesa)}</b><span class="num">${fmt2(a.total)}</span></span>
      <span class="tk-meta">${a.llevar?'Para llevar':'Comedor'} · ${a.pers} pers. · ${a.arts} artículos · Atiende <b>${esc(a.mesero)}</b></span>
      <span class="tk-meta"><i class="dot-a"></i>Abrió <b>${vieja?corto(a.fecha)+' ':''}${esc(a.abrio)}</b> · ${ct>=2?`<span class="pill rojo">De hace ${ct} cortes</span>`:ct===1?'<span class="pill amarillo">Del corte anterior</span>':`<span class="pill ${vieja||m>=120?'bad':'warn'}">${vieja?'Abierta desde otro día':'Sin cobrar · '+dur(m)}</span>`}</span></summary>
      ${a.items.length?`<table class="ledger num tk-items"><tbody>${a.items.map(i=>{const otro=i.f&&a.fecha&&i.f!==a.fecha;return `<tr><td>${i.q} × ${esc(i.n)}${i.llevar?' <span class="pill warn">Llevar</span>':''}${i.orig>i.imp+0.01?` <span class="pill bad">Precio ${fmt(i.orig)} → ${fmt(i.imp)}</span>`:''}<br><small style="color:var(--muted)">${otro?`<b style="color:var(--bad)">Agregado ${corto(i.f)}</b> `:''}${esc(i.h)}${i.quien?' · '+esc(i.quien):''}</small></td><td>${fmt2(i.imp)}</td></tr>`}).join('')}<tr class="tot"><td>Total</td><td>${fmt2(a.total)}</td></tr></tbody></table>`:'<p class="empty" style="margin-top:8px">El detalle de platillos de esta cuenta aún no está disponible.</p>'}
      ${COPIA||!a.archivo?'':`<div class="btns"><button class="btn ghost-bad" data-quitar="${ix}">Quitar cuenta…</button></div>`}</details>`}).join('')}`:'';
  if(!D.lista.length) return '<section>'+abHTML+'<p class="empty">No hay tickets cobrados este día.</p></section>';
  const L=D.lista.filter(t=>tkT==='dia'||t.turno===tkT);
  let html='<section>'+abHTML+`<h2 class="corte-h">Cobrados <small>${L.length} tickets · ${fmt2(L.reduce((a,t)=>a+t.total,0))}</small></h2>`
    +segBtns('tm',[['tarjetas','Tarjetas'],['impresion','Formato impresión']],tkModo)
    +(turnos.length>1?segBtns('tt',[['dia','Día completo'],...turnos.map(t=>[t,'Corte '+t])],tkT):'');
  if(tkModo==='impresion'){
    const pad=(s,n)=>String(s).slice(0,n).padEnd(n,' '), rp=(s,n)=>String(s).padStart(n,' ');
    const tks=L.map(t=>{
      const l=[`TICKET ${t.folio}   ${nomT(t.turno).toUpperCase()}`, `${t.mesa?'Mesa: '+t.mesa:(t.llevar?'Para llevar':'Sin mesa')}   Personas: ${t.pers||1}`, `Abrió: ${t.abrio||t.hora}   Cobró: ${t.hora}${t.min!=null?'   ('+t.min+' min)':''}`, `Capturó: ${t.capturo}`, `Cobró:   ${t.cobro}`, ''];
      t.items.forEach(i=>{l.push(`${rp(i.q,2)} ${pad(i.n+(i.llevar?' (LL)':''),23)}${rp(fmt2(i.imp),11)}`); if(i.dcto>0) l.push(`   descuento${rp('-'+fmt2(i.dcto),24)}`)});
      l.push(`${rp('TOTAL',26)}${rp(fmt2(t.total),11)}`);
      (t.raw&&t.raw.length?t.raw:t.pagos.map(([f,a])=>[f,a,0])).forEach(([f,rec,cam])=>{l.push(f);l.push(`  Recibido ${rp(fmt2(rec),12)}  Cambio ${rp(fmt2(cam),9)}`)});
      return `<pre class="audit">${esc(l.join('\n'))}</pre>`}).join(`<div class="sep">- - - - - - - - - - - - - - - - - - -</div>`);
    return html+`<div class="card"><div class="tscroll">${tks}</div></div></section>`;
  }
  html+=`<div class="seg"><button data-tk="abrir">Abrir todos</button><button data-tk="cerrar">Cerrar todos</button></div>`;
  const tk=t=>`<details class="card tkt"><summary><span class="tk-top"><b>Ticket ${esc(t.folio)}</b><span class="num">${fmt2(t.total)}</span></span>
      <span class="tk-meta">${t.mesa?'Mesa <b>'+esc(t.mesa)+'</b>':(t.llevar?'Para llevar':'Sin mesa')} · ${t.pers||1} pers. · ${esc(t.pago)}</span>
      <span class="tk-meta"><i class="dot-a"></i>Abrió <b>${esc(t.abrio||t.hora)}</b> · <i class="dot-c"></i>Cobró <b>${esc(t.hora)}</b>${t.min!=null?` · <span class="pill ${t.min>=90?'warn':'good'}">${dur(t.min)}</span>`:''}</span>
      <span class="tk-meta">Capturó <b>${esc(t.capturo)}</b> · Cobró <b>${esc(t.cobro)}</b></span></summary>
    <table class="ledger num tk-items"><tbody>${t.items.map(i=>`<tr><td>${i.q} × ${esc(i.n)}${i.llevar?' <span class="pill warn">Llevar</span>':''}${i.dcto>0?` <span class="pill bad">-${fmt(i.dcto)}</span>`:''}</td><td>${fmt2(i.imp)}</td></tr>`).join('')}
    ${t.pagos.map(([f,a])=>`<tr class="pg"><td>Pagó con ${esc(f)}</td><td>${fmt2(a)}</td></tr>`).join('')}
    <tr class="tot"><td>Total</td><td>${fmt2(t.total)}</td></tr></tbody></table></details>`;
  turnos.filter(tn=>tkT==='dia'||tn===tkT).forEach(tn=>{const ts=L.filter(t=>t.turno===tn),c=D.cortes.find(c=>c.turno===tn)||{};
    const v=ts.map(t=>t.min).filter(m=>m!=null), pm=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;
    html+=`<h2 class="corte-h">Corte ${tn} · ${nomT(tn)} <small>${ts.length} tickets · ${fmt2(ts.reduce((a,t)=>a+t.total,0))}${c.cajero?' · cajera '+esc(c.cajero):''}${pm!=null?' · promedio en mesa '+dur(pm):''}</small></h2>${ts.map(tk).join('')}`});
  return html+'</section>';
}

function vCortes(D){

function bloqueCaja(ent,ret,val,conDia){
  return `${fila('+ Entradas / reingresos',fmt2(sumI(ent)),grupoMov(ent,conDia),ent.length)}
    ${fila('− Retiros y gastos',fmt2(sumI(ret)),grupoMov(ret,conDia),ret.length)}
    ${fila('− Vales de dinero',fmt2(sumI(val)),val.map(e=>linea(esc(e.ref),fmt2(e.importe),(conDia&&e.d?corto(e.d)+' · ':'')+esc(e.hora||''))).join(''),val.length)}`}
function formasDrill(o,total,tk,ts,multi,conDia){
  return `<div class="dtab">${ordF(o).map(([f,v])=>{const L=tkPorForma(ts,f);
    return fila(esc(f),fmt2(v),L.map(([t,a])=>linea(`Ticket ${esc(t.folio)} · ${conDia?corto(t.d)+' ':''}${esc(t.hora)}`,fmt2(a),`${multi?'Corte '+esc(t.turno)+' · ':''}${lugar(t)} · Cobró ${esc(t.cobro)}`)).join(''),L.length)}).join('')}
    ${fijo('Venta total'+(tk!=null?' · '+tk+' tickets':''),fmt2(total),'tot')}</div>`}
function estadoCorte(c){return c.dif==null?'<span class="pill warn">Sin conteo</span>':Math.abs(c.dif)<=20?'<span class="pill good">Cuadra</span>':c.dif>0?`<span class="pill warn">Sobran ${fmt2(c.dif)}</span>`:`<span class="pill bad">Faltan ${fmt2(-c.dif)}</span>`}
function vCorteDia(D){

    <h3 class="dh3">Ventas por forma de pago</h3>${formasDrill(D.formas,D.total,D.tickets,D.lista,true)}
    <h3 class="dh3">Movimientos de caja</h3><div class="dtab">${bloqueCaja(entD,salD.filter(e=>!esVale(e)),salD.filter(esVale))}</div>
    <p class="empty" style="margin-top:10px">Toca cualquier renglón para ver el detalle.</p></div>
  ${D.cortes.map(c=>{
    const ts=D.lista.filter(t=>t.turno===c.turno), ent=entD.filter(e=>e.turno===c.turno), sal=salD.filter(e=>e.turno===c.turno);
    const efe=tkPorForma(ts,'Efectivo').concat(tkPorForma(ts,'Efectivo (dólares)'));

    <h3 class="dh3">Efectivo en caja</h3><div class="dtab">
      ${fila('Ventas en efectivo (pesos y dólares)',fmt2(c.ventas_efe),efe.map(([t,a])=>linea(`Ticket ${esc(t.folio)} · ${esc(t.hora)}`,fmt2(a),lugar(t))).join(''),efe.length)}
      ${bloqueCaja(ent,sal.filter(e=>!esVale(e)),sal.filter(esVale))}
      ${fijo('Efectivo que debe haber',fmt2(c.esperado),'tot')}
      ${fijo('Efectivo contado',c.contado==null?'—':fmt2(c.contado))}
      ${fijo('Diferencia',c.dif==null?'—':(c.dif>=0?'+':'−')+fmt2(Math.abs(c.dif)))}</div>
    <p class="empty" style="margin-top:10px">Fondo de caja aparte: ${fmt2(c.fondo)} · Cajera: ${esc(c.cajero)}${c.folz?' · Z '+esc(c.folz):''}</p></div>`}).join('')}
  <p class="empty">Se considera que cuadra si la diferencia es de $20 o menos.</p>`;

function vPeriodo(){
  if(!pDesde){[pDesde,pHasta]=rangoRapido('semana')}
  if(pDesde>pHasta){const t=pDesde;pDesde=pHasta;pHasta=t}
  const ds=days.filter(d=>d>=pDesde&&d<=pHasta);
  const formas={},tks=[],ent=[],sal=[],dia=[];let tot=0,ntk=0,efe=0,esp=0,dif=0,sinConteo=0;
  ds.forEach(d=>{const D=DATA.detalle[d];if(!D)return;
    Object.entries(D.formas||{}).forEach(([f,v])=>formas[f]=(formas[f]||0)+v);
    D.lista.forEach(t=>tks.push({...t,d}));(D.entradas||[]).forEach(e=>ent.push({...e,d}));(D.salidas||[]).forEach(e=>sal.push({...e,d}));
    tot+=D.total;ntk+=D.tickets;let dd=0,hay=false;
    D.cortes.forEach(c=>{efe+=c.ventas_efe;esp+=c.esperado;if(c.contado!=null){dif+=c.dif;dd+=c.dif;hay=true}else sinConteo++});
    dia.push({d,D,dif:hay?dd:null})});
  const ret=sal.filter(e=>e.cat!=='Vales'), val=sal.filter(e=>e.cat==='Vales');
  const aviso=pDesde<days[0]?`<p class="note" style="margin:10px 0 0">El detalle está disponible desde el ${corto(days[0])}.</p>`:'';
  const salT=sumI(ret);const cats={};ret.forEach(e=>cats[e.cat]=(cats[e.cat]||0)+e.importe);
  return `<div class="card">${selectorFechas('p',pDesde,pHasta)}${aviso}</div>
  ${!ds.length?'<p class="empty">No hay ventas en esas fechas.</p>':`
  <div class="kpis"><div class="kpi"><b class="num">${fmt(tot)}</b><span>venta · ${ds.length} días</span></div><div class="kpi"><b class="num" style="color:${dif<-20?'var(--bad)':dif>20?'var(--warn)':'var(--good)'}">${(dif>=0?'+':'−')+fmt(Math.abs(dif))}</b><span>diferencia de cortes${sinConteo?' · '+sinConteo+' sin conteo':''}</span></div></div>
  <div class="card"><h2>Corte del periodo <small>${corto(pDesde)} al ${corto(pHasta)}</small></h2>
    <h3 class="dh3">Ventas por forma de pago</h3>${formasDrill(formas,tot,ntk,tks,true,true)}
    <h3 class="dh3">Movimientos de caja</h3><div class="dtab">${bloqueCaja(ent,ret,val,true)}</div>
    <h3 class="dh3">Efectivo</h3><div class="dtab">
      ${fijo('Ventas en efectivo (pesos y dólares)',fmt2(efe))}
      ${(()=>{const n=sumI(ent)-sumI(ret)-sumI(val);return fijo('+ Entradas − retiros − vales',(n<0?'−':'+')+fmt2(Math.abs(n)))})()}
      ${fijo('Efectivo que debió quedar en caja',fmt2(esp),'tot')}
      ${fijo('Diferencias de los cortes',(dif>=0?'+':'−')+fmt2(Math.abs(dif)))}</div>
    <h3 class="dh3">Día por día</h3><div class="dtab">
      ${dia.map(({d,D,dif})=>{const s=dif==null?'':Math.abs(dif)<=20?' <span class="pill good">Cuadra</span>':dif>0?` <span class="pill warn">+${fmt(dif)}</span>`:` <span class="pill bad">−${fmt(-dif)}</span>`;
        return fila(corto(d)+s,fmt2(D.total),ordF(D.formas||{}).map(([f,v])=>linea(esc(f),fmt2(v))).join('')+D.cortes.map(c=>linea(`Corte ${esc(c.turno)} · cajera ${esc(c.cajero)}`,fmt2(c.venta),`Efectivo esperado ${fmt2(c.esperado)}${c.contado!=null?' · contado '+fmt2(c.contado):' · sin conteo'}`)).join(''),D.tickets)}).join('')}
      ${fijo('Total del periodo',fmt2(tot),'tot')}</div></div>
  ${ret.length?`<div class="card"><h2>Salidas por tipo <small>${fmt2(salT)}</small></h2>${bars(Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({n,v,vs:fmt2(v),sub:pct(v,salT)})))}</div>`:''}`}`;
}

function liqTxt(l){if(!l)return '';if(l.neto==null)return `${l.plat}: falta la comisión (pon el % de ${l.plat} en Reportes → Didi y Uber o escríbela en el pedido)`;

    ${DATA.bitacora_hasta&&cur>DATA.bitacora_hasta?`<p class="note" style="margin-top:12px">MrTienda dejó de registrar los artículos borrados el ${lbl(DATA.bitacora_hasta)}. Pídele a tu proveedor que vuelva a activar la bitácora de artículos eliminados.</p>`:''}</div>

// ---- Didi y Uber (cuentas quitadas) como opción en los reportes; la familia nunca cuenta como venta
let incPlat=!!st.plat, RD=null;

function parseLineas(txt){
  const out=[],mal=[];
  txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const p=l.split('|').map(x=>x.trim());
    if(p.length<4){mal.push(l);return}
    const monto=money(p[3]);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(p[0])||!(monto>0)){mal.push(l);return}
    const cat=CATS().find(c=>c.toLowerCase()===p[1].toLowerCase())||'Otros gastos';
    const neg=NEGS.find(n=>n.toLowerCase()===(p[5]||'').toLowerCase().replace('cafeteria','cafetería'))||'Restaurante';
    out.push({fecha:p[0],categoria:cat,concepto:p[2],monto,proveedor:p[4]||'',negocio:neg});
  });
  return {out,mal};
}

const nombrePdf=n=>{const p=String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z]/g,' ').trim().split(/\s+/)[0]||'';return 'Comandero_'+(p?p.charAt(0).toUpperCase()+p.slice(1).toLowerCase():'LaHolandesa')+'.pdf'};   // sin acentos ni espacios: algunos Android rechazan el nombre
function puedeCompartir(){try{return window.isSecureContext&&!!navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.pdf',{type:'application/pdf'})]})}catch(e){return false}}
function prepararPdf(cod,nombre){if(!cod||PDF_MS[cod]||!puedeCompartir())return;
  PDF_MS[cod]=fetch('/api/comandero-pdf?cod='+encodeURIComponent(cod),{credentials:'same-origin'}).then(r=>{if(!r.ok)throw new Error('No pude generar el PDF');return r.blob()})
    .then(b=>(PDF_MS[cod]=new File([b],nombrePdf(nombre),{type:'application/pdf'}))).catch(e=>{delete PDF_MS[cod];throw e})}
async function enviarPdf(cod,nombre){
  let f=PDF_MS[cod];
  if(!(f instanceof File)){prepararPdf(cod,nombre);try{await PDF_MS[cod]}catch(e){return toast(e.message)}toast('PDF listo. Toca "Enviar PDF" otra vez.');return}
  try{await navigator.share({files:[new File([f],f.name,{type:'application/pdf'})]})}catch(e){if(e.name==='AbortError')return;
    // el teléfono no dejó compartir: se descarga solo para adjuntarlo en WhatsApp con el clip → Documento
    try{const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(_){}
    toast('Tu teléfono no dejó compartirlo directo, así que se descargó "'+f.name+'". En WhatsApp abre el chat, toca el clip → Documento y elígelo.');
    api('/api/log-cliente',{que:'compartir PDF',error:e.name+': '+e.message,ua:navigator.userAgent.slice(0,160)}).catch(()=>{});
    const b=document.getElementById('cmdPlanB');if(b){b.hidden=false;if(ANDROID&&!CHROME_OK&&ACCESO&&ACCESO.https&&!b.querySelector('[data-chrome]'))b.insertAdjacentHTML('afterbegin',`<a class="btn pri" data-chrome="1" href="${esc(enChrome(cod))}">Abrir en Chrome para enviar</a>`)}}}

const b64uH=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unbH=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));

    <div class="btns"><button class="btn" data-hsalir="1">Salir del panel</button></div></div>`;

async function activarHuella(t){
  t.disabled=true;
  try{
    const r=await api('/api/huella/reto',{modo:'registrar'});
    const cr=await navigator.credentials.create({publicKey:{challenge:unbH(r.reto),rp:{name:'La Holandesa',id:location.hostname},
      user:{id:unbH(r.uid),name:r.usuario,displayName:'Jorge · La Holandesa'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged',requireResidentKey:false},hints:['client-device'],attestation:'none',timeout:60000,
      excludeCredentials:[]}});
    const ua=navigator.userAgent, nom=/SM-|Samsung/i.test(ua)?'Samsung':/iPhone/.test(ua)?'iPhone':/Android/.test(ua)?'Teléfono Android':/Windows/.test(ua)?'Computadora Windows':'Este dispositivo';
    await api('/api/huella/registrar',{cd:b64uH(cr.response.clientDataJSON),ao:b64uH(cr.response.attestationObject),nombre:nom,reemplazar:true});
    try{localStorage.setItem('hol_huella','1')}catch(e){}
    toast('Huella activada. La próxima vez entras con tu huella.');await cargar(true);
  }catch(e){toast(e&&e.name==='NotAllowedError'?'Se canceló la huella.':e&&e.name==='InvalidStateError'?'Este teléfono ya tiene la huella activada.':(e.message||'No se pudo activar.'));t.disabled=false}
}

  const tabla=(rows,tit)=>`<div class="tscroll"><table class="tk num" style="font-size:12px;width:100%"><thead><tr><th ${cel}>${tit}</th><th class="r" ${cel}>Venta</th>${CANS.map(([,l])=>`<th class="r" ${cel}>${l==='Para llevar'?'Llevar':l==='A domicilio'?'Domic.':l==='Comedor'?'Comed.':l}</th>`).join('')}</tr></thead><tbody>

  const sem={};Object.keys(pdia).sort().forEach(f=>{const d=pd(f);d.setDate(d.getDate()-((d.getDay()+6)%7));const k=iso(d);(sem[k]=sem[k]||[]).push(pdia[f])});

const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const rhPd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const rhLunes=s=>{const d=rhPd(s);d.setDate(d.getDate()-((d.getDay()+5)%7));return isoD(d)};   // inicio de la semana de nómina: martes (va de martes a lunes)
const SEM_IDX=[1,2,3,4,5,6,0];   // día i de la semana de nómina (martes…lunes) → posición en el horario del expediente (lunes…domingo)
const SEM_DIAS=SEM_IDX.map(k=>['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][k]), SEM_DIAS_L=SEM_IDX.map(k=>['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'][k]), SEM_DOM=5;
const rhMas=(s,n)=>{const d=rhPd(s);d.setDate(d.getDate()+n);return isoD(d)};
const rhCorta=s=>{const d=rhPd(s);return d.getDate()+' '+['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()]};
const rhNorm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
const rhAct=()=>(RH.empleados||[]).filter(e=>e.activo).sort((a,b)=>(RH.puestos.indexOf(a.puesto)-RH.puestos.indexOf(b.puesto))||a.nombre.localeCompare(b.nombre));
const rhEmp=id=>(RH.empleados||[]).find(e=>e.id===id);
const rhDiario=e=>(+e.diario||0)||(+e.sueldo||0)/7;
const RH_DIAS_L=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const rhHm=v=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(v||'').trim());return m?(+m[1])*60+(+m[2]):null};
// horas como las maneja La Holandesa: 7:30 am, 3:30 pm (corta en el rol: 7:30a, 3:30p)
const rhH12=(v,corta)=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(v||'').trim());if(!m)return String(v||'');const H=+m[1],ap=H<12?'a':'p';return (H%12||12)+':'+m[2]+(corta===2?'':corta?ap:' '+ap+'m')};
// selector de hora (en lugar del reloj del teléfono, que en algunos Android no deja escribir): cada 15 min, en formato 7:30 am
const RH_HORAS=(()=>{const o=[];for(let m=5*60;m<24*60;m+=15)o.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));return o})();

function rhBase(e){ // horario base de la semana: [entra, sale] o null si descansa
  if(Array.isArray(e.horario)&&e.horario.length===7)return e.horario.map(x=>Array.isArray(x)&&x.length===2?x:null);

}
function rhHoras(h,comida){ // horas pagadas de un día: de la entrada a la salida, menos la comida que no se paga
  if(!h)return 0;const a=rhHm(h[0]),b=rhHm(h[1]);if(a==null||b==null)return 0;let m=b-a;if(m<=0)m+=1440;return Math.max(0,(m-(+comida||0))/60);
}
const rhHtxt=n=>{const h=Math.floor(n+1e-9),m=Math.round((n-h)*60);return h+(m?':'+String(m).padStart(2,'0'):'')+' h'};
// cómo suena el nombre: BERENISE = BERENICE, ANTUAN ≈ ANTOINE, VALERIA = BALERIA, YESICA = JESSICA…
const rhSon=s=>rhNorm(s).replace(/CE|CI/g,m=>'S'+m[1]).replace(/Z/g,'S').replace(/V/g,'B').replace(/LL|Y/g,'I').replace(/QU|K|C/g,'K').replace(/H/g,'').replace(/(.)\1+/g,'$1');
const rhDist=(a,b)=>{const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[n]};
function rhQuien(texto){ // a quién corresponde un vale o comida escrito con nombre libre
  const t=' '+rhNorm(texto).replace(/^VALES? /,'')+' ', A=rhAct();
  let m=A.filter(e=>t.includes(' '+rhNorm(e.nombre)+' '));
  if(m.length!==1){const ap=A.filter(e=>e.apodo&&t.includes(' '+rhNorm(e.apodo)+' '));if(ap.length===1)return ap[0]}   // 30.7.54: sobrenombre (Pepe)
  if(m.length===1)return m[0];
  const p=t.trim().split(' ')[0]; if(!p)return null;
  m=A.filter(e=>rhNorm(e.nombre).split(' ')[0]===p);
  if(m.length===1)return m[0];
  m=A.filter(e=>rhSon(rhNorm(e.nombre).split(' ')[0])===rhSon(p));          // se escribe distinto pero suena igual
  if(m.length===1)return m[0];
  m=A.filter(e=>{const n=rhSon(rhNorm(e.nombre).split(' ')[0]),s=rhSon(p);return n.length>=4&&rhDist(n,s)<=(n.length>=6?2:1)});   // una o dos letras de diferencia
  return m.length===1?m[0]:null;
}

  const th=!rhPagaExtra(e)?0:porHora?tar:d/8, xe=rhExtra(hs.t,th);
  let difMin=0;const okE=Object.entries(RH.aud_ok||{}).filter(([k,v])=>v.pagar&&k.startsWith(e.id+'|'));
  if(!porHora&&d&&okE.length)rr.d.forEach((c_,i)=>{if(c_!=='T'||!rr.h[i])return;let n=0;okE.forEach(([k])=>{const [,tipo,val,esp]=k.split('|');
    if(tipo==='ent'&&rr.h[i][0]===val)n+=audM(esp)-audM(val);if(tipo==='sal'&&rr.h[i][1]===val)n+=audM(val)-audM(esp)});difMin+=Math.max(0,n)});   // neto del día: entrar 15 min tarde y salir 15 min tarde = 0
  const difPago=Math.round(difMin/60*d/8*100)/100;
  const calc={base,septimo,extra_horas:xe.monto,h_extra:xe.ext,prima_dom:prima,incentivo:inc,extras:difPago,comida:Math.round(vs.comida*100)/100,vales:Math.round((valesM+valesC)*100)/100,abono:abonoSug,otros:0,transfer:0,horas:hs.t,resta_comida:resta,nota:'',pagada:false}, v=g||calc;
  return {v,calc,xe,th,difMin,diasPag,parcial,g:!!g,f,t,vac,prog,dom,valesM,valesC,comidas,sinDesc,pr,porHora,tar,resta,hs};
}
const rhBruto=v=>(+v.base||0)+(+v.septimo||0)+(+v.extra_horas||0)+(+v.prima_dom||0)+(+v.incentivo||0)+(+v.extras||0);
const rhTot=v=>rhBruto(v)-(+v.comida||0)-(+v.vales||0)-(+v.abono||0)-(+v.otros||0);
// en la nómina van agrupados por puesto, en el orden en que Jorge los revisa: cocineros, meseros, ayudantes generales y después los demás
const RH_NOM_ORDEN=['Cocinero','Ayudante de cocina','Mesero','Cajero','Encargada','Ayudante general','Repartidor','Lavaloza','Otro'];
const RH_NOM_TIT={Cocinero:'Cocineros','Ayudante de cocina':'Ayudantes de cocina',Mesero:'Meseros',Cajero:'Cajeros',Encargada:'Encargada','Ayudante general':'Ayudantes generales',Repartidor:'Repartidores',Lavaloza:'Lavaloza',Otro:'Otros'};
const rhNomPos=e=>{const i=RH_NOM_ORDEN.indexOf(e.puesto);return i<0?99:i};
const rhNomActivos=()=>rhAct().filter(e=>e.diario>0||e.sueldo>0||(e.pago==='hora'&&e.tarifa>0)||(RH.nominas[rhSem]||{})[e.id]).sort((a,b)=>(rhNomPos(a)-rhNomPos(b))||a.nombre.localeCompare(b.nombre));
const rhNomTitulo=(A,i)=>{const p=A[i].puesto||'Otro';return i&&(A[i-1].puesto||'Otro')===p?'':`<h3 style="font:900 15px var(--display);letter-spacing:.1em;text-transform:uppercase;margin:22px 0 8px;padding:7px 12px;border-radius:8px;background:#ffe8cc;color:#1d4ed8">${esc(RH_NOM_TIT[p]||p)}</h3>`};
function rhNomina(){
  const A=rhNomActivos(); let T=0,TR=0;
  const cards=A.map((e,ix)=>{const c=rhNomCalc(e,rhSem),v=c.v,tot=rhTot(v);T+=tot;TR+=(+v.transfer||0);const tit=rhNomTitulo(A,ix);
    const inp=(k,l,hint='')=>`<div class="field" style="margin-top:8px"><label>${l}${hint?` <small style="color:var(--muted)">${hint}</small>`:''}</label><input class="rhn" data-emp="${e.id}" data-k="${k}" inputmode="decimal" value="${v[k]||''}"></div>`;
    const hsSin=rhHorasSem(e,rhSem,false).t, hsCon=rhHorasSem(e,rhSem,true).t, mins=+e.comida_min||30;
    const horas=`<div class="note" style="background:var(--surface-2);color:var(--ink);margin:10px 0 0">Horas del rol: <b id="rh_hs_${e.id}">${rhHtxt(c.resta?hsCon:hsSin)}</b>${c.porHora?` × ${fmt2(c.tar)} por hora`:''}
      <label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:600"><input type="checkbox" class="rhn rhrc" data-emp="${e.id}" data-k="resta_comida" data-sin="${hsSin}" data-con="${hsCon}" data-tar="${c.porHora?c.tar:0}" data-th="${c.th||0}" data-dsin="${rhHorasSem(e,rhSem,false).dom}" data-dcon="${rhHorasSem(e,rhSem,true).dom}" ${c.resta?'checked':''} style="width:20px;height:20px">Restar ${mins} min de comida por día</label></div>`;
    return tit+`<div class="card"><h2>${esc(e.nombre)} <small>${esc(e.puesto)} · ${c.t} días${c.f?` · <b style="color:var(--bad)">${c.f} ${c.f===1?'falta':'faltas'}</b>`:''}${c.g?(v.pagada?' · <span class="pill good">Pagada</span>':' · <span class="pill mut">Guardada</span>'):''}</small></h2>${horas}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 10px">
        ${inp('base',c.porHora?'Sueldo por horas':+e.diario?'Sueldo':'Nómina completa',c.porHora?'':+e.diario?'('+(c.parcial.length?(+c.diasPag.toFixed(2))+' días':(c.t+c.vac))+' × '+fmt2(+e.diario)+')'+(c.parcial.length?'<br><span style="color:var(--warn)">por horas: '+esc(c.parcial.join(', '))+'</span>':''):c.f?'(menos faltas)':'')}${inp('incentivo','Incentivo',+e.incentivo&&c.calc.incentivo<+e.incentivo-0.005?'(proporcional, como el séptimo)':'')}
        ${inp('septimo','Séptimo día','(lo trabajado ÷ 6)')}${inp('extra_horas','Horas extra',!rhPagaExtra(e)?(c.xe.ext?'('+rhHtxt(c.xe.ext)+', no se le pagan)':'(no se le pagan)'):c.xe.ext?'('+rhExtraTxt(c.xe)+')':'(más de 48 h)')}${inp('prima_dom','Prima dominical',c.dom?'(25%)':c.calc.prima_dom?'(25%, aunque descansó)':'')}${inp('extras','Extras / bonos',c.difMin?'('+c.difMin+' min de diferencia aceptada)':'(autorizadas)')}
      </div>
      <table class="ledger num" style="margin-top:12px"><tbody><tr><td>Nómina total <small style="color:var(--muted)">(sin descuentos)</small></td><td><b id="rb_${e.id}">${fmt2(rhBruto(v))}</b></td></tr></tbody></table>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 10px">
        ${inp('abono','Abono préstamo',c.pr.saldo?'(debe '+fmt2(c.pr.saldo)+')':'')}${inp('comida','Vales de comida',(c.comidas?'(consumió '+fmt2(c.comidas)+(c.sinDesc?' · '+c.sinDesc+' sin descuento':'')+')':'')+(c.g&&Math.abs((+v.comida||0)-c.calc.comida)>.005?' <b style="color:var(--warn)">ahora suman '+fmt2(c.calc.comida)+'</b>':''))}
        ${inp('vales','Anticipo (vale de la semana)',(c.valesC?'(caja '+fmt2(c.valesC)+')':'')+(c.g&&Math.abs((+v.vales||0)-c.calc.vales)>.005?' <b style="color:var(--warn)">ahora suman '+fmt2(c.calc.vales)+'</b>':''))}${inp('otros','Otros descuentos')}
      </div>
      <table class="ledger num" style="margin-top:12px"><tbody>
        <tr><td><b>Total a pagar</b></td><td><b id="rt_${e.id}">${fmt2(tot)}</b></td></tr></tbody></table>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 10px">${inp('transfer','Transferencia')}<div class="field" style="margin-top:8px"><label>Efectivo</label><input id="re_${e.id}" readonly value="${fmt2(tot-(+v.transfer||0))}"></div></div>
      <div class="btns"><button class="btn pri" data-rh="nomguardar" data-id="${e.id}">Guardar</button><button class="btn" data-rh="nompagar" data-id="${e.id}">${v.pagada?'Quitar pagada':'Marcar pagada'}</button><a class="btn" data-rh="recibo" data-id="${e.id}" href="#">Recibo por WhatsApp</a>${c.g?`<button class="btn" data-rh="nomrecalc" data-id="${e.id}">Volver a calcular</button>`:''}</div>
      ${c.g?'<p class="empty" style="margin-top:6px">Ya está guardada: puedes cambiar cualquier cuadro y darle Guardar otra vez. "Volver a calcular" pone de nuevo lo que sale del rol, las horas y los vales (luego dale Guardar).</p>':''}</div>`}).join('');
  return rhSemNav()+rhExportCard()+`<div class="kpis"><div class="kpi"><b class="num">${fmt2(T)}</b><span>total a pagar</span></div><div class="kpi"><b class="num">${fmt2(T-TR)}</b><span>en efectivo · ${fmt2(TR)} transferido</span></div></div>`+
    (cards||'<p class="empty">Captura el sueldo por día o el pago por hora de cada empleado en su expediente para calcular la nómina.</p>')+
    `<p class="empty" style="margin-top:10px">Por día: días trabajados y de vacaciones × sueldo diario, más prima dominical (25% del sueldo diario si trabajó domingo) y el incentivo proporcional a los días que trabajó. Por hora: las horas del rol × pago por hora; la comida se resta solo si marcas la casilla. Los préstamos se abonan solos con lo que digas por semana; los vales salen de los capturados aquí y de las salidas de caja de MrTienda que digan VALE y el nombre. Todo se puede corregir a mano antes de guardar.</p>`;
}
// ---- Resumen de nómina: total, menos préstamos y vales, menos transferencias = efectivo que paga Berenice
// Resumen: la nómina (sueldo) viene de la pestaña Nómina; lo demás se puede cambiar aquí. Vacío = automático.
// Vales de dinero y de comida se toman solos de lo registrado en la semana.
const RS_K=[['vales','Anticipos'],['abono','Préstamo'],['comida','V. comida'],['otros','Otros'],['grat','Gratific. (+)'],['transfer','Transfer.']];
function rhResFila(e,sem){sem=sem||rhSem;const c=rhNomCalc(e,sem),v=c.v,vs=rhValesSem(e,sem),aj=((RH.res_aj||{})[sem]||{})[e.id]||{};
  const auto={abono:+v.abono||0,comida:Math.round(vs.comida*100)/100,vales:Math.round((vs.man+vs.caja)*100)/100,otros:+v.otros||0,grat:0,transfer:+v.transfer||0};
  const f={e,g:c.g,b:rhBruto(v),auto,aj};RS_K.forEach(([k])=>f[k]=k in aj?+aj[k]:auto[k]);
  f.tot=Math.round((f.b-f.vales-f.abono-f.comida-f.otros+f.grat)*100)/100;f.ef=Math.round((f.tot-f.transfer)*100)/100;return f}
function rhResumen(){
  const A=rhNomActivos(); if(!A.length)return rhSemNav()+'<p class="empty">Todavía no hay nómina que resumir.</p>';
  const F=A.map(e=>rhResFila(e));
  const S=k=>F.reduce((a,f)=>a+f[k],0), sin=F.filter(f=>!f.g).length;
  const fila=(l,v,neg,b)=>`<tr${b?' class="tt"':''}><td>${b?'<b>'+l+'</b>':l}</td><td class="r">${neg&&v?'−':''}${b?'<b>'+fmt2(v)+'</b>':fmt2(v)}</td></tr>`;
  const cel=(f,k)=>{const ed=k in f.aj;return `<td class="r" style="padding:3px 2px"><input class="rsin num" data-emp="${f.e.id}" data-k="${k}" value="${f[k]?f[k].toFixed(2):''}" placeholder="0" inputmode="decimal" title="${ed?'Cambiado por ti; automático: '+fmt2(f.auto[k]):'Automático'}" style="width:78px;text-align:right;padding:5px 6px;border-radius:7px;border:1px solid ${ed?'#d97706':'var(--line)'};background:${ed?'#fff7e6':'var(--surface)'};font:600 13px var(--body);color:var(--ink)"></td>`};
  const fin=rhMas(rhSem,6),en=x=>x.fecha>=rhSem&&x.fecha<=fin;
  const sinD=(RH.comidas||[]).filter(c=>en(c)&&rhComidaEmp(c)&&rhDC(c).monto==null), sinQ=[...(RH.comidas||[]).filter(c=>en(c)&&!rhComidaEmp(c)).map(c=>'comida de '+(c.persona||'sin nombre')),...(RH.vales_caja||[]).filter(v=>en(v)&&!rhQuien(v.ref)).map(v=>v.ref+' '+fmt2(+v.monto||0))];
  const avisos=(sinD.length?`<p class="note" style="margin-bottom:12px"><b>${sinD.length===1?'1 comida de empleado no tiene':sinD.length+' comidas de empleados no tienen'} descuento</b> (${sinD.map(c=>esc(rhComidaEmp(c).nombre.split(' ')[0])+' '+fmt2(+c.total||0)).join(', ')}), así que no se descuenta${sinD.length===1?'':'n'}. Ponle el descuento en <a href="#" data-rhtab="vp">Préstamos y vales</a> → Vales de comida.</p>`:'')+
    (sinQ.length?`<p class="note" style="margin-bottom:12px"><b>No sé de quién es:</b> ${sinQ.map(esc).join(', ')}. No se descuenta${sinQ.length===1?'':'n'} hasta que se identifique${sinQ.length===1?'':'n'}.</p>`:'');
  return rhSemNav()+rhExportCard()+avisos+(sin?`<p class="note" style="margin-bottom:12px">${sin===1?'Falta guardar la nómina de 1 empleado':'Falta guardar la nómina de '+sin+' empleados'}; aquí se usa lo calculado. Guárdala en la pestaña Nómina.</p>`:'')+
  `<div class="card"><h2>Resumen de la semana</h2><table class="ledger num"><tbody>
    ${fila('Total de la nómina',S('b'),false,true)}
    ${fila('Anticipos (vales de la semana)',S('vales'),true)}${fila('Préstamos',S('abono'),true)}${fila('Vales de comida',S('comida'),true)}${S('otros')?fila('Otros descuentos',S('otros'),true):''}${S('grat')?fila('+ Gratificaciones',S('grat'),false):''}
    ${fila('Total a pagar',S('tot'),false,true)}
    ${fila('Transferencias',S('transfer'),true)}
    ${fila('Efectivo a pagar',S('ef'),false,true)}</tbody></table>
    <div class="btns"><a class="btn pri" data-rh="resberenice" href="#">Mandar el efectivo a Berenice por WhatsApp</a></div></div>
  <div class="card"><h2>Por empleado <small>desliza para ver todo</small></h2>
    <p class="empty" style="margin-top:0">La columna <b>Nómina</b> viene de la pestaña Nómina y no se cambia aquí. Lo demás sí: escribe la cantidad (por ejemplo la transferencia) y se guarda sola al salir del cuadro. Los anticipos (vales de la semana) y los vales de comida se ponen solos. Si borras el cuadro, vuelve a lo automático. En <span style="background:#fff7e6;border:1px solid #d97706;border-radius:5px;padding:0 4px">anaranjado</span> lo que cambiaste tú.</p>
    <div class="tscroll"><table class="tk num" style="font-size:12.5px"><thead><tr><th>Empleado</th><th class="r">Nómina</th>${RS_K.map(([,l])=>`<th class="r">${l}</th>`).join('')}<th class="r">Efectivo</th></tr></thead><tbody>
    ${F.map((f,ix)=>(ix&&(F[ix-1].e.puesto||'Otro')===(f.e.puesto||'Otro')?'':`<tr><td colspan="9" style="font-weight:900;text-transform:uppercase;letter-spacing:.08em;padding-top:12px;color:#1d4ed8">${esc(RH_NOM_TIT[f.e.puesto]||f.e.puesto||'Otros')}</td></tr>`)+`<tr><td>${esc(f.e.nombre.split(' ').slice(0,2).join(' '))}${f.g?'':' <small style="color:var(--warn)">sin guardar</small>'}</td><td class="r"><b>${fmt2(f.b)}</b></td>${RS_K.map(([k])=>cel(f,k)).join('')}<td class="r"><b>${fmt2(f.ef)}</b></td></tr>`).join('')}
    <tr class="tt"><td>Total</td><td class="r">${fmt2(S('b'))}</td>${RS_K.map(([k])=>`<td class="r">${fmt2(S(k))}</td>`).join('')}<td class="r">${fmt2(S('ef'))}</td></tr></tbody></table></div></div>`;
}
// Hoja de nómina para firmar (Excel): sueldo, séptimo, horas extra, prima, incentivo y extras de cada quien; sin descuentos
function rhFirmaDatos(){
  const A=rhNomActivos(), dmy=s=>{const [y,m,d]=s.split('-');return d+'/'+m+'/'+y}, grupos=[];
  A.forEach(e=>{const c=rhNomCalc(e,rhSem),v=c.v,tit=RH_NOM_TIT[e.puesto]||e.puesto||'Otros';
    let g=grupos.find(x=>x.titulo===tit);if(!g){g={titulo:tit,filas:[]};grupos.push(g)}
    g.filas.push({nombre:e.nombre,dias:c.porHora?c.t:c.diasPag,horas:+v.horas||c.hs.t||0,faltas:c.f,h_extra:v.h_extra!=null?+v.h_extra:(c.xe.ext||0),
      salario:c.porHora?c.tar:(+e.diario||0),sueldo:+v.base||0,septimo:+v.septimo||0,extra_horas:+v.extra_horas||0,prima:+v.prima_dom||0,incentivo:+v.incentivo||0,extras:+v.extras||0})});
  const fin=rhMas(rhSem,6), M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'], p=rhPd(rhSem), q=rhPd(fin);
  return {semana:dmy(rhSem),al:dmy(fin),grupos,archivo:p.getDate()+(p.getMonth()!==q.getMonth()?' '+M[p.getMonth()]:'')+' al '+q.getDate()+' '+M[q.getMonth()]+' '+q.getFullYear()};
}
// Pago: descuentos y forma de pago de cada quien (lo mismo que el Resumen de nómina)
function rhPagoDatos(){
  const grupos=[];
  rhNomActivos().forEach(e=>{const f=rhResFila(e),tit=RH_NOM_TIT[e.puesto]||e.puesto||'Otros',pr=rhPrest(e.id),aj=((RH.res_aj||{})[rhSem]||{})[e.id]||{},ya='abono' in aj?+aj.abono:+(((RH.nominas[rhSem]||{})[e.id]||{}).abono||0);
    let g=grupos.find(x=>x.titulo===tit);if(!g){g={titulo:tit,filas:[]};grupos.push(g)}
    g.filas.push({nombre:e.nombre,nomina:f.b,prestamo:f.abono,comida:f.comida,vales:f.vales,otros:f.otros,grat:f.grat,transfer:f.transfer,saldo:Math.max(0,Math.round(((pr.saldo||0)-(f.abono-ya))*100)/100)})});
  return grupos;
}
// Tarjeta para compartir: nómina completa (firma + pago + descansos) o una sola hoja, en Excel o PDF
function rhExportCard(){
  return `<div class="card" style="padding:12px 14px"><b>Compartir la nómina de la semana</b>
    <div class="field" style="margin-top:8px"><select id="rhExpTipo"><option value="completa">Nómina completa (para firmar + pago + descansos)</option><option value="firma">Solo la hoja para firmar (sin descuentos)</option><option value="pago">Solo pago (descuentos, transferencia y efectivo)</option><option value="descansos">Solo el concentrado de descansos</option></select></div>
    <div class="btns" style="margin-top:8px"><button class="btn pri" data-rh="exportar" data-fmt="xlsx">Compartir en Excel</button><button class="btn pri" data-rh="exportar" data-fmt="pdf">Compartir en PDF</button></div></div>`;
}
// Compartir un archivo: PDF por el menú de compartir; Excel en Android no se puede compartir así (Chrome no lo permite), se descarga y se explica cómo mandarlo
function rhDescargar(blob,nom){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=nom;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000)}
function rhAvisoDescarga(nom){
  const o=document.createElement('div');o.className='rhmodal';
  o.innerHTML=`<div class="rhmodal-in" role="dialog" aria-modal="true"><b style="font-size:17px">El Excel se guardó en tu tablet</b>
    <p style="margin:8px 0 4px">Se llama <b>${esc(nom)}</b> y quedó en la carpeta <b>Descargas</b>.</p>
    <p style="margin:4px 0"><b>Para mandarlo por WhatsApp:</b></p>
    <ol style="margin:4px 0 8px;padding-left:20px;line-height:1.5"><li>Abre el chat en WhatsApp.</li><li>Toca el <b>clip 📎</b> y luego <b>Documento</b>.</li><li>Busca <b>${esc(nom)}</b> (sale hasta arriba, es el más reciente) y tócalo.</li></ol>
    <p class="empty" style="margin:0 0 10px">Para abrirlo o imprimirlo: baja la barra de notificaciones de la tablet y toca la descarga.</p>
    <div class="btns"><button class="btn pri" data-cerrar="1">Entendido</button></div></div>`;
  o.addEventListener('click',e=>{if(e.target===o||e.target.closest('[data-cerrar]'))o.remove()});document.body.appendChild(o);
}
async function rhCompartirArchivo(blob,nom){
  const movil=/Android|iPhone|iPad|Macintosh.*Mobile/i.test(navigator.userAgent), f=new File([blob],nom,{type:blob.type});
  let ok=false;
  try{ok=!!(movil&&navigator.canShare&&navigator.canShare({files:[f]}))}catch(e){ok=false}
  if(ok){try{await navigator.share({files:[f],title:nom.replace(/\.(xlsx|pdf)$/,'')});return}catch(e){if(e.name==='AbortError')return}}
  rhDescargar(blob,nom);
  if(movil&&/\.xlsx$/.test(nom))rhAvisoDescarga(nom);else toast('Listo: '+nom);
}
async function rhExportar(b,tipo,fmt){
  const fd=rhFirmaDatos(); if(tipo!=='descansos'&&!fd.grupos.length){toast('No hay empleados con sueldo en esta semana.');return}
  const txt=b.textContent;b.disabled=true;b.textContent='Armando…';
  try{
    const body={tipo,formato:fmt,semana_iso:rhSem,archivo:fd.archivo,firma:fd,pago:{semana:fd.semana,al:fd.al,grupos:rhPagoDatos()}};
    const r=await fetch('/api/rh-export',{method:'POST',headers:{'Content-Type':'application/json','X-Holandesa-Action':'1'},body:JSON.stringify(body),credentials:'same-origin'});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||('No se pudo ('+r.status+')'))}
    const n={completa:'Nomina completa',firma:'Nomina para firmar',pago:'Pago de nomina',descansos:'Descansos'}[tipo]+' '+fd.archivo+(fmt==='pdf'?'.pdf':'.xlsx');
    await rhCompartirArchivo(await r.blob(),n);
  }catch(e){toast(e.message)}
  b.disabled=false;b.textContent=txt;
}
function rhMsgBerenice(){
  const F=rhNomActivos().map(e=>rhResFila(e)).filter(f=>Math.abs(f.ef)>=0.005);
  const L=[`*Nómina La Holandesa*`,`Semana del ${rhCorta(rhSem)} al ${rhCorta(rhMas(rhSem,6))}`,``,`Efectivo a pagar:`,...F.map(f=>`• ${f.e.nombre}: ${fmt2(f.ef)}`),``,`*Total en efectivo: ${fmt2(F.reduce((a,f)=>a+f.ef,0))}*`];

  const A=rhAct(), hoy=rhPd(RH.hoy), y=hoy.getFullYear();

  <div class="card"><h2>Aguinaldo ${hoy.getFullYear()} <small>mínimo de ley: 15 días</small></h2><div class="tscroll"><table class="tk num"><thead><tr><th>Empleado</th><th class="r">Días del año</th><th class="r">Aguinaldo</th></tr></thead><tbody>

// 30.7.47: Didi y Uber — comisión automática con el % de la plataforma (o escrita a mano) y descuentos; la venta es lo que paga la plataforma
const platCfg=p=>Object.assign({pct:30,iva_com:8,iva_venta:8,ret_isr:2.5,ret_iva:8},((DATA.plataformas||{}).config||{})[p]||{});
// 30.7.49: como el estado de cuenta de Didi: cobrado con IVA 8% → base; comisión % de la base + IVA de la comisión; retenciones ISR e IVA sobre la base; menos lo que absorbes
const platCalc=(p,cobrado,desc,comMano)=>{const c=platCfg(p),r=x=>Math.round(x*100)/100,base=r(cobrado/(1+c.iva_venta/100)),ri=r(base*c.ret_isr/100),rv=r(base*c.ret_iva/100);
  let com=null,ivc=0;if(comMano!=null)com=comMano;else if(c.pct!=null){com=r(base*c.pct/100);ivc=r(com*c.iva_com/100)}
  return {base,com,ivc,ri,rv,neto:com==null?null:r(cobrado-com-ivc-ri-rv-(desc||0))}};
const comAuto=(p,cobrado)=>{const x=platCalc(p,cobrado,0);return x.com==null?null:Math.round((x.com+x.ivc)*100)/100};
function pintarLiq(){
  const box=$('#shLiq');if(!box)return;const m=hoja.motivo||'';
  if(!/^(Didi|Uber)/.test(m)){box.innerHTML='';return}
  const p=m.startsWith('Didi')?'Didi':'Uber',c=platCfg(p),au=comAuto(p,hoja.total||0);
  const dv=$('#shDesc')?$('#shDesc').value:(hoja.desc!=null?hoja.desc:''), cv=$('#shCom')?$('#shCom').value:(hoja.comision!=null?hoja.comision:''), bv=$('#shCob')?$('#shCob').value:(hoja.cobrado!=null?hoja.cobrado:'');
  box.innerHTML=`<div class="field"><label for="shCob">${p==='Didi'?'Subtotal del recibo de Didi':'Importe pagado del recibo de Uber'} <small>(lo que pagó el cliente por la comida)</small></label><input id="shCob" inputmode="decimal" placeholder="${fmt2(hoja.total||0)} si no lo escribes (precio de menú)" value="${esc(bv)}" autocomplete="off"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="field"><label for="shDesc">${p==='Didi'?'Descuento de la tarifa de entrega y otros que absorbes':'Otros que absorbes'}</label><input id="shDesc" inputmode="decimal" placeholder="$0" value="${esc(dv)}" autocomplete="off"></div>
    <div class="field"><label for="shCom">Comisión con IVA ${c.pct!=null?`<small>(${c.pct}% + ${c.iva_com}%)</small>`:''}</label><input id="shCom" inputmode="decimal" placeholder="${au!=null?fmt2(au)+' automática':'Escríbela'}" value="${esc(cv)}" autocomplete="off"></div></div>
    <p id="shNeto" class="sub" style="margin:4px 0 0"></p>`;
  calcLiq();
}
function calcLiq(){
  const out=$('#shNeto');if(!out)return;const p=(hoja.motivo||'').startsWith('Didi')?'Didi':'Uber',pr=hoja.total||0;
  const n=v=>{const x=parseFloat(String(v).replace(/[$,\s]/g,''));return isNaN(x)?null:x};
  const d=n($('#shDesc').value)||0,cm=n($('#shCom').value),cb=n($('#shCob').value),cob=cb!=null?cb:pr,x=platCalc(p,cob,d,cm);
