<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f2a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Control Holandesa</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..900&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Una columna tamaño teléfono: encabezado verde con fecha, contenido en tarjetas, barra de pestañas abajo */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --surface-2:#f7f8f4; --ink:#14221a; --muted:#5f6f64; --line:#e1e7df;
  --green:#123f2a; --green-2:#1f6b45; --green-3:#2f8a5b; --green-soft:#e4f0e7; --bar:#2f8a5b; --bar-dim:#c3dccb;
  --gold:#b08a4e; --gold-soft:#f6efe2;
  --good:#1d7a46; --good-bg:#e2f3e8; --warn:#9a6400; --warn-bg:#fcf0d6; --bad:#b4342b; --bad-bg:#fbe6e3;
  --shadow:0 1px 2px rgba(18,63,42,.06),0 6px 18px -10px rgba(18,63,42,.18);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hero-ink:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b120e; --surface:#131c16; --surface-2:#18231c; --ink:#e7efe9; --muted:#98a99d; --line:#243128;
  --green:#0f3523; --green-2:#7cc79a; --green-3:#5fb283; --green-soft:#1b2f23; --bar:#5fb283; --bar-dim:#2a4535;
  --gold:#d6b27a; --gold-soft:#2c2416;
  --good:#7fd6a0; --good-bg:#16301f; --warn:#f0bf5a; --warn-bg:#33280f; --bad:#f08b80; --bad-bg:#3a1a17;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b120e; --surface:#131c16; --surface-2:#18231c; --ink:#e7efe9; --muted:#98a99d; --line:#243128;
  --green:#0f3523; --green-2:#7cc79a; --green-3:#5fb283; --green-soft:#1b2f23; --bar:#5fb283; --bar-dim:#2a4535;
  --gold:#d6b27a; --gold-soft:#2c2416;
  --good:#7fd6a0; --good-bg:#16301f; --warn:#f0bf5a; --warn-bg:#33280f; --bad:#f08b80; --bad-bg:#3a1a17;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);margin:0;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit}
button:focus-visible,select:focus-visible,summary:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* encabezado */
header.top{position:sticky;top:0;z-index:20;background:var(--green);color:var(--hero-ink);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px;box-shadow:0 6px 20px -12px rgba(0,0,0,.5)}
.hin{max-width:720px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{font:900 19px/1 var(--display);font-stretch:72%;letter-spacing:.06em;margin:0;text-transform:uppercase}
.brand h1 span{color:var(--gold);font-weight:700}
@media (max-width:430px){.brand h1 span{display:none}}
.live{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.85;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:#7be3a3;box-shadow:0 0 0 3px rgba(123,227,163,.2)}
.live.off i{background:#f3b04b;box-shadow:0 0 0 3px rgba(243,176,75,.2)}
.datebar{display:flex;align-items:center;gap:8px;margin-top:10px}
.datebar button{border:0;background:rgba(255,255,255,.12);color:inherit;border-radius:10px;width:40px;height:40px;font-size:20px;cursor:pointer}
.datebar button:disabled{opacity:.3;cursor:default}
.datebar select{flex:1;min-width:0;height:40px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:inherit;font:600 15px var(--body);padding-inline:12px;appearance:none;-webkit-appearance:none;text-transform:capitalize}
.datebar select option{color:#14221a}

.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.note{margin:14px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--ink);font-size:13px}
section{display:flex;flex-direction:column;gap:12px;margin-top:14px}

/* barra de pestañas inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px -18px rgba(0,0,0,.35)}
nav.tabs .tin{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font:700 11px var(--display);font-stretch:85%;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;position:relative}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--green-2);background:var(--green-soft)}
nav.tabs .dot{position:absolute;top:2px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font:700 10px/17px var(--body);letter-spacing:0}

/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.card h2{font:800 14px var(--display);text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px;color:var(--green-2);display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h2 small{font:500 12px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.hero{background:linear-gradient(150deg,var(--green) 0%,#1d5b3c 100%);color:#fff;border-radius:20px;padding:20px;box-shadow:0 14px 30px -18px rgba(18,63,42,.7);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:1px solid rgba(214,178,122,.35)}
.hero .lbl{font:700 12px var(--display);text-transform:uppercase;letter-spacing:.14em;color:var(--gold)}
:root .hero .lbl{color:#d9b97f}
.hero .big{font:800 46px/1.02 var(--display);font-stretch:78%;margin:6px 0 10px;letter-spacing:-.01em}
.hero .cmp{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.hero .cmp span{background:rgba(255,255,255,.13);border-radius:20px;padding:3px 10px}
.hero .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.hero .mini b{display:block;font:800 21px/1.1 var(--display);font-stretch:85%}
.hero .mini span{font-size:11.5px;opacity:.75}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi b{display:block;font:800 22px/1.1 var(--display);font-stretch:85%}
.kpi span{color:var(--muted);font-size:12px}

/* alertas */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;font-size:13px;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);text-align:left}
.chip b{font:800 18px var(--display);font-stretch:85%}
.chip.bad{border-color:transparent;background:var(--bad-bg)} .chip.bad b{color:var(--bad)}
.chip.warn{border-color:transparent;background:var(--warn-bg)} .chip.warn b{color:var(--warn)}
.chip.good{border-color:transparent;background:var(--good-bg)} .chip.good b{color:var(--good)}

/* barras */
.rows{display:flex;flex-direction:column;gap:11px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:baseline}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{font-weight:700}
.row .track{grid-column:1/-1;height:8px;background:var(--green-soft);border-radius:5px;overflow:hidden}
.row .track i{display:block;height:100%;background:linear-gradient(90deg,var(--green-2),var(--bar));border-radius:5px}
.row .sub{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-2px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--body)}
.chart .lab{fill:var(--ink);font-weight:700}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item .meta{grid-column:1/-1;color:var(--muted);font-size:12px}
.pill{display:inline-block;font:700 10.5px var(--body);padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em;vertical-align:1px}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.gold{background:var(--gold-soft);color:var(--gold)} .pill.mut{background:var(--surface-2);color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;padding:2px 0;margin:0}
.ledger{width:100%;border-collapse:collapse;font-size:14px}
.ledger td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.ledger td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:10px}
.ledger tr.tot td{border-top:2px solid var(--ink);font-weight:800}
.ledger tr:first-child td{border-top:0}

/* selectores */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:6px 13px;font:600 13px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green-2);border-color:var(--green-2);color:var(--surface)}
:root .seg button[aria-pressed="true"]{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0b120e}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0b120e}
.seg.big button{padding:9px 16px;font-size:14px}
.dates{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:14px}
.dates input{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 14px var(--body);padding:0 8px}

.tscroll{overflow-x:auto}
table.tk{border-collapse:collapse;width:100%;font-size:13px}
table.tk th{text-align:left;color:var(--muted);font-weight:600;padding:5px 4px;border-bottom:1px solid var(--line);font-size:12px}
table.tk td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.tk td.r,table.tk th.r{text-align:right;white-space:nowrap}
table.tk tr.fam td{padding-top:14px;font-weight:700;color:var(--green-2);border-bottom:0}
table.tk tr.fam td span{color:var(--muted);font-weight:500}
table.tk tr.tt td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}

/* tickets */
.tkt{padding:13px 15px}
.tkt summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--ink);font-size:14px;margin:0}
.tkt summary::-webkit-details-marker{display:none}
.tk-top{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.tk-meta{color:var(--muted);font-size:12.5px}
.tk-meta b{color:var(--ink);font-weight:600}
.tk-items{margin-top:10px;font-size:13.5px}
.tk-items tr.pg td{color:var(--muted);font-weight:500}
.tkt.abierta{border-left:4px solid #2f6fd6}
.tkt.vieja{border-left-color:var(--bad)}
.dot-a,.dot-c{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.dot-a{background:#2f6fd6}.dot-c{background:#16a34a}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;font:600 14px var(--body);cursor:pointer;text-decoration:none}
.btn.pri{background:var(--green-2);border-color:var(--green-2);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#0b120e}}
:root[data-theme="dark"] .btn.pri{color:#0b120e}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost-bad{color:var(--bad);border-color:var(--bad-bg);background:var(--bad-bg)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.corte-h{font:800 16px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--green-2);margin:10px 0 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.corte-h small{font:500 12px var(--body);color:var(--muted);letter-spacing:0;text-transform:none}
.corte-tot{border-color:var(--green-3);background:var(--green-soft)}
.audit{font:12.5px/1.45 ui-monospace,"Cascadia Mono","Consolas","Menlo",monospace;margin:0;white-space:pre;color:var(--ink)}
.sep{font:12.5px ui-monospace,"Consolas",monospace;color:var(--muted);margin:8px 0;white-space:pre;overflow:hidden}

/* renglones que se abren con un toque */
.dtab{display:flex;flex-direction:column}
.drow{border-top:1px solid var(--line)}.dtab>:first-child{border-top:0}
.drow>summary{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:10px 0;margin:0;color:var(--ink);font-weight:500;font-size:14px;cursor:pointer}
.drow>summary::-webkit-details-marker{display:none}
.drow>summary>span:first-child::before{content:'';display:inline-block;width:7px;height:7px;border-right:2px solid var(--green-3);border-bottom:2px solid var(--green-3);transform:rotate(-45deg);margin:0 9px 1px 1px;transition:transform .15s}
.drow[open]>summary>span:first-child::before{transform:rotate(45deg)}
.drow>summary .num{font-weight:700;white-space:nowrap}.drow small,.dgrp small{color:var(--muted);font-weight:400}
.dlist{padding:2px 0 10px 14px;border-left:2px solid var(--green-soft);margin:0 0 8px 4px}
.ditem,.dgrp,.dfix{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0}
.ditem>span:last-child,.dgrp>span:last-child{white-space:nowrap}
.ditem small{display:block;color:var(--muted);font-size:12px}
.dgrp{font-weight:700;color:var(--green-2);padding-top:9px}
.dfix{font-size:14px;border-top:1px solid var(--line);padding:10px 0 10px 18px}.dfix .num{font-weight:700;white-space:nowrap}
.dfix.tot{border-top:2px solid var(--ink);font-weight:800}.dfix.tot .num{font-weight:800}
.dh3{font:800 12px var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:16px 0 4px}
.dh3:first-of-type{margin-top:4px}

/* mapa de calor */
.heat{display:grid;gap:3px;font-size:10.5px;color:var(--muted)}
.heat .c{height:26px;border-radius:5px;background:var(--surface-2)}
.heat .h{text-align:center;align-self:end}
.heat .d{align-self:center;font-weight:600;color:var(--ink);font-size:11.5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .w{text-align:center;font:700 11px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-bottom:2px}
.cal .x{border-radius:9px;padding:5px 4px;min-height:48px;background:var(--surface-2);display:flex;flex-direction:column;justify-content:space-between;font-size:11px;line-height:1.15}
.cal .x b{font-size:11.5px;color:var(--ink)} .cal .x span{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.cal .x.hi{outline:2px solid var(--green-3)} .cal .x.lo{outline:2px solid var(--bad)}
.cal .x.vacio{background:none}
select.msel{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:0 10px;max-width:100%}
.vs{display:grid;grid-template-columns:1fr auto auto auto;gap:0 10px;font-size:13.5px}
.vs>div{padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.vs>div:nth-child(-n+4){border-top:0;color:var(--muted);font-size:12px;font-weight:600}
.vs .r{text-align:right;white-space:nowrap}

/* hoja para quitar cuenta */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(5,15,10,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.sheet h3{font:800 20px var(--display);font-stretch:85%;margin:0 0 2px}
.sheet .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.mot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mot button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 10px;font:600 14px var(--body);cursor:pointer;text-align:left}
.mot button small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.mot button[aria-pressed="true"]{border-color:var(--green-2);background:var(--green-soft)}
.field{margin-top:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);font:500 15px var(--body);padding:0 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

footer{color:var(--muted);font-size:12px;margin-top:24px;line-height:1.5}
@media (max-width:380px){.hero .big{font-size:40px}.hero .mini b{font-size:18px}}
@media (prefers-reduced-motion:no-preference){.row .track i{transition:width .4s ease}}
</style>
</head><body>
<header class="top"><div class="hin">
  <div class="brand"><h1>La Holandesa <span>· Control</span></h1><span class="live" id="live"><i></i><span id="gen">Cargando…</span></span></div>
  <div class="datebar">
    <button id="prev" aria-label="Día anterior">‹</button>
    <select id="day" aria-label="Elegir día"></select>
    <button id="next" aria-label="Día siguiente">›</button>
  </div>
</div></header>
<div class="wrap">
  <p class="note" id="note" hidden></p>
  <main id="view"></main>
  <footer>Se actualiza cada 2 minutos. Venta = lo cobrado en tickets, sin propinas ni entradas de caja. Dólares al tipo de cambio que registró la caja. Las ventas se leen de MrTienda sin modificarlas; solo "Quitar cuenta" toca una cuenta abierta y antes la respalda.</footer>
</div>
<nav class="tabs" role="tablist"><div class="tin">
  <button role="tab" data-tab="hoy"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Hoy</button>
  <button role="tab" data-tab="tickets"><svg viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Tickets<span class="dot" id="tkDot" hidden></span></button>
  <button role="tab" data-tab="cortes"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>Cortes</button>
  <button role="tab" data-tab="control"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Control<span class="dot" id="ctlDot" hidden></span></button>
  <button role="tab" data-tab="reportes"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reportes</button>
</div></nav>

<script>
let DATA=null, byDate={}, days=[];
const $=s=>document.querySelector(s);
const COPIA=!!window.__COPIA__;

// piezas comunes
function bars(items,max){
  max=max||Math.max(1,...items.map(i=>i.v));
  return `<div class="rows">${items.map(i=>`<div class="row"><span class="n">${i.nh??esc(i.n)}</span><span class="v num">${i.vs??fmt(i.v)}</span><span class="track"><i style="width:${Math.max(1.5,100*i.v/max)}%"></i></span>${i.sub?`<span class="sub">${i.sub}</span>`:''}</div>`).join('')}</div>`;
}
function niceMax(m){const p=Math.pow(10,Math.floor(Math.log10(m)));for(const k of[1,2,2.5,5,10])if(k*p>=m)return k*p;return 10*p}
function colChart(vals,labels,{h=150,hl=-1,every=1,fmtTop=null}={}){
  const n=vals.length||1,W=340,pad=26,R=10,bw=(W-pad-R)/n,max=Math.max(1,...vals);
  const nice=niceMax(max),ticks=[0,nice/2,nice];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h+22}" role="img">`;
  ticks.forEach(t=>{const y=h-(t/nice)*(h-16);s+=`<line x1="${pad}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="0" y="${y+4}">${t>=1000?(t/1000)+'k':t}</text>`});
  vals.forEach((v,i)=>{const bh=(v/nice)*(h-16),x=pad+i*bw+bw*.14,w=bw*.72;
    s+=`<rect x="${x}" y="${h-bh}" width="${w}" height="${Math.max(bh,0)}" rx="3" fill="${i===hl?'var(--green-3)':'var(--bar-dim)'}"><title>${labels[i]}: ${fmt(v)}</title></rect>`;
    if(i%every===0||i===hl) s+=`<text x="${x+w/2}" y="${h+15}" text-anchor="middle" ${i===hl?'class="lab"':''}>${labels[i]}</text>`;
    if(fmtTop&&i===hl) s+=`<text class="lab" x="${Math.min(Math.max(x+w/2,30),W-30)}" y="${Math.max(h-bh-6,10)}" text-anchor="middle">${fmtTop(v)}</text>`;
  });
  return s+'</svg>';
}
const fila=(label,monto,det,n)=>`<details class="drow"><summary><span>${label}${n!=null?` <small>(${n})</small>`:''}</span><span class="num">${monto}</span></summary><div class="dlist">${det||'<p class="empty">Sin movimientos.</p>'}</div></details>`;
const fijo=(label,monto,cls)=>`<div class="dfix ${cls||''}"><span>${label}</span><span class="num">${monto}</span></div>`;
const linea=(a,b,c)=>`<div class="ditem"><span>${a}${c?`<small>${c}</small>`:''}</span><span class="num">${b}</span></div>`;
const grupoMov=(L,conDia)=>{const g={};L.forEach(e=>(g[e.cat]=g[e.cat]||[]).push(e));
  return Object.entries(g).sort((a,b)=>sumI(b[1])-sumI(a[1])).map(([k,v])=>`<div class="dgrp"><span>${esc(k)} <small>(${v.length})</small></span><span class="num">${fmt2(sumI(v))}</span></div>`+v.map(e=>linea(esc(e.ref),fmt2(e.importe),(conDia&&e.d?corto(e.d)+' · ':'')+esc(e.hora||'')+(conDia?' · '+nomT(e.turno):''))).join('')).join('')};
const tkPorForma=(ts,f)=>{const L=[];ts.forEach(t=>t.pagos.forEach(([ff,a])=>{if(ff===f)L.push([t,a])}));return L};
const lugar=t=>t.mesa?'Mesa '+esc(t.mesa):(t.llevar?'Para llevar':'Sin mesa');
const segBtns=(attr,opts,val)=>`<div class="seg">${opts.map(([k,l])=>`<button data-${attr}="${k}" aria-pressed="${val===k}">${l}</button>`).join('')}</div>`;
const esHoy=()=>cur===days[days.length-1];
function rangoRapido(k){const u=pd(days[days.length-1]);const w=(u.getDay()+6)%7;let a,b;
  if(k==='semana'){a=new Date(u);a.setDate(u.getDate()-w);b=u}
  else if(k==='semana_ant'){a=new Date(u);a.setDate(u.getDate()-w-7);b=new Date(a);b.setDate(a.getDate()+6)}
  else if(k==='mes'){a=new Date(u.getFullYear(),u.getMonth(),1);b=u}
  else if(k==='mes_ant'){a=new Date(u.getFullYear(),u.getMonth()-1,1);b=new Date(u.getFullYear(),u.getMonth(),0)}
  else {a=new Date(u);a.setDate(u.getDate()-29);b=u}
  return [iso(a),iso(b)]}
const QUICK=[['semana','Esta semana'],['semana_ant','Semana pasada'],['mes','Este mes'],['mes_ant','Mes pasado'],['30','30 días']];
function selectorFechas(pre,desde,hasta){
  return `<div class="seg">${QUICK.map(([k,l])=>{const [a,b]=rangoRapido(k);return `<button data-${pre}q="${k}" aria-pressed="${a===desde&&b===hasta}">${l}</button>`}).join('')}</div>
  <div class="dates"><label>Del <input type="date" id="${pre}D" value="${desde}" max="${days[days.length-1]}"></label><label>al <input type="date" id="${pre}H" value="${hasta}" max="${days[days.length-1]}"></label></div>`}

// alertas del día
function alertas(D){
  const out=[];
  const AB=esHoy()?(DATA.abiertas||[]):[];
  if(AB.length){const now=Date.now();const viejas=AB.filter(a=>{if(!a.fecha||!a.abrio)return false;return a.fecha<cur||(now-new Date(a.fecha+'T'+a.abrio+':00'))/6e4>=120});
    out.push({cls:viejas.length?'bad':'warn',n:AB.length,t:`mesas abiertas · ${fmt(AB.reduce((x,a)=>x+a.total,0))}${viejas.length?` · ${viejas.length} de más de 2 h`:''}`,go:'tickets'})}
  const falt=D.cortes.filter(c=>c.dif!=null&&c.dif<-20);
  if(falt.length) out.push({cls:'bad',n:fmt(-falt.reduce((x,c)=>x+c.dif,0)),t:`faltante en ${falt.length===1?'el corte':'los cortes'}`,go:'cortes'});
  else if(D.cortes.length&&D.cortes.every(c=>c.dif!=null&&Math.abs(c.dif)<=20)) out.push({cls:'good',n:'✓',t:'cortes cuadrados',go:'cortes'});
  const n=D.borrados.length+D.cancelados.length+D.precios.length;
  if(n) out.push({cls:'warn',n,t:'en control: borrados, cancelados o precios',go:'control'});
  if(D.descuentos.length) out.push({cls:'',n:fmt(D.descuentos.reduce((a,b)=>a+b.monto,0)),t:`en ${D.descuentos.length} descuentos`,go:'control'});
  const q=(DATA.quitadas||[]).filter(r=>r.fecha===cur);
  if(q.length) out.push({cls:'',n:q.length,t:`cuentas quitadas · ${fmt(q.reduce((a,r)=>a+(r.total||0),0))}`,go:'control'});
  return out.length?`<div class="chips">${out.map(a=>`<button class="chip ${a.cls}" data-go="${a.go}"><b class="num">${a.n}</b><span>${a.t}</span></button>`).join('')}</div>`:'';
}

// ---------- HOY
function delta(a,b,txt){if(!b||!b.total)return '';const p=Math.round(100*(a-b.total)/b.total);return `<span>${p>=0?'▲':'▼'} ${Math.abs(p)}% vs ${txt}</span>`}
function vHoy(D){
  const prom=D.tickets?D.total/D.tickets:0;
  const prev=byDate[shift(cur,-1)], wk=byDate[shift(cur,-7)];
  const hk=Object.keys(D.hora).map(Number).filter(h=>D.hora[h]>0);
  const h0=Math.min(8,...hk), h1=Math.max(22,...hk);
  const hrs=[];for(let h=h0;h<=h1;h++)hrs.push(h);
  const hv=hrs.map(h=>D.hora[h]||0), peak=hv.indexOf(Math.max(...hv));
  const totF=Object.values(D.formas).reduce((a,b)=>a+b,0)||1;
  return `<section>
  <div class="hero"><div class="lbl">Venta ${esHoy()&&D.abierto?'de hoy · en curso':'del día'}</div><div class="big num">${fmt2(D.total)}</div>
    <div class="cmp">${delta(D.total,prev,'día anterior')}${delta(D.total,wk,DC[pd(cur).getDay()]+' pasado')}</div>

  <div class="card"><h2>Formas de pago</h2>${bars(ordF(D.formas).map(([n,v])=>({n,v,vs:fmt2(v),sub:Math.round(100*v/totF)+'% del total'})))}
    ${D.llevar.tickets?`<p class="empty" style="margin-top:12px">Recoger aquí: ${D.llevar.tickets} tickets · ${fmt2(D.llevar.total)}</p>`:''}</div>
  <div class="card"><h2>Por mesero</h2>${bars(D.meseros.map(m=>({n:m.n,v:m.total,sub:m.tk+' tickets · promedio '+fmt(m.total/m.tk)})))}</div>
  ${cardProductos(D)}
  </section>`;
}
function cardProductos(D){
  const turnos=[...new Set(D.lista.map(t=>t.turno))].sort();
  if(prodT!=='dia'&&!turnos.includes(prodT)) prodT='dia';
  const m=new Map();
  D.lista.filter(t=>prodT==='dia'||t.turno===prodT).forEach(t=>t.items.forEach(i=>{const o=m.get(i.n)||{n:i.n,q:0,imp:0,f:i.f||'Otros'};o.q+=i.q;o.imp+=i.imp;m.set(i.n,o)}));
  const ps=[...m.values()].sort((a,b)=>b.imp-a.imp), tot=ps.reduce((a,p)=>a+p.imp,0)||1, pz=ps.reduce((a,p)=>a+p.q,0);
  let body;
  if(prodModo==='cat'){
    const g=new Map();ps.forEach(p=>{if(!g.has(p.f))g.set(p.f,[]);g.get(p.f).push(p)});
    const gs=[...g.entries()].sort((a,b)=>b[1].reduce((x,p)=>x+p.imp,0)-a[1].reduce((x,p)=>x+p.imp,0));
    body=`<div class="tscroll"><table class="tk num"><thead><tr><th>Producto</th><th class="r">Cant.</th><th class="r">Venta</th><th class="r">%</th></tr></thead>
      ${gs.map(([f,L])=>{const s=L.reduce((x,p)=>x+p.imp,0);return `<tbody><tr class="fam"><td colspan="4">${esc(f)} <span>· ${L.reduce((x,p)=>x+p.q,0)} pzas · ${fmt(s)} · ${pct(s,tot)}</span></td></tr>
      ${L.sort((a,b)=>b.q-a.q).map(p=>`<tr><td>${esc(p.n)}</td><td class="r">${p.q}</td><td class="r">${fmt(p.imp)}</td><td class="r">${pct(p.imp,tot)}</td></tr>`).join('')}</tbody>`}).join('')}
      <tbody><tr class="tt"><td>Total</td><td class="r">${pz}</td><td class="r">${fmt(tot)}</td><td class="r">100%</td></tr></tbody></table></div>`;
  } else {
    const L=prodModo==='top'?ps.slice(0,10):ps;
    body=bars(L.map(p=>({n:p.n,v:p.imp,sub:`${p.q} vendidos · ${pct(p.imp,tot)} de la venta · ${esc(p.f)}`})));
  }
  return `<div class="card"><h2>Productos <small>${ps.length} productos · ${pz} piezas</small></h2>
    ${segBtns('pm',[['top','Top 10'],['todos','Todos'],['cat','Por categoría']],prodModo)}
    <div style="height:8px"></div>${turnos.length>1?segBtns('pt',[['dia','Día completo'],...turnos.map(t=>[t,'Corte '+t+' · '+nomT(t).toLowerCase()])],prodT)+'<div style="height:12px"></div>':''}
    ${ps.length?body:'<p class="empty">Sin productos.</p>'}</div>`;
}

// ---------- TICKETS
function vTickets(D){
  const turnos=[...new Set(D.lista.map(t=>t.turno))].sort();
  if(tkT!=='dia'&&!turnos.includes(tkT)) tkT='dia';
  const AB=esHoy()?(DATA.abiertas||[]):[];
  const lleva=a=>{if(!a.fecha||!a.abrio)return null;return Math.max(0,Math.round((Date.now()-new Date(a.fecha+'T'+a.abrio+':00'))/6e4))};
  const abHTML=AB.length?`<h2 class="corte-h">Mesas abiertas ahora <small>${AB.length} · ${fmt2(AB.reduce((x,a)=>x+a.total,0))}</small></h2>${AB.map((a,ix)=>{const m=lleva(a),vieja=a.fecha&&a.fecha<cur;
    return `<details class="card tkt abierta ${vieja||m>=120?'vieja':''}"><summary><span class="tk-top"><b>${esc(a.mesa)}</b><span class="num">${fmt2(a.total)}</span></span>
      <span class="tk-meta">${a.llevar?'Para llevar':'Comedor'} · ${a.pers} pers. · ${a.arts} artículos · Atiende <b>${esc(a.mesero)}</b></span>
      <span class="tk-meta"><i class="dot-a"></i>Abrió <b>${vieja?corto(a.fecha)+' ':''}${esc(a.abrio)}</b> · <span class="pill ${vieja||m>=120?'bad':'warn'}">${vieja?'Abierta desde otro día':'Sin cobrar · '+dur(m)}</span></span></summary>
      ${a.items.length?`<table class="ledger num tk-items"><tbody>${a.items.map(i=>{const otro=i.f&&a.fecha&&i.f!==a.fecha;return `<tr><td>${i.q} × ${esc(i.n)}${i.llevar?' <span class="pill warn">Llevar</span>':''}${i.orig>i.imp+0.01?` <span class="pill bad">Precio ${fmt(i.orig)} → ${fmt(i.imp)}</span>`:''}<br><small style="color:var(--muted)">${otro?`<b style="color:var(--bad)">Agregado ${corto(i.f)}</b> `:''}${esc(i.h)}${i.quien?' · '+esc(i.quien):''}</small></td><td>${fmt2(i.imp)}</td></tr>`}).join('')}<tr class="tot"><td>Total</td><td>${fmt2(a.total)}</td></tr></tbody></table>`:'<p class="empty" style="margin-top:8px">El detalle de platillos de esta cuenta aún no está disponible.</p>'}
      ${COPIA||!a.archivo?'':`<div class="btns"><button class="btn ghost-bad" data-quitar="${ix}">Quitar cuenta…</button></div>`}</details>`}).join('')}`:'';
  if(!D.lista.length) return '<section>'+abHTML+'<p class="empty">No hay tickets cobrados este día.</p></section>';
  const L=D.lista.filter(t=>tkT==='dia'||t.turno===tkT);

    +segBtns('tm',[['tarjetas','Tarjetas'],['impresion','Formato impresión']],tkModo)
    +(turnos.length>1?segBtns('tt',[['dia','Día completo'],...turnos.map(t=>[t,'Corte '+t])],tkT):'');
  if(tkModo==='impresion'){
    const pad=(s,n)=>String(s).slice(0,n).padEnd(n,' '), rp=(s,n)=>String(s).padStart(n,' ');
    const tks=L.map(t=>{
      const l=[`TICKET ${t.folio}   ${nomT(t.turno).toUpperCase()}`, `${t.mesa?'Mesa: '+t.mesa:(t.llevar?'Para llevar':'Sin mesa')}   Personas: ${t.pers||1}`, `Abrió: ${t.abrio||t.hora}   Cobró: ${t.hora}${t.min!=null?'   ('+t.min+' min)':''}`, `Capturó: ${t.capturo}`, `Cobró:   ${t.cobro}`, ''];
      t.items.forEach(i=>{l.push(`${rp(i.q,2)} ${pad(i.n+(i.llevar?' (LL)':''),23)}${rp(fmt2(i.imp),11)}`); if(i.dcto>0) l.push(`   descuento${rp('-'+fmt2(i.dcto),24)}`)});
      l.push(`${rp('TOTAL',26)}${rp(fmt2(t.total),11)}`);
      (t.raw&&t.raw.length?t.raw:t.pagos.map(([f,a])=>[f,a,0])).forEach(([f,rec,cam])=>{l.push(f);l.push(`  Recibido ${rp(fmt2(rec),12)}  Cambio ${rp(fmt2(cam),9)}`)});
      return `<pre class="audit">${esc(l.join('\n'))}</pre>`}).join(`<div class="sep">- - - - - - - - - - - - - - - - - - -</div>`);
    return html+`<div class="card"><div class="tscroll">${tks}</div></div></section>`;
  }
  html+=`<div class="seg"><button data-tk="abrir">Abrir todos</button><button data-tk="cerrar">Cerrar todos</button></div>`;
  const tk=t=>`<details class="card tkt"><summary><span class="tk-top"><b>Ticket ${esc(t.folio)}</b><span class="num">${fmt2(t.total)}</span></span>

      <span class="tk-meta">Capturó <b>${esc(t.capturo)}</b> · Cobró <b>${esc(t.cobro)}</b></span></summary>
    <table class="ledger num tk-items"><tbody>${t.items.map(i=>`<tr><td>${i.q} × ${esc(i.n)}${i.llevar?' <span class="pill warn">Llevar</span>':''}${i.dcto>0?` <span class="pill bad">-${fmt(i.dcto)}</span>`:''}</td><td>${fmt2(i.imp)}</td></tr>`).join('')}
    ${t.pagos.map(([f,a])=>`<tr class="pg"><td>Pagó con ${esc(f)}</td><td>${fmt2(a)}</td></tr>`).join('')}
    <tr class="tot"><td>Total</td><td>${fmt2(t.total)}</td></tr></tbody></table></details>`;
  turnos.filter(tn=>tkT==='dia'||tn===tkT).forEach(tn=>{const ts=L.filter(t=>t.turno===tn),c=D.cortes.find(c=>c.turno===tn)||{};
    const v=ts.map(t=>t.min).filter(m=>m!=null), pm=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;
    html+=`<h2 class="corte-h">Corte ${tn} · ${nomT(tn)} <small>${ts.length} tickets · ${fmt2(ts.reduce((a,t)=>a+t.total,0))}${c.cajero?' · cajera '+esc(c.cajero):''}${pm!=null?' · promedio en mesa '+dur(pm):''}</small></h2>${ts.map(tk).join('')}`});
  return html+'</section>';
}

function formasDrill(o,total,tk,ts,multi,conDia){
  return `<div class="dtab">${ordF(o).map(([f,v])=>{const L=tkPorForma(ts,f);
    return fila(esc(f),fmt2(v),L.map(([t,a])=>linea(`Ticket ${esc(t.folio)} · ${conDia?corto(t.d)+' ':''}${esc(t.hora)}`,fmt2(a),`${multi?'Corte '+esc(t.turno)+' · ':''}${lugar(t)} · Cobró ${esc(t.cobro)}`)).join(''),L.length)}).join('')}
    ${fijo('Venta total'+(tk!=null?' · '+tk+' tickets':''),fmt2(total),'tot')}</div>`}
function estadoCorte(c){return c.dif==null?'<span class="pill warn">Sin conteo</span>':Math.abs(c.dif)<=20?'<span class="pill good">Cuadra</span>':c.dif>0?`<span class="pill warn">Sobran ${fmt2(c.dif)}</span>`:`<span class="pill bad">Faltan ${fmt2(-c.dif)}</span>`}
function vCorteDia(D){
  if(!D.cortes.length) return '<p class="empty">Sin cortes este día.</p>';
  const esVale=e=>e.cat==='Vales', entD=D.entradas||[], salD=D.salidas||[];
  return `<div class="card"><h2>Día completo <small>${D.cortes.length} cortes · ${lbl(cur)}</small></h2>
    <h3 class="dh3">Ventas por forma de pago</h3>${formasDrill(D.formas,D.total,D.tickets,D.lista,true)}
    <h3 class="dh3">Movimientos de caja</h3><div class="dtab">${bloqueCaja(entD,salD.filter(e=>!esVale(e)),salD.filter(esVale))}</div>
    <p class="empty" style="margin-top:10px">Toca cualquier renglón para ver el detalle.</p></div>
  ${D.cortes.map(c=>{
    const ts=D.lista.filter(t=>t.turno===c.turno), ent=entD.filter(e=>e.turno===c.turno), sal=salD.filter(e=>e.turno===c.turno);
    const efe=tkPorForma(ts,'Efectivo').concat(tkPorForma(ts,'Efectivo (dólares)'));
    return `<div class="card"><h2>Corte ${esc(c.turno)} · ${nomT(c.turno)} ${estadoCorte(c)}</h2>
    <h3 class="dh3">Ventas por forma de pago</h3>${formasDrill(c.formas,c.venta,c.tickets,ts,false)}
    <h3 class="dh3">Efectivo en caja</h3><div class="dtab">
      ${fila('Ventas en efectivo (pesos y dólares)',fmt2(c.ventas_efe),efe.map(([t,a])=>linea(`Ticket ${esc(t.folio)} · ${esc(t.hora)}`,fmt2(a),lugar(t))).join(''),efe.length)}
      ${bloqueCaja(ent,sal.filter(e=>!esVale(e)),sal.filter(esVale))}
      ${fijo('Efectivo que debe haber',fmt2(c.esperado),'tot')}
      ${fijo('Efectivo contado',c.contado==null?'—':fmt2(c.contado))}
      ${fijo('Diferencia',c.dif==null?'—':(c.dif>=0?'+':'−')+fmt2(Math.abs(c.dif)))}</div>
    <p class="empty" style="margin-top:10px">Fondo de caja aparte: ${fmt2(c.fondo)} · Cajera: ${esc(c.cajero)}${c.folz?' · Z '+esc(c.folz):''}</p></div>`}).join('')}
  <p class="empty">Se considera que cuadra si la diferencia es de $20 o menos.</p>`;
}
function vPeriodo(){
  if(!pDesde){[pDesde,pHasta]=rangoRapido('semana')}
  if(pDesde>pHasta){const t=pDesde;pDesde=pHasta;pHasta=t}
  const ds=days.filter(d=>d>=pDesde&&d<=pHasta);
  const formas={},tks=[],ent=[],sal=[],dia=[];let tot=0,ntk=0,efe=0,esp=0,dif=0,sinConteo=0;
  ds.forEach(d=>{const D=DATA.detalle[d];if(!D)return;
    Object.entries(D.formas||{}).forEach(([f,v])=>formas[f]=(formas[f]||0)+v);
    D.lista.forEach(t=>tks.push({...t,d}));(D.entradas||[]).forEach(e=>ent.push({...e,d}));(D.salidas||[]).forEach(e=>sal.push({...e,d}));
    tot+=D.total;ntk+=D.tickets;let dd=0,hay=false;
    D.cortes.forEach(c=>{efe+=c.ventas_efe;esp+=c.esperado;if(c.contado!=null){dif+=c.dif;dd+=c.dif;hay=true}else sinConteo++});
    dia.push({d,D,dif:hay?dd:null})});
  const ret=sal.filter(e=>e.cat!=='Vales'), val=sal.filter(e=>e.cat==='Vales');
  const aviso=pDesde<days[0]?`<p class="note" style="margin:10px 0 0">El detalle está disponible desde el ${corto(days[0])}.</p>`:'';
  const salT=sumI(ret);const cats={};ret.forEach(e=>cats[e.cat]=(cats[e.cat]||0)+e.importe);
  return `<div class="card">${selectorFechas('p',pDesde,pHasta)}${aviso}</div>
  ${!ds.length?'<p class="empty">No hay ventas en esas fechas.</p>':`
  <div class="kpis"><div class="kpi"><b class="num">${fmt(tot)}</b><span>venta · ${ds.length} días</span></div><div class="kpi"><b class="num" style="color:${dif<-20?'var(--bad)':dif>20?'var(--warn)':'var(--good)'}">${(dif>=0?'+':'−')+fmt(Math.abs(dif))}</b><span>diferencia de cortes${sinConteo?' · '+sinConteo+' sin conteo':''}</span></div></div>
  <div class="card"><h2>Corte del periodo <small>${corto(pDesde)} al ${corto(pHasta)}</small></h2>
    <h3 class="dh3">Ventas por forma de pago</h3>${formasDrill(formas,tot,ntk,tks,true,true)}
    <h3 class="dh3">Movimientos de caja</h3><div class="dtab">${bloqueCaja(ent,ret,val,true)}</div>
    <h3 class="dh3">Efectivo</h3><div class="dtab">
      ${fijo('Ventas en efectivo (pesos y dólares)',fmt2(efe))}
      ${(()=>{const n=sumI(ent)-sumI(ret)-sumI(val);return fijo('+ Entradas − retiros − vales',(n<0?'−':'+')+fmt2(Math.abs(n)))})()}
      ${fijo('Efectivo que debió quedar en caja',fmt2(esp),'tot')}
      ${fijo('Diferencias de los cortes',(dif>=0?'+':'−')+fmt2(Math.abs(dif)))}</div>
    <h3 class="dh3">Día por día</h3><div class="dtab">
      ${dia.map(({d,D,dif})=>{const s=dif==null?'':Math.abs(dif)<=20?' <span class="pill good">Cuadra</span>':dif>0?` <span class="pill warn">+${fmt(dif)}</span>`:` <span class="pill bad">−${fmt(-dif)}</span>`;
        return fila(corto(d)+s,fmt2(D.total),ordF(D.formas||{}).map(([f,v])=>linea(esc(f),fmt2(v))).join('')+D.cortes.map(c=>linea(`Corte ${esc(c.turno)} · cajera ${esc(c.cajero)}`,fmt2(c.venta),`Efectivo esperado ${fmt2(c.esperado)}${c.contado!=null?' · contado '+fmt2(c.contado):' · sin conteo'}`)).join(''),D.tickets)}).join('')}
      ${fijo('Total del periodo',fmt2(tot),'tot')}</div></div>
  ${ret.length?`<div class="card"><h2>Salidas por tipo <small>${fmt2(salT)}</small></h2>${bars(Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({n,v,vs:fmt2(v),sub:pct(v,salT)})))}</div>`:''}`}`;
}

function quitadaItem(r,conFecha){

    ${COPIA?'':` · <a href="#" data-motivo="${esc(r.id)}" style="color:var(--green-2);font-weight:600">cambiar motivo</a>`}</span></div>`}
function vControl(D){
  const bt=D.borrados.reduce((a,b)=>a+(b.importe||0)*(b.cant||1),0), dt=D.descuentos.reduce((a,b)=>a+b.monto,0);

  const ch=(n,t,cls)=>`<div class="chip ${n?cls:''}" style="cursor:default"><b class="num">${n}</b><span>${t}</span></div>`;
  return `<section>
  <div class="kpis">${ch(D.borrados.length,'artículos borrados · '+fmt(bt),'bad')}${ch(D.cancelados.length,'tickets cancelados','bad')}${ch(D.descuentos.length,'descuentos · '+fmt(dt),'warn')}${ch(D.precios.length,'cambios de precio','warn')}</div>
  <div class="card"><h2>Cuentas quitadas <small>${q.length} · ${fmt2(q.reduce((a,r)=>a+(r.total||0),0))}</small></h2>${itemList(q,r=>quitadaItem(r,false),'No se quitó ninguna cuenta este día.')}</div>
  <div class="card"><h2>Cambios de precio</h2>
    ${itemList(D.precios,p=>`<div class="item"><span>${esc(p.prod)} <span class="pill warn">${esc(p.lista)}</span></span><span class="num">${p.antes==null?'':fmt2(p.antes)+' → '}${fmt2(p.ahora)}</span><span class="meta">${esc(p.hora)} · ${esc(p.quien)}${p.antes==null?' · precio nuevo':''}</span></div>`,'Nadie cambió precios este día.')}</div>
  <div class="card"><h2>Artículos borrados <small>quitados de una cuenta abierta</small></h2>
    ${itemList(D.borrados,b=>`<div class="item"><span>${esc(b.cant>1?b.cant+' × ':'')}${esc(b.prod)}</span><span class="num">${fmt2((b.importe||0)*(b.cant||1))}</span><span class="meta">${esc(b.hora)} · ${esc(b.mesa||'sin mesa')} · borró ${esc(b.quien)}${b.motivo?' · '+esc(b.motivo):''}</span></div>`,'Nadie borró artículos este día.')}
    ${DATA.bitacora_hasta&&cur>DATA.bitacora_hasta?`<p class="note" style="margin-top:12px">MrTienda dejó de registrar los artículos borrados el ${lbl(DATA.bitacora_hasta)}. Pídele a tu proveedor que vuelva a activar la bitácora de artículos eliminados.</p>`:''}</div>
  <div class="card"><h2>Descuentos y precios cambiados</h2>
    ${itemList(D.descuentos,d=>`<div class="item"><span>${esc(d.prod)} <span class="pill warn">-${Math.round(d.pct)}%</span></span><span class="num">-${fmt2(d.monto)}</span><span class="meta">${esc(d.hora)} · ticket ${esc(d.ticket)} · de ${fmt(d.orig)} a ${fmt2(d.cobrado)} · ${esc(d.quien)}</span></div>`,'Sin descuentos este día.')}</div>
  <div class="card"><h2>Tickets cancelados</h2>
    ${itemList(D.cancelados,c=>`<div class="item"><span>Ticket ${esc(c.folio)}</span><span class="num">${fmt2(c.importe)}</span><span class="meta">${esc(c.hora)} · ${esc(c.quien)}</span></div>`,'No hubo tickets cancelados.')}</div>
  </section>`;
}

// ---------- REPORTES
const REPS=[['historial','Historial'],['quitadas','Cuentas quitadas'],['cajeras','Cajeras'],['meseros','Meseros'],['mes','Por mes'],['calor','Horas y días'],['compara','Comparativos']];
function vReportes(){
  if(!rDesde){[rDesde,rHasta]=rangoRapido('mes')}
  if(rDesde>rHasta){const t=rDesde;rDesde=rHasta;rHasta=t}
  const head=segBtns('rp',REPS,repModo);
  const fn={historial:rHist,quitadas:rQuitadas,cajeras:rCajeras,meseros:rMeseros,calor:rCalor,compara:rCompara,mes:rMes}[repModo]||rHist;
  return '<section>'+head+fn()+'</section>';
}
const conFechas=()=>`<div class="card">${selectorFechas('r',rDesde,rHasta)}</div>`;

  const last=DATA.diario.filter(x=>x.fecha<=cur).slice(-30), ms=DATA.mensual.slice(-13);

  <div class="card"><h2>Ventas por mes</h2>${colChart(ms.map(x=>x.total),ms.map(x=>mesTxt(x.mes)),{hl:ms.length-1,every:2,fmtTop:fmt})}

function enRango(){return days.filter(d=>d>=rDesde&&d<=rHasta&&DATA.detalle[d])}
function rCajeras(){
  const ds=enRango(), m={};
  ds.forEach(d=>DATA.detalle[d].cortes.forEach(c=>{const k=c.cajero||'Sin nombre';const o=m[k]=m[k]||{n:k,cortes:[],dif:0,falt:0,sobr:0,sin:0,venta:0};
    o.cortes.push({...c,d});o.venta+=c.venta;if(c.dif==null)o.sin++;else{o.dif+=c.dif;if(c.dif<-20)o.falt+=c.dif;else if(c.dif>20)o.sobr+=c.dif}}));
  const L=Object.values(m).sort((a,b)=>a.falt-b.falt);
  return conFechas()+(L.length?`<div class="card"><h2>Diferencias por cajera <small>${ds.length} días</small></h2><div class="dtab">${L.map(o=>{
    const s=o.dif<-20?`<span class="pill bad">−${fmt(-o.dif)}</span>`:o.dif>20?`<span class="pill warn">+${fmt(o.dif)}</span>`:'<span class="pill good">Cuadra</span>';
    return fila(`${esc(o.n)} ${s}`,o.cortes.length+' cortes',o.cortes.map(c=>linea(`${corto(c.d)} · corte ${esc(c.turno)} ${estadoCorte(c)}`,fmt2(c.venta),`Esperado ${fmt2(c.esperado)}${c.contado!=null?' · contado '+fmt2(c.contado):''}`)).join('')
      +linea('<b>Faltantes acumulados</b>',fmt2(o.falt))+linea('<b>Sobrantes acumulados</b>',fmt2(o.sobr))+(o.sin?linea('Cortes sin conteo',o.sin):''))}).join('')}</div>
    <p class="empty" style="margin-top:10px">Faltante o sobrante cuenta cuando la diferencia del corte es mayor a $20.</p></div>`:'<p class="empty">Sin cortes en estas fechas.</p>');
}
function rMeseros(){
  const ds=enRango(), m={};const g=k=>m[k]=m[k]||{n:k,venta:0,tk:0,min:[],desc:0,ndesc:0,borr:0,nborr:0};
  ds.forEach(d=>{const D=DATA.detalle[d];
    D.lista.forEach(t=>{const o=g(t.mesero);o.venta+=t.total;o.tk++;if(t.min!=null)o.min.push(t.min)});
    D.descuentos.forEach(x=>{const o=g(x.quien);o.desc+=x.monto;o.ndesc++});
    D.borrados.forEach(x=>{const o=g(x.mesero||x.quien);o.borr+=(x.importe||0)*(x.cant||1);o.nborr++})});
  const L=Object.values(m).filter(o=>o.tk||o.ndesc||o.nborr).sort((a,b)=>b.venta-a.venta);
  return conFechas()+(L.length?`<div class="card"><h2>Venta por mesero <small>${ds.length} días</small></h2>${bars(L.filter(o=>o.tk).map(o=>({n:o.n,v:o.venta,sub:`${o.tk} tickets · promedio ${fmt(o.venta/o.tk)}${o.min.length?' · '+dur(Math.round(o.min.reduce((a,b)=>a+b,0)/o.min.length))+' por mesa':''}`})))}</div>
  <div class="card"><h2>Descuentos y borrados <small>quién los hizo o autorizó</small></h2><div class="tscroll"><table class="tk num"><thead><tr><th>Persona</th><th class="r">Desc.</th><th class="r">Importe</th><th class="r">Borr.</th><th class="r">Importe</th></tr></thead><tbody>
    ${L.filter(o=>o.ndesc||o.nborr).sort((a,b)=>(b.desc+b.borr)-(a.desc+a.borr)).map(o=>`<tr><td>${esc(o.n)}</td><td class="r">${o.ndesc}</td><td class="r">${fmt(o.desc)}</td><td class="r">${o.nborr}</td><td class="r">${fmt(o.borr)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sin descuentos ni borrados.</td></tr>'}</tbody></table></div>
    <p class="empty" style="margin-top:10px">Si alguien concentra muchos descuentos o borrados, vale la pena revisar sus tickets.</p></div>`:'<p class="empty">Sin ventas en estas fechas.</p>');
}
function rCalor(){
  const ds=days.filter(d=>d<=cur).slice(-56), M={}, C={};
  ds.forEach(d=>{const w=pd(d).getDay();C[w]=(C[w]||0)+1;Object.entries(DATA.detalle[d].hora||{}).forEach(([h,v])=>{const k=w+'-'+h;M[k]=(M[k]||0)+v})});
  const hs=[...new Set(Object.keys(M).map(k=>+k.split('-')[1]))].sort((a,b)=>a-b);
  if(!hs.length) return '<p class="empty">Sin datos.</p>';
  const h0=hs[0],h1=hs[hs.length-1],H=[];for(let h=h0;h<=h1;h++)H.push(h);
  const avg=(w,h)=>C[w]?(M[w+'-'+h]||0)/C[w]:0;
  const mx=Math.max(1,...[0,1,2,3,4,5,6].flatMap(w=>H.map(h=>avg(w,h))));
  let best=[0,0,0];[0,1,2,3,4,5,6].forEach(w=>H.forEach(h=>{const v=avg(w,h);if(v>best[2])best=[w,h,v]}));
  const cell=(w,h)=>{const v=avg(w,h),a=v/mx;return `<div class="c" title="${DIAS[w]} ${h}:00 · ${fmt(v)}" style="background:${v?`rgba(47,138,91,${(0.12+0.88*a).toFixed(2)})`:'var(--surface-2)'}"></div>`};
  return `<div class="card"><h2>Venta promedio por día y hora <small>últimas 8 semanas</small></h2>
    <div class="tscroll"><div class="heat" style="grid-template-columns:34px repeat(${H.length},minmax(16px,1fr));min-width:${34+H.length*19}px">
      <div></div>${H.map(h=>`<div class="h">${h%2===0?h:''}</div>`).join('')}
      ${[1,2,3,4,5,6,0].map(w=>`<div class="d">${DC[w]}</div>${H.map(h=>cell(w,h)).join('')}`).join('')}</div></div>
    <p class="empty" style="margin-top:12px">Lo más fuerte: <b style="color:var(--ink)">${DIAS[best[0]]} a las ${best[1]}:00</b>, con ${fmt(best[2])} en promedio por esa hora. Úsalo para decidir cuánto personal poner.</p></div>
  <div class="card"><h2>Promedio por hora <small>todos los días</small></h2>${bars(H.map(h=>{const v=[0,1,2,3,4,5,6].reduce((a,w)=>a+(M[w+'-'+h]||0),0)/(ds.length||1);return {n:h+':00',v}}))}</div>`;
}
// ---- ventas por mes, día por día
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mesTxtL=m=>{const [y,mm]=m.split('-');return MESL[+mm-1]+' '+y};
let mesSel=null, cmpA=null, cmpB=null;
const diasMes=m=>DATA.diario.filter(x=>x.fecha.slice(0,7)===m);
function porDiaSemana(L){const s=[0,0,0,0,0,0,0],c=[0,0,0,0,0,0,0];L.forEach(x=>{const g=pd(x.fecha).getDay();s[g]+=x.total;c[g]++});return [0,1,2,3,4,5,6].map(g=>({g,v:c[g]?s[g]/c[g]:0,n:c[g]}))}
const mesOpts=(v,id)=>`<select class="msel" id="${id}" aria-label="Elegir mes">${DATA.mensual.slice().reverse().map(x=>`<option value="${x.mes}" ${x.mes===v?'selected':''}>${mesTxtL(x.mes)}</option>`).join('')}</select>`;
function rMes(){
  const ms=DATA.mensual.map(x=>x.mes); if(!mesSel||!ms.includes(mesSel)) mesSel=ms[ms.length-1];
  const L=diasMes(mesSel), tot=L.reduce((a,x)=>a+x.total,0), tk=L.reduce((a,x)=>a+x.tickets,0), prom=L.length?tot/L.length:0;
  const ws=porDiaSemana(L).filter(w=>w.n), lo=ws.length?ws.reduce((a,b)=>b.v<a.v?b:a):null, hi=ws.length?ws.reduce((a,b)=>b.v>a.v?b:a):null;
  const [y,m]=mesSel.split('-').map(Number), first=new Date(y,m-1,1), nd=new Date(y,m,0).getDate(), off=(first.getDay()+6)%7;
  const by=Object.fromEntries(L.map(x=>[x.fecha,x])), mx=Math.max(1,...L.map(x=>x.total));
  const dLo=L.length?L.reduce((a,b)=>b.total<a.total?b:a):null, dHi=L.length?L.reduce((a,b)=>b.total>a.total?b:a):null;
  let cal='<div class="cal">'+['lun','mar','mié','jue','vie','sáb','dom'].map(w=>`<div class="w">${w}</div>`).join('')+'<div class="x vacio"></div>'.repeat(off);
  for(let d=1;d<=nd;d++){const f=iso(new Date(y,m-1,d)),x=by[f];
    cal+=x?`<div class="x ${x===dHi?'hi':x===dLo?'lo':''}" style="background:rgba(47,138,91,${(0.1+0.6*x.total/mx).toFixed(2)})" title="${lbl(f)} · ${fmt(x.total)}"><b>${d}</b><span>${x.total>=1000?(x.total/1000).toFixed(1)+'k':fmt(x.total)}</span></div>`:`<div class="x"><b style="color:var(--muted)">${d}</b><span style="color:var(--muted);font-weight:400">—</span></div>`}
  cal+='</div>';
  const filas=[...ms].reverse().map(k=>{const D=diasMes(k),t=D.reduce((a,x)=>a+x.total,0),pr=D.length?t/D.length:0;const [yy,mm]=k.split('-');const ya=DATA.mensual.find(x=>x.mes===(+yy-1)+'-'+mm);
    const dy=ya&&ya.total&&k!==ms[ms.length-1]?Math.round(100*(t-ya.total)/ya.total):null;
    return `<tr${k===mesSel?' style="background:var(--green-soft)"':''}><td><a href="#" data-mes="${k}" style="color:var(--green-2);font-weight:600">${MESES[+mm-1]} ${yy}</a></td><td class="r">${fmt(t)}</td><td class="r">${fmt(pr)}</td><td class="r">${dy==null?'—':`<span style="color:${dy>=0?'var(--good)':'var(--bad)'}">${dy>=0?'+':''}${dy}%</span>`}</td></tr>`}).join('');
  return `<div class="card">${mesOpts(mesSel,'rMes')}</div>
  <div class="kpis"><div class="kpi"><b class="num">${fmt(tot)}</b><span>venta de ${MESL[m-1]}</span></div><div class="kpi"><b class="num">${fmt(prom)}</b><span>promedio por día · ${L.length} días</span></div>
    <div class="kpi"><b class="num">${tk}</b><span>tickets</span></div><div class="kpi"><b class="num">${fmt(tk?tot/tk:0)}</b><span>ticket promedio</span></div></div>
  <div class="card"><h2>Día por día <small>${dLo?'más bajo: '+corto(dLo.fecha):''}</small></h2>${cal}
    <p class="empty" style="margin-top:10px">Más verde = más venta. Marco verde: el mejor día; marco rojo: el más bajo.</p></div>
  <div class="card"><h2>Promedio por día de la semana <small>${MESL[m-1]}</small></h2>
    ${bars([1,2,3,4,5,6,0].map(g=>ws.find(w=>w.g===g)).filter(Boolean).map(w=>({nh:esc(DIAS[w.g][0].toUpperCase()+DIAS[w.g].slice(1))+(w===lo?' <span class="pill bad">Más bajo</span>':w===hi?' <span class="pill good">Más alto</span>':''),v:w.v,sub:`${w.n} ${DIAS[w.g]}${w.n===1||!/o$/.test(DIAS[w.g])?'':'s'} · ${prom?(w.v>=prom?'+':'')+Math.round(100*(w.v-prom)/prom)+'% vs el promedio':''}`})))}
    ${lo&&prom&&lo.v<prom*0.85?`<p class="note" style="margin-top:12px">Los ${DIAS[lo.g]} venden ${Math.round(100*(1-lo.v/prom))}% menos que un día normal de este mes. Puede ser buen día para una promoción.</p>`:''}</div>
  <div class="card"><h2>Todos los meses <small>toca uno para verlo</small></h2><div class="tscroll"><table class="tk num"><thead><tr><th>Mes</th><th class="r">Venta</th><th class="r">Prom. día</th><th class="r">vs año ant.</th></tr></thead><tbody>${filas}</tbody></table></div>
    <p class="empty" style="margin-top:10px">El mes actual puede estar incompleto.</p></div>`;
}
function rMesVsMes(){
  const ms=DATA.mensual.map(x=>x.mes), ul=ms[ms.length-1];
  if(!cmpA||!ms.includes(cmpA)) cmpA=ul;
  if(!cmpB||!ms.includes(cmpB)){const [y,m]=cmpA.split('-');const ya=(+y-1)+'-'+m;cmpB=ms.includes(ya)?ya:(ms[ms.length-2]||ul)}
  const A=diasMes(cmpA),B=diasMes(cmpB);
  const r=L=>{const t=L.reduce((a,x)=>a+x.total,0),k=L.reduce((a,x)=>a+x.tickets,0);return {t,k,n:L.length,pd:L.length?t/L.length:0,tp:k?t/k:0}};
  const a=r(A),b=r(B);
  const dl=(x,y)=>y?Math.round(100*(x-y)/y):null;
  const cel=d=>d==null?'—':`<span style="color:${d>=0?'var(--good)':'var(--bad)'}">${d>=0?'+':''}${d}%</span>`;
  const wa=porDiaSemana(A), wb=porDiaSemana(B);
  const ren=(l,x,y,f)=>`<div>${l}</div><div class="r">${f(x)}</div><div class="r">${f(y)}</div><div class="r">${cel(dl(x,y))}</div>`;
  const inc=cmpA===ul||cmpB===ul;
  return `<div class="card"><h2>Mes contra mes <small>cualquier mes de cualquier año</small></h2>
    <div class="dates" style="margin-top:0">${mesOpts(cmpA,'cA')}<span>contra</span>${mesOpts(cmpB,'cB')}</div>
    <div class="vs" style="margin-top:14px"><div></div><div class="r">${MESES[+cmpA.slice(5)-1]} ${cmpA.slice(2,4)}</div><div class="r">${MESES[+cmpB.slice(5)-1]} ${cmpB.slice(2,4)}</div><div class="r">Cambio</div>
      ${ren('<b>Venta</b>',a.t,b.t,fmt)}${ren('Promedio por día',a.pd,b.pd,fmt)}${ren('Tickets',a.k,b.k,v=>v)}${ren('Ticket promedio',a.tp,b.tp,fmt)}${ren('Días con venta',a.n,b.n,v=>v)}
      ${[1,2,3,4,5,6,0].filter(g=>wa[g].n||wb[g].n).map(g=>ren(DIAS[g][0].toUpperCase()+DIAS[g].slice(1)+' <small style="color:var(--muted)">prom.</small>',wa[g].v,wb[g].v,fmt)).join('')}</div>
    ${inc?`<p class="note" style="margin-top:12px">${mesTxtL(ul)} va en curso. Para comparar parejo fíjate en el promedio por día y en los días de la semana, no en la venta total.</p>`:''}</div>`;
}
function rCompara(){
  const u=days[days.length-1], ud=pd(u), wd=(ud.getDay()+6)%7;
  const sumD=(a,b)=>{const L=DATA.diario.filter(x=>x.fecha>=a&&x.fecha<=b);return {t:L.reduce((s,x)=>s+x.total,0),k:L.reduce((s,x)=>s+x.tickets,0),n:L.length}};
  const sem=shift(u,-wd), semA=shift(sem,-7), semAh=shift(u,-7);
  const mes=iso(new Date(ud.getFullYear(),ud.getMonth(),1));
  const mA=new Date(ud.getFullYear(),ud.getMonth()-1,1), mAh=new Date(ud.getFullYear(),ud.getMonth()-1,Math.min(ud.getDate(),new Date(ud.getFullYear(),ud.getMonth(),0).getDate()));
  const yA=new Date(ud.getFullYear()-1,ud.getMonth(),1), yAh=new Date(ud.getFullYear()-1,ud.getMonth(),Math.min(ud.getDate(),new Date(ud.getFullYear()-1,ud.getMonth()+1,0).getDate()));
  const fila3=(t,a,b,la,lb)=>{const d=b.t?Math.round(100*(a.t-b.t)/b.t):null;
    return `<div class="card"><h2>${t}${d!=null?` <span class="pill ${d>=0?'good':'bad'}">${d>=0?'▲':'▼'} ${Math.abs(d)}%</span>`:''}</h2>
      <table class="ledger num"><tbody><tr><td><b>${la}</b></td><td>${fmt2(a.t)}</td></tr><tr><td style="color:var(--muted)">${a.k} tickets · promedio ${fmt(a.k?a.t/a.k:0)}</td><td></td></tr>
      <tr><td><b>${lb}</b></td><td>${b.n?fmt2(b.t):'Sin datos'}</td></tr>${b.n?`<tr><td style="color:var(--muted)">${b.k} tickets · promedio ${fmt(b.k?b.t/b.k:0)}</td><td></td></tr>`:''}</tbody></table></div>`};
  return rMesVsMes()+`<h2 class="corte-h">Mismo tramo</h2><p class="empty">Se compara el mismo tramo: por ejemplo, de lunes a ${DIAS[ud.getDay()]} contra de lunes a ${DIAS[ud.getDay()]} de la semana pasada.</p>
    ${fila3('Esta semana vs la pasada',sumD(sem,u),sumD(semA,semAh),`${corto(sem)} al ${corto(u)}`,`${corto(semA)} al ${corto(semAh)}`)}
    ${fila3('Este mes vs el mes pasado',sumD(mes,u),sumD(iso(mA),iso(mAh)),`1 al ${ud.getDate()} de ${MESES[ud.getMonth()]}`,`1 al ${mAh.getDate()} de ${MESES[mA.getMonth()]}`)}
    ${fila3('Este mes vs hace un año',sumD(mes,u),sumD(iso(yA),iso(yAh)),`${MESES[ud.getMonth()]} ${ud.getFullYear()}`,`${MESES[yA.getMonth()]} ${yA.getFullYear()}`)}`;
}

// ---------- quitar cuenta / cambiar motivo
let hoja=null;
function abrirHoja(o){
  hoja=o; hoja.motivo=hoja.motivo||null;
  const notas=[...new Set((DATA.quitadas||[]).map(r=>r.nota).filter(Boolean))].slice(-30);
  const el=document.createElement('div');el.className='sheet-bg';el.id='sheet';
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
    <h3 id="shT">${o.modo==='quitar'?'Quitar cuenta':'Cambiar motivo'}</h3>
    <p class="sub">${esc(o.cuenta)} · ${fmt2(o.total)}${o.modo==='quitar'?' · se quita de MrTienda y queda registrada aquí':''}</p>
    <div class="mot">${(DATA.motivos||Object.keys(MOTIVOS_INFO)).filter(m=>m!=='Sin clasificar').map(m=>`<button data-mot="${esc(m)}" aria-pressed="${hoja.motivo===m}">${esc(m)}<small>${esc(MOTIVOS_INFO[m]||'')}</small></button>`).join('')}</div>
    <div class="field"><label for="shNota">Nota (quién comió, número de pedido…)</label><input id="shNota" list="shNotas" maxlength="120" value="${esc(o.nota||'')}" autocomplete="off"><datalist id="shNotas">${notas.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
    <div class="btns" style="margin-top:18px"><button class="btn" data-sh="cancelar" style="flex:1">Cancelar</button><button class="btn ${o.modo==='quitar'?'danger':'pri'}" data-sh="ok" style="flex:1.4" disabled>${o.modo==='quitar'?'Quitar cuenta':'Guardar'}</button></div>
  </div>`;
  document.body.appendChild(el);
  el.addEventListener('click',async e=>{
    if(e.target===el){cerrarHoja();return}
    const m=e.target.closest('[data-mot]');if(m){hoja.motivo=m.dataset.mot;el.querySelectorAll('[data-mot]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mot===hoja.motivo));el.querySelector('[data-sh="ok"]').disabled=false;return}
    const b=e.target.closest('[data-sh]');if(!b)return;
    if(b.dataset.sh==='cancelar'){cerrarHoja();return}
    b.disabled=true;b.textContent='Un momento…';
    const nota=$('#shNota').value.trim();
    try{
      const url=hoja.modo==='quitar'?'/api/eliminar-abierta':'/api/quitada-motivo';
      const body=hoja.modo==='quitar'?{archivo:hoja.archivo,referencia:hoja.ref,motivo:hoja.motivo,nota}:{id:hoja.id,motivo:hoja.motivo,nota};
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Holandesa-Action':'1'},body:JSON.stringify(body),credentials:'same-origin'});
      const j=await r.json().catch(()=>({ok:false,error:'Respuesta inválida ('+r.status+')'}));
      if(!j.ok) throw new Error(j.error||'No se pudo.');
      cerrarHoja();toast(hoja.modo==='quitar'?'Cuenta quitada · '+hoja.motivo:'Motivo actualizado');await cargar();
    }catch(err){b.disabled=false;b.textContent='Intentar de nuevo';toast(err.message)}
  });
}
function cerrarHoja(){const el=$('#sheet');if(el)el.remove()}
function toast(t){const o=document.createElement('div');o.className='toast';o.textContent=t;document.body.appendChild(o);setTimeout(()=>o.remove(),3200)}
function csvQuitadas(g){
  let q=(DATA.quitadas||[]).filter(r=>r.fecha>=rDesde&&r.fecha<=rHasta);
  if(g==='didi')q=q.filter(r=>(r.motivo||'').startsWith('Didi'));else if(g==='uber')q=q.filter(r=>(r.motivo||'').startsWith('Uber'));
  else if(g==='plataformas')q=q.filter(r=>/^(Didi|Uber)/.test(r.motivo||''));else if(g==='familia')q=q.filter(r=>r.motivo==='Familia');
  const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Fecha','Abrió','Cuenta','Motivo','Nota','Mesero','Importe','Detalle'],...q.map(r=>[r.fecha,r.abrio,r.cuenta,r.motivo,r.nota,r.mesero,(r.total||0).toFixed(2),(r.items||[]).map(i=>i.q+' '+i.n).join(', ')])];
  const blob=new Blob(['﻿'+rows.map(r=>r.map(c).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`cuentas_quitadas_${g}_${rDesde}_${rHasta}.csv`;document.body.appendChild(a);a.click();a.remove();
}

// ---------- pintar
function render(){
  const D=DATA.detalle[cur]; sel.value=cur;
  const i=days.indexOf(cur); $('#prev').disabled=i<=0; $('#next').disabled=i>=days.length-1;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  const n=D.borrados.length+D.cancelados.length+D.precios.length; const dot=$('#ctlDot'); dot.hidden=!n; dot.textContent=n;
  const na=esHoy()?(DATA.abiertas||[]).length:0; const td=$('#tkDot'); td.hidden=!na; td.textContent=na;
  const open=[...document.querySelectorAll('#view details[open]')].map(d=>d.querySelector('summary')?.textContent);
  $('#view').innerHTML= tab==='hoy'?vHoy(D):tab==='tickets'?vTickets(D):tab==='cortes'?vCortes(D):tab==='control'?vControl(D):vReportes();
  if(open.length) document.querySelectorAll('#view details').forEach(d=>{if(open.includes(d.querySelector('summary')?.textContent))d.open=true});
}
function irA(t){tab=t;st.tab=t;save();render();window.scrollTo(0,0)}
sel.onchange=()=>{cur=sel.value;render()};
$('#prev').onclick=()=>{const i=days.indexOf(cur);if(i>0){cur=days[i-1];render()}};
$('#next').onclick=()=>{const i=days.indexOf(cur);if(i<days.length-1){cur=days[i+1];render()}};
document.querySelector('nav.tabs').onclick=e=>{const b=e.target.closest('button');if(b)irA(b.dataset.tab)};
$('#view').addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-pm],[data-pt],[data-tm],[data-tt],[data-tk],[data-cm],[data-rp],[data-pq],[data-rq],[data-quitar],[data-motivo],[data-csv],[data-mes]');if(!t)return;
  const d=t.dataset;
  if(d.go) return irA(d.go);
  if(d.pm){prodModo=d.pm;return render()} if(d.pt){prodT=d.pt;return render()}
  if(d.tm){tkModo=d.tm;return render()} if(d.tt){tkT=d.tt;return render()}
  if(d.tk){document.querySelectorAll('details.tkt:not(.abierta)').forEach(x=>x.open=d.tk==='abrir');return}
  if(d.cm){corteModo=d.cm;return render()}
  if(d.rp){repModo=d.rp;st.rep=d.rp;save();return render()}
  if(d.pq){[pDesde,pHasta]=rangoRapido(d.pq);return render()}
  if(d.rq){[rDesde,rHasta]=rangoRapido(d.rq);return render()}
  if(d.csv) return csvQuitadas(d.csv);
  if(d.mes){e.preventDefault();mesSel=d.mes;render();window.scrollTo(0,0);return}
  if(d.quitar!=null){e.preventDefault();const a=(DATA.abiertas||[])[+d.quitar];if(a)abrirHoja({modo:'quitar',archivo:a.archivo,ref:a.ref??a.mesa,cuenta:a.mesa,total:a.total});return}
  if(d.motivo){e.preventDefault();const r=(DATA.quitadas||[]).find(x=>x.id===d.motivo);if(r)abrirHoja({modo:'motivo',id:r.id,cuenta:r.cuenta,total:r.total,motivo:r.motivo==='Sin clasificar'?null:r.motivo,nota:r.nota});return}
});
$('#view').addEventListener('change',e=>{const id=e.target.id,v=e.target.value;if(!v)return;
  if(id==='pD'){pDesde=v;render()}else if(id==='pH'){pHasta=v;render()}else if(id==='rD'){rDesde=v;render()}else if(id==='rH'){rHasta=v;render()}else if(id==='rMes'){mesSel=v;render()}else if(id==='cA'){cmpA=v;render()}else if(id==='cB'){cmpB=v;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarHoja()});

function hm(s){return new Date(s).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}
async function cargar(){
  try{
    let nd;
    if(COPIA) nd=window.__COPIA__;
    else{const r=await fetch('data.json?'+Date.now(),{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw new Error('HTTP '+r.status);nd=await r.json()}
    if(!nd.diario) throw new Error('sin datos');
    const wasLatest=!cur||cur===days[days.length-1];
    DATA=nd; byDate=Object.fromEntries(DATA.diario.map(x=>[x.fecha,x])); days=Object.keys(DATA.detalle).sort();
    if(wasLatest||!DATA.detalle[cur]) cur=days[days.length-1];
    sel.innerHTML=days.slice().reverse().map(d=>`<option value="${d}">${lbl(d)}</option>`).join('');
    $('#note').hidden=true; $('#live').classList.remove('off');
    $('#gen').textContent=(COPIA?'Copia del ':'')+(COPIA?new Date(DATA.generado).toLocaleDateString('es-MX',{day:'numeric',month:'short'})+' ':'')+hm(DATA.generado)+' · v'+(DATA.version||'');
    if(COPIA){$('#live').classList.add('off');$('#note').hidden=false;$('#note').textContent='Estás viendo la copia guardada en tu Google Drive, con todo hasta la hora de arriba. Para ver en vivo y quitar cuentas, abre la app normal con la caja prendida.'}
    else{const mins=(Date.now()-new Date(DATA.generado))/60000;if(mins>15){$('#live').classList.add('off');$('#note').hidden=false;$('#note').textContent='La última actualización fue hace '+Math.round(mins)+' minutos. Revisa que la computadora de la caja esté encendida y con internet.'}}
    if(!$('#sheet')) render();
  }catch(e){$('#live').classList.add('off');$('#gen').textContent='Sin conexión';$('#note').hidden=false;$('#note').textContent='No pude conectarme con la computadora de la caja. Revisa que esté encendida, con internet y con Tailscale activo. ('+e.message+')'}
}
cargar(); if(!COPIA) setInterval(cargar,120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!COPIA)cargar()});
</script>
