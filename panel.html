  if(d.cfej){CF_EJ=d.cfej;return cfMuestra()}
  if(d.cfguardar){t.disabled=true;return cfMuestra('guardar')}
  if(d.cfprueba){t.disabled=true;cfMuestra('prueba').finally(()=>{t.disabled=false});return}
  if(d.cnquitar){e.preventDefault();t.disabled=true;api('/api/clientes-nuevos',{accion:'quitar',id:d.cnquitar}).then(()=>{DATA.clientes_nuevos=(DATA.clientes_nuevos||[]).filter(x=>x.id!==d.cnquitar);render();toast('Quitado de la lista')}).catch(err=>{t.disabled=false;toast(err.message)});return}
  if(d.mspdf){e.preventDefault();enviarPdf(d.mspdf,NUEVO_MS);return}
  if(d.msenlace){e.preventDefault();abrirEnlaceMs((DATA.meseros||[]).find(x=>x.id===d.msenlace));return}
  if(d.msacceso){e.preventDefault();NUEVO_MS=null;NUEVO_MS_COD=null;fetch('/api/acceso',{credentials:'same-origin'}).then(r=>r.json()).then(j=>{ACCESO=j;ACCESO.cmd=true;render()}).catch(err=>toast(err.message));return}
  if(d.acceso){NUEVO_CJ=null;fetch('/api/acceso',{credentials:'same-origin'}).then(r=>r.json()).then(j=>{ACCESO=j;render()}).catch(err=>toast(err.message));return}
  if(d.fcsave&&CAPMODE){e.preventDefault();guardarCompra(t,false).then(()=>{toast('Compra guardada ✓');window.scrollTo(0,0);return cargarCaptura()}).catch(err=>{toast(err.message);t.disabled=false;t.textContent='Guardar'});return}
  if(d.gimp||d.gdel||d.fsave||d.fcsave||d.rcsave||d.rcdel){e.preventDefault();guardarGasto(t,d);return}
  if(d.pcfg||d.ppago||d.pborrar){e.preventDefault();guardarPlat(t,d);return}
  if(d.cetope){e.preventDefault();(async()=>{try{t.disabled=true;await api('/api/comida-emp',{accion:'tope',monto:$('#ceTope').value.trim()});toast('Tope guardado');await cargar(true)}catch(er){t.disabled=false;toast(er.message)}})();return}
  if(d.ct2){cmpTodos=!cmpTodos;return render()}
  if(d.mes){e.preventDefault();mesSel=d.mes;render();window.scrollTo(0,0);return}
  if(d.quitar!=null){e.preventDefault();const a=(DATA.abiertas||[])[+d.quitar];if(a){const k=a.canal||{},mot=k.canal==='didi'?(k.pago==='efectivo'?'Didi · efectivo':'Didi · tarjeta'):k.canal==='uber'?'Uber · tarjeta':k.canal==='empleado'?'Comida de empleado':null;
    abrirHoja({modo:'quitar',archivo:a.archivo,ref:a.ref??a.mesa,cuenta:a.mesa,total:a.total,motivo:mot,nota:k.pedido?'Pedido '+k.pedido:'',desc:k.desc!==''&&k.desc!=null?k.desc:null,cobrado:k.cobrado!==''&&k.cobrado!=null?k.cobrado:null,persona:k.canal==='empleado'?(k.completo||''):''})}return}
  if(d.motivo){e.preventDefault();const r=(DATA.quitadas||[]).find(x=>x.id===d.motivo);if(r)abrirHoja({modo:'motivo',id:r.id,cuenta:r.cuenta,total:r.total,motivo:r.motivo==='Sin clasificar'?null:r.motivo,nota:r.nota,persona:r.persona,desc:r.liq&&r.liq.capturado?r.liq.desc:null,comision:r.liq&&r.liq.manual?r.liq.comision:null,cobrado:r.liq&&!r.liq.sin_cobrado?r.liq.cobrado:null});return}
});
$('#view').addEventListener('change',e=>{const id=e.target.id,v=e.target.value;if(!v)return;
  if(id==='pD'){pDesde=v;render()}else if(id==='pH'){pHasta=v;render()}else if(id==='rD'){rDesde=v;render()}else if(id==='rH'){rHasta=v;render()}else if(id==='rMes'){mesSel=v;render()}else if(id==='cA'){cmpA=v;render()}else if(id==='cB'){cmpB=v;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarHoja()});
function fcRerender(){
  const ids=['fcProv','fcTk','fcCon','fcF','fcM','fcCat'],vals={};ids.forEach(i=>{const el=document.getElementById(i);if(el)vals[i]=el.value});
  const card=$('#fcCard');if(!card)return;card.outerHTML=formCompra(FCCTX);
  ids.forEach(i=>{const el=document.getElementById(i);if(el&&vals[i]!=null)el.value=vals[i]});$('#fcRes').innerHTML=fcResumen();
}
$('#view').addEventListener('input',e=>{const mi=e.target.closest('.mi');if(mi){const k=+mi.closest('.mrow').dataset.k;FC.manual[k][mi.dataset.f]=mi.value;const s_=$('#fcSuma');if(s_)s_.outerHTML=(()=>{const t=document.createElement('div');t.innerHTML=bloqueManual();return t.querySelector('#fcSuma').outerHTML})();return}
  if(e.target.id==='fcM'){const sm=$('#fcSuma');if(sm){const t=document.createElement('div');t.innerHTML=bloqueManual();sm.outerHTML=t.querySelector('#fcSuma').outerHTML}const r=$('#fcRes');if(r)r.innerHTML=fcResumen();const l=$('#fcLect');if(l&&FC.lect)l.innerHTML=bloqueLectura()}});
$('#view').addEventListener('keydown',e=>{if(e.target.id==='lgPin'&&e.key==='Enter')entrar()});
document.querySelector('header').addEventListener('click',e=>{if(e.target.closest('[data-salir]')){e.preventDefault();salirCaja()}});
$('#view').addEventListener('change',async e=>{
  const mi=e.target.closest('.mi');if(mi&&mi.tagName==='SELECT'){FC.manual[+mi.closest('.mrow').dataset.k].unidad=mi.value;return}
  const id=e.target.id;
  if(id==='fcFoto'||id==='fcFoto2'||id==='rcFoto'){const f=e.target.files&&e.target.files[0];if(!f)return;
    try{const u=await comprimir(f);if(id==='rcFoto'){RCFOTO=u;$('#rcFotoOk').textContent='✓ Foto lista'}else{FC.foto=u;FC.lect=null;$('#fcPrev').innerHTML=`<img src="${u}" alt="Foto del ticket" style="max-width:100%;max-height:200px;border-radius:12px;border:1px solid var(--line)">`;leerFoto()}}catch(err){toast(err.message)}}
});

function hm(s){return new Date(s).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}
async function cargar(force){
  try{
    let nd;
    if(COPIA) nd=window.__COPIA__;
    else{const r=await fetch('data.json?'+Date.now(),{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw new Error('HTTP '+r.status);nd=await r.json()}
    if(!nd.diario) throw new Error('sin datos');
    const wasLatest=!cur||cur===days[days.length-1], primera=!DATA;
    DATA=nd; byDate=Object.fromEntries(DATA.diario.map(x=>[x.fecha,x])); days=Object.keys(DATA.detalle).sort();
    if(wasLatest||!DATA.detalle[cur]) cur=days[days.length-1];
    sel.innerHTML=days.slice().reverse().map(d=>`<option value="${d}">${lbl(d)}</option>`).join('');
    $('#note').hidden=true; $('#live').classList.remove('off');
    $('#gen').textContent=(COPIA?'Copia del ':'')+(COPIA?new Date(DATA.generado).toLocaleDateString('es-MX',{day:'numeric',month:'short'})+' ':'')+hm(DATA.generado)+' · v'+(DATA.version||'');
    if(COPIA){$('#live').classList.add('off');$('#note').hidden=false;$('#note').textContent='Estás viendo la copia guardada en tu Google Drive, con todo hasta la hora de arriba. Para ver en vivo y quitar cuentas, abre la app normal con la caja prendida.'}
    else{const mins=(Date.now()-new Date(DATA.generado))/60000;if(mins>15){$('#live').classList.add('off');$('#note').hidden=false;$('#note').textContent='La última actualización fue hace '+Math.round(mins)+' minutos. Revisa que la computadora de la caja esté encendida y con internet.'}}
    if(!$('#sheet')&&(force||primera||!((tab==='reportes'&&repModo==='gastos')||tab==='rh'||tab==='cmd'))) render();
    if(primera&&!COPIA){const pc=new URLSearchParams(location.search).get('pdf');if(pc){const m=(DATA.meseros||[]).find(x=>x.cod===pc&&x.activo);if(m)abrirEnlaceMs(m);try{history.replaceState(null,'',location.pathname)}catch(_){}}}
  }catch(e){$('#live').classList.add('off');$('#gen').textContent='Sin conexión';$('#note').hidden=false;$('#note').textContent='No pude conectarme con la computadora de la caja. Revisa que esté encendida, con internet y con Tailscale activo. ('+e.message+')'}
}
const CAPMODE=!COPIA&&location.pathname.startsWith('/captura');
if(RHMODE){
  document.body.classList.add('rh');
  document.title='Personal Holandesa';document.querySelector('link[rel=manifest]').href='/manifest-personal.webmanifest';
  document.querySelector('link[rel=apple-touch-icon]').href='/icon_personal.png';document.querySelector('meta[name=theme-color]').content='#ffffff';
  document.querySelector('.datebar').hidden=true;document.querySelector('nav.tabs').hidden=true;document.querySelector('footer').hidden=true;
  document.querySelector('.brand h1').innerHTML='La Holandesa <span style="display:inline">· Personal</span>';
  $('#gen').textContent='Recursos Humanos';
  document.querySelector('.wrap').style.paddingBottom='40px';
  tab='rh';render();setTimeout(avisoSeguro,3000);
  // mientras se llena un expediente o una nómina no se manda nada a la caja; esto mantiene la sesión viva para que no se cierre a media captura
  setInterval(()=>{if(!document.hidden&&($('#rhForm')||document.querySelector('.rhn')))fetch('/api/acceso',{credentials:'same-origin',cache:'no-store'}).catch(()=>{})},240000);
}else if(CAPMODE){
  document.title='Compras Holandesa';document.querySelector('link[rel=manifest]').href='/manifest-caja.webmanifest';
  document.querySelector('.datebar').hidden=true;document.querySelector('nav.tabs').hidden=true;document.querySelector('footer').hidden=true;
  document.querySelector('.brand h1').innerHTML='La Holandesa <span style="display:inline">· Compras</span>';
  document.querySelector('.wrap').style.paddingBottom='40px';
  cargarCaptura();
}else{
  if(!COPIA){const l=document.createElement('a');l.id='lnkPersonal';l.href='/personal';l.textContent='Personal ›';l.setAttribute('aria-label','Abrir Personal (Recursos Humanos)');
    l.style.cssText='color:var(--hero-ink);font:700 12px var(--body);text-decoration:none;border:1px solid rgba(255,255,255,.55);border-radius:14px;padding:4px 10px;white-space:nowrap';
    const live=document.getElementById('live');if(live){live.parentNode.insertBefore(l,live);live.parentNode.style.flexWrap='wrap';live.parentNode.style.rowGap='6px'}
    const aj=document.createElement('a');aj.id='lnkAjustes';aj.href='#';aj.textContent='⚙️ Ajustes';aj.setAttribute('aria-label','Abrir Ajustes');aj.style.cssText=l.style.cssText;
    aj.onclick=e=>{e.preventDefault();irA('ajustes')};if(live)live.parentNode.insertBefore(aj,l)}
  cargar(); if(!COPIA) setInterval(cargar,120000);
  setTimeout(avisoSeguro,3000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!COPIA)cargar()});
}
</script>
</body></html>
