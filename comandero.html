<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>La Holandesa Comandero</title>
<link rel="manifest" href="/manifest-comandero.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icono_comandero_180.png?v=31">
<link rel="icon" type="image/png" sizes="192x192" href="/icono_comandero_192.png">
<link rel="shortcut icon" href="/icono_comandero_192.png">
<meta name="apple-mobile-web-app-title" content="Holandesa Comandero">
<meta name="application-name" content="Holandesa Comandero">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f6db3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-hand phone app; sticky top bar, scrolling content, sticky bottom action bar */
:root{
  --bg:#f2f6fb; --surface:#ffffff; --ink:#13202e; --muted:#5b6b7c; --line:#d9e3ee;
  --green:#2f6db3; --green-2:#3f82c9; --green-soft:#e3eefa; --orange:#e2711d; --orange-soft:#fdebdc;
  --bad:#b3322a; --bad-bg:#fbe5e2; --on-green:#ffffff;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#16202b; --ink:#e6eef7; --muted:#97a6b6; --line:#263446;
  --green:#86b6ea; --green-2:#6aa2df; --green-soft:#1b2c40; --orange:#f39a52; --orange-soft:#3a2614;
  --bad:#f08b80; --bad-bg:#3a1a17; --on-green:#0e1611; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#16202b; --ink:#e6eef7; --muted:#97a6b6; --line:#263446;
  --green:#86b6ea; --green-2:#6aa2df; --green-soft:#1b2c40; --orange:#f39a52; --orange-soft:#3a2614;
  --bad:#f08b80; --bad-bg:#3a1a17; --on-green:#0e1611; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);margin:0;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--green-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.demo{background:var(--orange-soft);color:var(--ink);font-size:13px;padding:8px 12px;border-radius:8px;margin-top:12px}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:28px 40px;text-align:center}
.logo{width:150px;max-width:50%;height:auto;display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{background:#f3f6f2;border-radius:16px;padding:10px}}
:root[data-theme="dark"] .logo{background:#f3f6f2;border-radius:16px;padding:10px}
.brand{font:800 34px/1 var(--display);font-stretch:80%;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin:0}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.who button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;font-weight:600;font-size:15px}
.who button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.dots{display:flex;gap:12px;justify-content:center;height:18px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--green)}
.dots i.on{background:var(--green)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pad button{height:64px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:700 24px var(--display)}
.pad button.ghost{border:0;background:none;font:600 14px var(--body);color:var(--muted)}
.err{color:var(--bad);font-weight:600;min-height:22px;font-size:14px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.top .back{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:20px;flex:none}
.top h1{font:800 20px/1.1 var(--display);font-stretch:85%;text-transform:uppercase;letter-spacing:.04em;margin:0;color:var(--green);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top small{display:block;font:500 12px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600;flex:none}
.mini{width:30px;height:auto;flex:none}

/* mesas */
.seg{display:flex;gap:6px;margin:14px 0}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.plano{position:relative;width:100%;aspect-ratio:100/112;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:6px;overflow:hidden}
.pent{position:absolute;left:2%;top:4%;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:2px 5px}
.pg{position:absolute;display:flex;gap:3px}.pg.v{flex-direction:column}
.pm{flex:1;min-width:0;border:2px solid #f0b37a;background:#fff;color:#1a1a1a;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;line-height:1.05}
.pm b{font:800 17px/1 var(--display)}.pm small{font-size:9.5px;color:#666;white-space:nowrap;overflow:hidden;max-width:100%}
.pm.ocu{background:#cfd6de;border-color:#7d8b99}.pm.ocu.mia{background:#2f7d4f;border-color:#1f5c38;color:#fff}.pm.ocu.mia small{color:#e6f3ea}
.pm.c1{background:#ffe7a3!important;border-color:#e0a800!important;color:#1a1a1a!important}.pm.c2{background:#f9c4bf!important;border-color:#c62828!important;color:#1a1a1a!important}
.pm.c1 small,.pm.c2 small{color:#333!important}.pm:disabled{opacity:.85}
.pley{display:flex;flex-wrap:wrap;gap:6px 12px;margin:8px 2px 0;font-size:12px;color:var(--muted)}.pley i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px;border:2px solid #f0b37a;background:#fff}
.pley i.mi{background:#2f7d4f;border-color:#1f5c38}.pley i.ot{background:#cfd6de;border-color:#7d8b99}.pley i.c1{background:#ffe7a3;border-color:#e0a800}
.seg.seg3{grid-template-columns:1fr 1fr .8fr}
.mesas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mesa{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:86px}
.mesa b{font:800 22px/1 var(--display);font-stretch:85%}
.mesa span{font-size:12px;color:var(--muted)}
.mesa.mine{border-color:var(--green);background:var(--green-soft)}
.mesa.k,.opciones button.k{background:var(--surface);border-width:2.5px;border-style:solid}
.k-comedor{border-color:#f4b67a!important}.k-comedor b,.opciones .k-comedor span{color:#d9822b!important}
.k-llevar{border-color:#5aa9e6!important}.k-llevar b,.opciones .k-llevar span{color:#2f8fd8!important}
.k-dom{border-color:#5fb880!important}.k-dom b,.opciones .k-dom span{color:#2e9b5c!important}
.k-didi{border-color:#f26a1b!important}.k-didi b,.k-didi span,.opciones .k-didi span{color:#f26a1b!important}
.k-uber{border-color:#06934a!important}.k-uber b,.k-uber span,.opciones .k-uber span{color:#06934a!important}
.mesa.c1{border:2px solid #e0a800!important;background:#fff7d6!important}
.mesa.c2{border:2px solid #c62828!important;background:#fde4e2!important}
.mesa .ctag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.mesa.c1 .ctag{color:#7a5600}.mesa.c2 .ctag{color:#c62828}
.mesa.other{opacity:.55}
.mesa .quien{font-weight:700;font-size:14px;color:var(--orange);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mesa.llevar{border-style:dashed;border-color:var(--orange)}
.mesa.llevar b{color:var(--orange)}
.modo button[data-pago]{border:2px solid #9aa7b6;background:#fff}
.modo button[aria-pressed="true"][data-pago],.modo button[aria-pressed="true"][data-cte]{background:var(--green);color:var(--on-green)}
.big.nueva{display:block;width:100%;margin:14px 0 4px;font-size:18px;padding:16px}
.opciones{display:flex;flex-direction:column;gap:8px}
.opciones button{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:15px 14px;font:800 18px var(--display);color:var(--ink);text-align:left}
.opciones button small{font:500 13px var(--body);color:var(--muted)}
.opciones button:active{background:var(--green-soft)}
.mesas.canales{grid-template-columns:repeat(2,minmax(0,1fr))!important}.mesas.canales .mesa{min-height:70px}.mesas.canales .mesa b{font-size:20px}
.mesa .t{font-weight:700;font-size:14px;color:var(--ink);margin-top:auto}
.section{font:800 13px var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:18px 0 8px}
.empty{color:var(--muted);font-size:14px}

/* menu */
.cats{display:flex;gap:6px;overflow-x:auto;padding-block:10px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;margin-top:10px}
.prods{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.prod{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.prod b{font-weight:600;font-size:14px;line-height:1.25}
.prod span{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.prod .opt{color:var(--orange);font-weight:600}

/* aqui / llevar */
.modo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.modo button{display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:none;border-radius:9px;padding:11px 6px;font:800 15px var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.modo button[aria-pressed="true"][data-modo="aqui"],.modo button[aria-pressed="true"][data-im="aqui"]{background:var(--green);color:var(--on-green)}
.modo button[aria-pressed="true"][data-modo="llevar"],.modo button[aria-pressed="true"][data-im="llevar"]{background:var(--orange);color:#fff}
.modo.small{margin-top:0}.modo.small button{font-size:14px;text-transform:none;letter-spacing:0}
.tag.llevar{background:var(--orange-soft);color:var(--orange)}
/* menu stripes */
.stripes{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.stripe{display:flex;justify-content:space-between;align-items:center;border:0;border-left:10px solid var(--sc);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;padding:18px 16px;font:800 18px var(--display);font-stretch:88%;text-transform:uppercase;letter-spacing:.05em;text-align:left;color:var(--ink)}
.stripe span{color:var(--sc);font-size:24px}
.stripe small{margin-left:auto;margin-right:10px;font:600 13px var(--body);color:var(--muted);letter-spacing:0}
.stripe.sub{border-left-width:6px;font-size:16px;padding:16px 14px}
.pane .stripes{margin-top:10px}
.grphead+.prods{margin-top:10px}
.stripe[aria-pressed="true"]{background:var(--sc);color:#fff}
.stripe[aria-pressed="true"] span{color:#fff}
.regresar{border:0;background:none;color:var(--green-2);font-weight:700;font-size:16px;padding:12px 0 4px}
.grphead{margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--sc);color:#fff;font:800 18px var(--display);text-transform:uppercase;letter-spacing:.06em}
.pane{min-width:0}
.split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.split .stripes{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.split .stripe{padding:14px 12px;font-size:15px}
@media (min-width:760px){.app{max-width:1000px}.prods{grid-template-columns:repeat(3,1fr)}}

/* order */
.lines{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.line:first-child{border-top:0}
.line .q{font:800 18px var(--display);color:var(--green);min-width:24px}
.line .d{font-size:13px;color:var(--muted)}
.line .x{border:0;background:none;color:var(--bad);font-size:13px;font-weight:600;padding:0}
.tag{display:inline-block;font:700 10px var(--body);text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:6px;background:var(--green-soft);color:var(--green);margin-left:4px;vertical-align:middle}
.tag.new{background:var(--orange-soft);color:var(--orange)}
.total{display:flex;justify-content:space-between;font:800 20px var(--display);padding:12px 2px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.big{flex:1;border:0;border-radius:12px;padding:14px;font:800 16px var(--display);text-transform:uppercase;letter-spacing:.06em;background:var(--green);color:var(--on-green)}
.big.alt{background:var(--surface);color:var(--green);border:1px solid var(--green);flex:none;padding-inline:16px}
.big:disabled{opacity:.4}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{font:800 22px/1.15 var(--display);font-stretch:85%;margin:0}
.sheet h3{font:800 13px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 0}
.sheet h3 em{font-style:normal;color:var(--orange)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.choices button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font:700 22px var(--display)}
.qty b{font:800 24px var(--display);min-width:28px;text-align:center}
textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit;min-height:60px;resize:vertical}
.alarma{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:40;background:#c62828;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;animation:late 1s ease-in-out infinite alternate}
.alarma b{font:800 17px var(--display)}.alarma p{margin:2px 0 0;font-size:14px}
.alarma button{margin-left:auto;flex:none;border:0;border-radius:10px;background:#fff;color:#c62828;font:800 14px var(--display);padding:10px 12px;text-transform:uppercase}
@keyframes late{from{box-shadow:0 10px 30px rgba(198,40,40,.35)}to{box-shadow:0 10px 36px rgba(198,40,40,.9)}}
.recuerda{background:#fff3c4;color:#5c4300;border:2px solid #e0a800;border-radius:12px;padding:12px;font:800 17px var(--display);text-align:center;animation:parpadeo 1s ease-in-out infinite}
.recuerda.sug{background:#e3f4e8;border-color:#2f9e5b;color:#123d22;animation-name:parpadeoVerde}
@keyframes parpadeo{0%,100%{background:#fff3c4;border-color:#e0a800}50%{background:#ffd84d;border-color:#b88600}}
@keyframes parpadeoVerde{0%,100%{background:#e3f4e8;border-color:#2f9e5b}50%{background:#b6e6c6;border-color:#1c7a42}}
.alarma.amarilla{background:#f5c400!important;color:#3d2e00;animation:alAm 1s ease-in-out infinite}
.alarma.amarilla button{color:#7a5600}
.alarma.rojaclara{background:#f28b82!important;color:#3d0000}
.alarma.rojaclara button{color:#a11}
.alarma.sirena{overflow:hidden}
.alarma.sirena::before{content:'';position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 300deg,rgba(255,255,255,.55) 330deg,transparent 360deg);animation:sirena 1.1s linear infinite;pointer-events:none}
.alarma.sirena>*{position:relative}
@keyframes sirena{to{transform:rotate(360deg)}}
.alarma.roja{background:#c62828!important;animation:alRo .7s ease-in-out infinite}
.alarma.cafe{background:#7a5600!important;animation:alCa 1s ease-in-out infinite}
@keyframes alAm{0%,100%{background:#f5c400}50%{background:#ffe680}}
@keyframes alRo{0%,100%{background:#c62828}50%{background:#ff5a4f}}
@keyframes alCa{0%,100%{background:#7a5600}50%{background:#b8860b}}
@media (prefers-reduced-motion:reduce){.recuerda,.alarma{animation:none!important}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px}
@media (max-width:360px){.mesas{grid-template-columns:repeat(2,1fr)}.pad{grid-template-columns:repeat(3,64px)}.pad button{height:58px}}
</style>
<style>
.aviso{background:var(--orange-soft);color:var(--ink);font-size:13px;line-height:1.35;padding:9px 12px;border-radius:10px;margin-top:12px}
.aviso b{color:var(--orange)}
.mesas{grid-template-columns:repeat(3,minmax(0,1fr))}
.mesa{min-width:0}
.mesa b,.mesa span{overflow-wrap:anywhere;max-width:100%}
.mesa.otra b,.mesa.llevar[data-k] b{font-size:16px;line-height:1.1}
@media (max-width:360px){.mesas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cargando{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted);font-weight:600}
.err2{background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;margin-top:12px}
.btnlink{border:0;background:none;color:var(--green-2);font-weight:700;padding:6px 0}
</style>
<div class="app" id="app"></div>
<div class="bar" id="bar" hidden><div class="in" id="barIn"></div></div>
<div id="sheet"></div>
<div class="toast" id="toast" hidden></div>
<div class="alarma" id="alarma" hidden></div>

const ocupaDe=id=>{const m=String(id||'').match(/^(\d{1,2})(A|B|AB)?$/);if(!m)return [];const g=PLANO.find(x=>x.g===m[1]);if(!g)return [id];
  return !m[2]||m[2]==='AB'?g.p:g.p.filter(x=>x===m[1]+m[2])};
const $=s=>document.querySelector(s);

const money=n=>'$'+(+n||0).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};

let M={cats:[]}, CUENTAS=[], ESCRIBE=false, poll=null;
const S={modo:'aqui',user:null,tok:null,pin:'',err:'',view:'login',filtro:'mias',sel:null,grp:null,sub:null,q:'',draft:[],nuevo:null,cargando:false,falla:''};

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,2200)}

// ---- servidor
async function cargar(conMenu){
  const r=await fetch('/api/comandero?'+(conMenu?'menu=1&':'')+'t='+Date.now(),{cache:'no-store',headers:{'X-Mesero-Token':S.tok||''}});
  const j=await r.json().catch(()=>({ok:false,error:'Sin respuesta de la caja'}));
  if(j.sesion===false){salir(j.error);throw new Error(j.error)}
  if(!j.ok)throw new Error(j.error||'No pude leer MrTienda');
  S.user=j.mesero;CUENTAS=j.cuentas||[];ESCRIBE=!!j.escribe;if(j.menu)M=j.menu;S.falla='';
}
async function entrar(pin){
  try{
    const r=await fetch('/api/mesero-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});
    const j=await r.json();
    if(!j.ok){S.err=j.error||'Clave incorrecta';return render()}
    S.tok=j.token;S.pinActual=pin;S.err='';await inicio();
  }catch(e){S.err='No hay conexión con la caja. ¿Estás en el WiFi del restaurante?';render()}
}
async function inicio(){
  S.view='cargando';render();
  try{await cargar(true);S.view='mesas';S.filtro='mias';render();clearInterval(poll);poll=setInterval(refrescar,20000)}
  catch(e){if(S.tok){S.view='mesas';S.falla=e.message;render()}}
}
async function refrescar(){
  if(!S.tok||S.view==='login')return;
  try{await cargar(false)}catch(e){S.falla=e.message}
  revisarDemoras();
  if(!$('#sheet').innerHTML&&S.view!=='menu')render();
}

let instalarEv=null;
const yaInstalada=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
try{if('serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('/comandero-sw.js',{scope:'/comandero'}).catch(()=>{})}catch(e){}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instalarEv=e;const b=document.getElementById('instalarBar');if(b&&!yaInstalada())b.hidden=false});
window.addEventListener('appinstalled',()=>{instalarEv=null;const b=document.getElementById('instalarBar');if(b)b.hidden=true;toast('Listo: ya está en tu pantalla de inicio')});
document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('instalarBar');if(b)b.onclick=async()=>{if(!instalarEv)return;instalarEv.prompt();try{await instalarEv.userChoice}catch(e){}instalarEv=null;b.hidden=true}});
const DEMORA_MIN=10, DEMORA_ROJA=14, DEMORA_CRITICA=20;
function vistos(){try{return JSON.parse(localStorage.getItem('cmd_demoras')||'{}')}catch(e){return {}}}
function guardaVistos(v){try{const k=Object.keys(v);if(k.length>300)k.slice(0,k.length-300).forEach(x=>delete v[x]);localStorage.setItem('cmd_demoras',JSON.stringify(v))}catch(e){}}
let alarmaK=null;
function revisarDemoras(){
  const el=$('#alarma');if(!el)return;
  if(!S.user||S.view==='login'){el.hidden=true;return}
  const ahora=new Date(),v=vistos(),pend=[];
  CUENTAS.filter(mia).forEach(c=>{
    const hs=[...new Set((c.items||[]).map(i=>i.h).filter(h=>/^\d{1,2}:\d{2}$/.test(h||'')))];
    hs.forEach(h=>{const [hh,mm]=h.split(':').map(Number);const t=new Date(ahora);t.setHours(hh,mm,0,0);if(t>ahora)t.setDate(t.getDate()-1);
      const min=(ahora-t)/6e4,k=c.archivo+'|'+(c.fecha||'')+'|'+h;
      const pz=v['p|'+k]&&Date.now()<v['p|'+k];   // "No ha salido": escondida 5 min
      if(min>=DEMORA_MIN&&min<180&&!v[k]&&!pz){const t=min>=DEMORA_CRITICA?'critica':min>=DEMORA_ROJA?'roja':'demora';pend.push({k,c,h,min,tipo:t,kv:k+'|'+t});
        if(t!=='demora'&&!v['s|'+k+'|'+t]){v['s|'+k+'|'+t]=1;guardaVistos(v);avisaTiempo('alarma',c.archivo,h)}}
      const kp='postre|'+k;
      if(min>=20&&min<240&&!v[kp]&&(c.items||[]).some(i=>i.h===h&&esComidaDia(i.n)))pend.push({k:kp,c,h,min,tipo:'postre'})});
  });
  if(!pend.length){el.hidden=true;alarmaK=null;return}
  const rk={critica:3,roja:2,demora:1,postre:0};pend.sort((a,b)=>(rk[b.tipo]||0)-(rk[a.tipo]||0)||b.min-a.min);const a=pend[0],n=numMesa(a.c.ref),k=canalDe(a.c);
  const quien=n?'Mesa '+mesaTxt(n):(k?canalTxt(k):a.c.ref);
  el.innerHTML=a.tipo==='postre'
    ?`<div><b>🍮 ${esc(quien)}: ¿ya llevaste el postre?</b><p>Comida del día de las ${esc(a.h)}.${pend.length>1?` (+${pend.length-1} avisos más)`:''}</p></div><button data-act="yasalio" data-dk="${esc(a.k)}">Ya lo llevé</button>`
    :`<div><b>${a.tipo==='critica'?'🚨 CRÍTICO: ya tardó la comanda':'⏰'} ${esc(quien)}</b><p>La comanda de las ${esc(a.h)} lleva ${Math.floor(a.min)} min. Revisa con cocina.${pend.length>1?` (+${pend.length-1} avisos más)`:''}</p></div><span style="display:flex;flex-direction:column;gap:6px;margin-left:auto"><button data-act="yasalio" data-dk="${esc(a.k)}">Ya salió</button><button data-act="nosalio" data-dk="${esc(a.k)}" style="background:rgba(255,255,255,.75)">No ha salido</button></span>`;
  el.className='alarma '+(a.tipo==='postre'?'cafe':a.tipo==='critica'?'roja sirena':a.tipo==='roja'?'rojaclara sirena':'amarilla');
  el.hidden=false;
  const ka=a.kv||a.k;   // suena otra vez cuando pasa de amarilla a roja
  if(alarmaK!==ka){alarmaK=ka;try{navigator.vibrate&&navigator.vibrate([400,200,400])}catch(e){}pitido()}
}
function avisaTiempo(ev,archivo,h){fetch('/api/comandero/tiempo',{method:'POST',headers:{'Content-Type':'application/json','X-Mesero-Token':S.tok||''},body:JSON.stringify({ev,archivo,h})}).catch(()=>{})}
function pitido(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ac=pitido.ac||(pitido.ac=new C());const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.35)}catch(e){}}
setInterval(revisarDemoras,30000);
// ---- comida del día: recordatorio para el mesero
// comida del día: por nombre (aunque esté abreviado) o porque está en la sección "Especial del día" del menú de MrTienda
const sinAcento=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const nombresEspecial=()=>{const c=(M.cats||[]).find(c=>/especial/i.test(sinAcento(c.n))&&/dia/i.test(sinAcento(c.n)));return new Set(c?(c.i||[]).map(x=>sinAcento(x.n)):[])};
const esComidaDia=n=>{const t=sinAcento(n);return /COM(IDA)?\.?\s*(DEL?\s*)?DIA|ESPECIAL\s*(DEL?\s*)?DIA|MEDIO\s*DIA|^COMIDA\s+(COMPLETA|SIN\s*AGUA|S\/\s*AGUA)/.test(t)||nombresEspecial().has(t)};
const CATS_DESAYUNO=['Desayunos Tradicionales','Omellettes','Hot Cakes','Chilaquiles','Burritos En Desayuno','Lo Nuevo En Desayunos','Desayunos Especialidades'];
const CATS_CARTA=['Ordenes A La Carta','Antojitos Mexicanos','Ensaladas','Burritos Solos','Burritos 1/2 Orden','Burritos Orden','Tortas','Sandwiches','Hamburguesas'];
const catDe=id=>{const c=(M.cats||[]).find(c=>(c.i||[]).some(x=>x.id===id));return c?c.n.toLowerCase():''};
const enPersona=()=>{const k=S.sel&&S.sel.k?canalDe(cuentaDe(S.sel.k)):(S.sel&&S.sel.canal);return !k||k.canal==='recoger'};   // comedor o para llevar (no domicilio, Didi ni Uber)
function ofertaDe(p){
  if(!enPersona())return null;
  const c=catDe(p.id);
  if(CATS_DESAYUNO.some(x=>x.toLowerCase()===c))return {k:'jugo',t:'🍊 Ofrece jugo',d:'Hoy tenemos <b>jugo del día</b> y <b>jugo verde</b>.'};
  const nom=sinAcento(p.n);
  if(CATS_CARTA.some(x=>x.toLowerCase()===c)||/BURRITO|HAMBURGUESA|TORTA|BISTEC|EMPANIZAD|MILANESA|SANDWICH|SANDWICH/.test(nom))
    return {k:'soda',t:'🥤 Ofrece la soda italiana, la especial de la casa',d:'Agua mineral con extracto de fresa.'};
  return null;
}
const recuerdaComida=n=>/S\/?\s*AGUA|SIN\s*AGUA/.test(sinAcento(n))?'🍲 Lleva la sopa (sin agua)':'🍲 Lleva la sopa y el agua';
function salir(msg){S.tok=null;store.set('cmd_tok',null);S.user=null;S.pin='';S.view='login';S.err=msg||'';S.draft=[];clearInterval(poll);render()}

// ---- cuentas: la referencia de MrTienda dice la mesa (M 2, MESA9) o el nombre (LLEVAR, DIDI…)
const numMesa=ref=>{const m=String(ref||'').trim().match(/^(?:M|MESA)\s*-?\s*(\d{1,2})\s*(A|B|AB)?$/i);return m?String(+m[1])+(m[2]||'').toUpperCase():null};
function ocupacion(){const o={};CUENTAS.forEach(c=>{const n=numMesa(c.ref);if(n)ocupaDe(n).forEach(x=>{if(!o[x])o[x]=c})});return o}
// dibuja el plano; modo 'elegir' (nueva cuenta: solo se tocan las libres) o 'ver' (pantalla principal: libres abren cuenta, ocupadas abren la cuenta)
function planoHTML(modo){
  const o=ocupacion(),ahora=new Date();
  const mins=c=>{if(!c.abrio)return '';const [h,m]=c.abrio.split(':').map(Number);const t=new Date(ahora);t.setHours(h,m,0,0);if(t>ahora)t.setDate(t.getDate()-1);const x=Math.round((ahora-t)/6e4);return x<60?x+' min':Math.floor(x/60)+' h '+(x%60)+' m'};
  const pieza=id=>{const c=o[id];
    if(c){const m_=mia(c),ct=c.cortes||0;
      return `<button class="pm ocu${m_?' mia':''}${ct>=2?' c2':ct===1?' c1':''}" ${modo==='ver'?`data-k="${esc(c.archivo)}"`:'disabled'}><b>${id}</b><small>${esc((c.mesero||'').split(' ')[0])}</small><small>${mins(c)}</small></button>`}
    return `<button class="pm" data-${modo==='ver'?'mapalibre':'libre'}="${id}"><b>${id}</b><small>Libre</small></button>`};
  return `<div class="plano"><span class="pent">Entrada</span>${PLANO.map(g=>`<div class="pg${g.v?' v':''}" style="left:${g.x}%;top:${g.y}%;width:${g.w}%;height:${g.h}%;${g.r?`transform:rotate(${g.r}deg)`:''}">${g.p.map(pieza).join('')}</div>`).join('')}</div>
    <div class="pley"><span><i class="l"></i>Libre</span><span><i class="mi"></i>Tuya</span><span><i class="ot"></i>De otro mesero</span><span><i class="c1"></i>Corte anterior</span></div>`;
}
// elegir mesa libre: si su pareja (A/B) también está libre, pregunta si se juntan
function elegirMesa(id){
  const g=PLANO.find(x=>x.p.includes(id)),o=ocupacion();
  if(g&&g.p.length===2&&!g.p.some(x=>o[x])){
    $('#sheet').innerHTML=`<div class="veil" data-act="cerrar"><div class="sheet"><h2>Mesa ${id}</h2><div class="opciones"><button class="k k-comedor" data-libre1="${id}"><span>Solo la ${id}</span><small>Mesa separada</small></button><button class="k k-comedor" data-libre1="${g.g}AB"><span>Juntar ${g.p.join(' + ')}</span><small>Para 6 personas aprox.</small></button></div></div></div>`;return}
  hojaPersonas(id)}
const mia=c=>S.user&&c.cod===S.user.cod;
const cuentaDe=k=>CUENTAS.find(c=>c.archivo===k);
const itemsDe=c=>c?c.items.map(i=>({n:i.n,qty:i.q,price:i.q?i.imp/i.q:i.imp,detail:i.det,llevar:i.llevar,sent:true,h:i.h})):[];
function titulo(){
  if(S.sel&&S.sel.k){const c=cuentaDe(S.sel.k);if(c){const n=numMesa(c.ref);if(n)return 'Mesa '+mesaTxt(n);const k=canalDe(c);return k?canalTxt(k):(c.llevar?'Llevar · ':'')+c.ref}}
  if(S.sel&&S.sel.canal)return canalTxt(S.sel.canal);
  if(S.sel&&S.sel.mesa)return 'Mesa '+S.sel.mesa+(S.sel.pers?' · '+S.sel.pers+' pers.':'');
  if(S.sel&&S.sel.nombre)return 'Llevar · '+S.sel.nombre;
  return 'Cuenta';

  if(a==='menu'){S.view='menu';S.grp=null;S.sub=null;S.q='';return render()}
  if(a==='grupos'){S.grp=null;S.sub=null;window.scrollTo(0,0);return render()}
  if(a==='subs'){S.sub=null;window.scrollTo(0,0);return render()}
  if(a==='cuenta'){S.view='cuenta';return render()}
  if(a==='enviar'){
    if(!ESCRIBE){$('#sheet').innerHTML=`<div class="veil" data-act="cerrar"><div class="sheet"><h2>Todavía no se envía</h2><p style="margin:0">El envío a MrTienda está apagado. El pedido se tiene que capturar en la caja.</p><p style="margin:0" class="empty">Tus platillos siguen en la cuenta como "Nuevo" para que los captures.</p><button class="big" data-act="cerrar">Entendido</button></div></div>`;return}
    return enviar(t)}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refrescar()});
if(S.tok)inicio();else render();
</script>
