<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ea580c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>Control Holandesa</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="/icono_panel_180.png?v=31">
<style>
:root{--bg:#fbf6f1;--surface:#fff;--surface-2:#fbf7f3;--ink:#1f1a17;--muted:#6b5e55;--line:#efe3d8;--o:#ea580c;--o2:#c2410c;--soft:#ffedd5;--bad:#b4342b;--bad-bg:#fbe6e3;--small:#1c0a02}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#120d0a;--surface:#1c1511;--surface-2:#231a15;--ink:#f3ebe5;--muted:#ab9b8f;--line:#33261e;--soft:#3a2010;--bad:#f08b80;--bad-bg:#3a1a17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120d0a;--surface:#1c1511;--surface-2:#231a15;--ink:#f3ebe5;--muted:#ab9b8f;--line:#33261e;--soft:#3a2010;--bad:#f08b80;--bad-bg:#3a1a17;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{background:var(--o);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px 26px;text-align:center}
header h1{margin:0;font:900 26px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
header p{margin:8px 0 0;color:var(--small);font-weight:600;font-size:14px}
main{flex:1;width:100%;max-width:420px;margin:0 auto;padding:24px 16px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 6px 18px -10px rgba(124,45,18,.25)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:14px;font:600 16px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--o2);border-color:var(--o2);color:#fff;font-size:17px;padding:16px}
.btn:disabled{opacity:.55}
.btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);font:16px system-ui,sans-serif;padding:0 12px}
input:focus-visible,.btn:focus-visible,a:focus-visible{outline:2px solid var(--o);outline-offset:2px}
.msg{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-size:14px}
.nota{margin:12px 0 0;padding:12px;border-radius:12px;background:var(--soft);font-size:14px}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:18px 0 4px}.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.link{background:none;border:0;color:var(--o2);font:600 14px system-ui,sans-serif;padding:10px 0 0;cursor:pointer;width:100%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .link{color:#fb923c}}
</style></head><body>
<header><h1>La Holandesa</h1><p>Control de ventas</p></header>
<main><div class="card">
  <div id="zHuella" hidden>
    <button class="btn pri" id="bHuella"><svg viewBox="0 0 24 24"><path d="M12 11v3a7 7 0 0 1-1 3.5M8.5 9.5A4 4 0 0 1 16 11v1.5M5.5 8A7.5 7.5 0 0 1 19 9.5M6 12v1a10 10 0 0 0 1.2 4.7M12 6.5a5 5 0 0 1 4.8 3.7M18.4 14a14 14 0 0 1-.8 4M9 21a11 11 0 0 1-1.5-3.2M14.5 20.5A10 10 0 0 0 16 15"/></svg>Entrar con huella</button>
    <p class="msg" id="mHuella" hidden></p>
    <button class="link" id="bVerClave">Entrar con contraseña</button>
  </div>
  <form id="fClave">
    <label for="u">Usuario</label><input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="c">Contraseña</label><input id="c" type="password" autocomplete="current-password" required>
    <button class="btn pri" style="margin-top:18px" id="bEntrar">Entrar</button>
    <p class="msg" id="mClave" hidden></p>
  </form>
  <div id="zActivar" hidden>
    <p style="margin:0 0 6px;font-weight:700;font-size:17px">¿Entrar con tu huella la próxima vez?</p>
    <p style="margin:0 0 16px;color:var(--muted);font-size:14px">Tu teléfono te pedirá la huella para activarla. La huella no sale de tu teléfono; la computadora de la caja solo guarda una llave para reconocerlo.</p>
    <button class="btn pri" id="bActivar">Activar huella</button>
    <p class="msg" id="mActivar" hidden></p>
    <button class="link" id="bAhoraNo">Ahora no</button>
  </div>
  <div id="zSeguro" hidden></div>
</div></main>
<script>
const $=s=>document.querySelector(s);
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
const post=async(u,b)=>{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json','X-Holandesa-Action':'1'},body:JSON.stringify(b||{}),credentials:'same-origin'});const j=await r.json().catch(()=>({ok:false,error:'Sin respuesta ('+r.status+')'}));if(!j.ok)throw new Error(j.error||'No se pudo.');return j};
const puedeHuella=!!(window.PublicKeyCredential&&window.isSecureContext&&navigator.credentials);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};
const seguir=()=>location.replace(location.pathname+location.search);
let INFO={ids:[]};
function err(id,t){const e=$(id);e.textContent=t;e.hidden=!t}
function msgHuella(e){
  if(e&&e.name==='NotAllowedError')return 'Se canceló o no se reconoció la huella. Intenta otra vez o entra con tu contraseña.';
  if(e&&e.name==='InvalidStateError')return 'Este teléfono ya tiene la huella activada.';
  return (e&&e.message)||'No se pudo usar la huella.';
}
async function conHuella(){
  const b=$('#bHuella');b.disabled=true;err('#mHuella','');
  try{
    const r=await post('/api/huella/reto',{modo:'entrar'});
    const cr=await navigator.credentials.get({publicKey:{challenge:unb(r.reto),rpId:location.hostname,timeout:60000,userVerification:'required',
      allowCredentials:r.ids.map(id=>({type:'public-key',id:unb(id),transports:['internal','hybrid']}))}});
    await post('/api/huella/entrar',{id:b64u(cr.rawId),cd:b64u(cr.response.clientDataJSON),ad:b64u(cr.response.authenticatorData),sig:b64u(cr.response.signature)});
    seguir();
  }catch(e){err('#mHuella',msgHuella(e));b.disabled=false}
}
async function activar(){
  const b=$('#bActivar');b.disabled=true;err('#mActivar','');
  try{
    const r=await post('/api/huella/reto',{modo:'registrar'});
    const cr=await navigator.credentials.create({publicKey:{challenge:unb(r.reto),rp:{name:'La Holandesa',id:location.hostname},
      user:{id:unb(r.uid),name:r.usuario,displayName:'Jorge · La Holandesa'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},attestation:'none',timeout:60000,
      excludeCredentials:r.ids.map(id=>({type:'public-key',id:unb(id)}))}});
    const ua=navigator.userAgent, nom=/SM-|Samsung/i.test(ua)?'Samsung':/iPhone/.test(ua)?'iPhone':/Android/.test(ua)?'Teléfono Android':/Windows/.test(ua)?'Computadora Windows':'Este dispositivo';
    await post('/api/huella/registrar',{cd:b64u(cr.response.clientDataJSON),ao:b64u(cr.response.attestationObject),nombre:nom});
    ls('hol_huella','1');seguir();
  }catch(e){err('#mActivar',msgHuella(e));b.disabled=false}
}
$('#fClave').addEventListener('submit',async e=>{
  e.preventDefault();const b=$('#bEntrar');b.disabled=true;err('#mClave','');
  try{await post('/api/entrar',{usuario:$('#u').value.trim(),contrasena:$('#c').value});
    if(puedeHuella&&ls('hol_huella')!=='1'&&ls('hol_huella_no')!=='1'){$('#fClave').hidden=true;$('#zHuella').hidden=true;$('#zSeguro').hidden=true;$('#zActivar').hidden=false;return}
    seguir();
  }catch(er){err('#mClave',er.message);b.disabled=false}
});
$('#bHuella').onclick=conHuella;$('#bActivar').onclick=activar;
$('#bAhoraNo').onclick=()=>{ls('hol_huella_no','1');seguir()};
$('#bVerClave').onclick=()=>{$('#fClave').hidden=false;$('#bVerClave').hidden=true;$('#u').focus()};
fetch('/api/entrar-info',{cache:'no-store',credentials:'same-origin'}).then(r=>r.json()).then(j=>{
  INFO=j;
  if(puedeHuella&&j.ids&&j.ids.length){$('#zHuella').hidden=false;
    if(ls('hol_huella')==='1'){$('#fClave').hidden=true;conHuella();return}   // este teléfono activó la huella: la pide de una vez
    $('#bVerClave').hidden=true;return}
  if(!window.isSecureContext&&j.https){const z=$('#zSeguro');z.hidden=false;
    z.innerHTML=`<div class="nota"><b>¿Quieres entrar con tu huella?</b><br>La huella solo funciona en la dirección segura. Ábrela, entra una vez con tu contraseña y activa la huella.</div><a class="btn" style="margin-top:12px" href="${j.https}${location.pathname==='/'?'/panel':location.pathname}">Abrir dirección segura</a>`}
}).catch(()=>{});
</script></body></html>
